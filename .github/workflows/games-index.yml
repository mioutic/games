name: Rebuild arcade index

on:
  push:
    paths:
      - 'arcade/games/**'
      - 'arcade/tools/build-index.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arcade-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild games.json
        run: python3 arcade/tools/build-index.py

      - name: Commit if it changed
        run: |
          if git diff --quiet -- arcade/games.json; then
            echo "index already up to date"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arcade/games.json
          git commit -m "Rebuild arcade index [skip ci]"
          git push
