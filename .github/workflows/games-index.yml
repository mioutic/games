name: Rebuild arcade index

on:
  push:
    paths:
      - 'arcade/index.html'
      - 'arcade/games/**'
      - 'arcade/tools/**'
      - 'arcade/VERSION'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arcade-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild games.json and the installable play/ build
        run: |
          python3 arcade/tools/build-index.py
          python3 arcade/tools/build-pwa.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- arcade/games.json play/; then
            echo "already up to date"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arcade/games.json play/
          git commit -m "Rebuild arcade index and play/ build [skip ci]"
          git push
