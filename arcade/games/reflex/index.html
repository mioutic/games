<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reflex</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; background: #0b0b12; color: #f2f2f7; overflow: hidden;
    font: 400 17px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #app { height: 100%; display: flex; flex-direction: column;
         padding: 14px calc(env(safe-area-inset-right,0px) + 14px)
                  calc(env(safe-area-inset-bottom,0px) + 14px) calc(env(safe-area-inset-left,0px) + 14px); }

  .hud { flex: none; display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .hud .stat { text-align: center; flex: 1; }
  .hud .k { font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: #8e8e99; }
  .hud .v { font-size: 21px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .hud .v.warm { color: #ffb020; }

  .board { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr);
           gap: 10px; min-height: 0; }
  .tile { border-radius: 18px; background: #16161f; border: 1px solid #272733;
          transition: background .09s ease, transform .09s ease, border-color .09s ease; }
  .tile.lit { background: linear-gradient(150deg, #ffc94d, #ffb020); border-color: #ffd882;
              box-shadow: 0 0 34px -6px rgba(255,176,32,.75); }
  .tile.hit { transform: scale(.9); }
  .tile.bad { background: #33161c; border-color: #a3324a; }

  .overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px;
             background: rgba(11,11,18,.9); backdrop-filter: blur(14px); text-align: center; }
  .overlay.hide { display: none; }
  .overlay h2 { font-size: 30px; font-weight: 700; letter-spacing: -.02em; margin: 0 0 8px; }
  .overlay p { color: #8e8e99; font-size: 14.5px; margin: 0 0 22px; max-width: 280px; line-height: 1.55; }
  .big { font-size: 56px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums;
         background: linear-gradient(100deg,#ffc94d,#ff5c9d); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .big small { font-size: 20px; font-weight: 600; -webkit-text-fill-color: #8e8e99; }
  button.go { appearance: none; border: 0; border-radius: 999px; padding: 15px 40px; font-size: 17px; font-weight: 600;
              color: #14141c; background: linear-gradient(100deg,#ffc94d,#ffb020); }
  button.go:active { transform: scale(.95); }
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <div class="stat"><div class="k">Round</div><div class="v" id="round">0<small style="font-size:13px;color:#55555f">/15</small></div></div>
    <div class="stat"><div class="k">Last</div><div class="v" id="last">—</div></div>
    <div class="stat"><div class="k">Best avg</div><div class="v warm" id="best">—</div></div>
  </div>
  <div class="board" id="board"></div>
</div>

<div class="overlay" id="overlay">
  <div>
    <div id="head">
      <h2>Reflex</h2>
      <p>One tile lights up. Tap it. Fifteen rounds, and we average your reaction time.</p>
    </div>
    <button class="go" id="go">Start</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var ROUNDS = 15, TILES = 12, BKEY = 'reflex.best';

  var board   = document.getElementById('board');
  var overlay = document.getElementById('overlay');
  var head    = document.getElementById('head');
  var elRound = document.getElementById('round');
  var elLast  = document.getElementById('last');
  var elBest  = document.getElementById('best');

  var tiles = [], times = [], round = 0, active = -1, litAt = 0, waiting = null;

  for (var i = 0; i < TILES; i++) {
    var t = document.createElement('div');
    t.className = 'tile';
    t.dataset.i = i;
    board.appendChild(t);
    tiles.push(t);
  }

  var best = parseFloat(localStorage.getItem(BKEY) || '0') || 0;
  if (best) elBest.textContent = Math.round(best) + 'ms';

  board.addEventListener('pointerdown', function (e) {
    var t = e.target.closest('.tile');
    if (!t || active < 0) return;
    e.preventDefault();

    if (+t.dataset.i === active) {
      var ms = performance.now() - litAt;
      times.push(ms);
      elLast.textContent = Math.round(ms) + 'ms';
      t.classList.remove('lit');
      t.classList.add('hit');
      setTimeout(function () { t.classList.remove('hit'); }, 110);
      active = -1;
      if (round >= ROUNDS) finish(); else next();
    } else {
      // Missing costs you: a 150ms penalty folded into this round.
      t.classList.add('bad');
      setTimeout(function () { t.classList.remove('bad'); }, 140);
      litAt -= 150;
      if (navigator.vibrate) navigator.vibrate(12);
    }
  });

  function next() {
    round++;
    elRound.innerHTML = round + '<small style="font-size:13px;color:#55555f">/' + ROUNDS + '</small>';
    var delay = 450 + Math.random() * 1250;
    waiting = setTimeout(function () {
      var i;
      do { i = Math.floor(Math.random() * TILES); } while (i === active);
      active = i;
      tiles[i].classList.add('lit');
      litAt = performance.now();
    }, delay);
  }

  function finish() {
    var avg = times.reduce(function (a, b) { return a + b; }, 0) / times.length;
    var isBest = !best || avg < best;
    if (isBest) { best = avg; localStorage.setItem(BKEY, String(avg)); elBest.textContent = Math.round(avg) + 'ms'; }

    head.innerHTML =
      '<div class="big">' + Math.round(avg) + '<small>ms avg</small></div>' +
      '<p>' + (isBest ? 'New personal best.' : 'Best is ' + Math.round(best) + 'ms.') +
      ' Fastest single tap: ' + Math.round(Math.min.apply(null, times)) + 'ms.</p>';
    document.getElementById('go').textContent = 'Again';
    overlay.classList.remove('hide');
  }

  document.getElementById('go').addEventListener('click', function () {
    clearTimeout(waiting);
    tiles.forEach(function (t) { t.className = 'tile'; });
    times = []; round = 0; active = -1;
    elLast.textContent = '—';
    overlay.classList.add('hide');
    next();
  });
})();
</script>
</body>
</html>
