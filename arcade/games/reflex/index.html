<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reflex</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>
  /* Sanguine — see DESIGN.md */
  :root {
    --s-0: #0b0609;  --s-1: #12080c;  --s-2: #1a0d12;
    --t-0: #f2e6e6;  --t-1: #c3a9ad;  --t-2: #8f6f76;  --t-3: #5c434a;
    --accent: #e9d8c5;  --accent-2: #b81d3a;  --brand: #d9557a;
    --line-0: #150a0e;  --line-1: #2a141c;  --line-2: #3d1f28;
    --error: #ff5470;
    --bloom: 0 0 12px rgba(216,58,88,.45), 0 0 26px rgba(216,58,88,.16);
    --bloom-lg: 0 0 22px rgba(216,58,88,.45), 0 0 52px rgba(216,58,88,.16);
    --font-display: Georgia, "Times New Roman", serif;
    --font-ui: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    --radius: 2px;  --dur: 160ms;  --ease: cubic-bezier(.2,.6,.2,1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--s-0); color: var(--t-0);
    font: 400 16px/1.45 var(--font-ui); -webkit-font-smoothing: antialiased;
    overscroll-behavior: none; touch-action: manipulation;
  }
  #app {
    height: 100%; display: flex; flex-direction: column;
    padding: 14px calc(env(safe-area-inset-right,0px) + 14px)
             calc(env(safe-area-inset-bottom,0px) + 14px) calc(env(safe-area-inset-left,0px) + 14px);
  }

  /* instrument rail */
  .hud { flex: none; display: flex; border: 1px solid var(--line-1); border-radius: var(--radius);
         background: var(--s-1); margin-bottom: 12px; }
  .stat { flex: 1; padding: 9px 6px 8px; text-align: center; border-right: 1px solid var(--line-0); }
  .stat:last-child { border-right: 0; }
  .k { font: 500 9px/1 var(--font-ui); letter-spacing: .16em; text-transform: uppercase; color: var(--t-2); }
  .v { margin-top: 6px; font: 500 19px/1 var(--font-mono); font-variant-numeric: tabular-nums; color: var(--t-0); }
  .v small { font-size: 11px; color: var(--t-3); }
  .v.brandish { color: var(--brand); }

  /* progress: a segmented gauge, one segment per round */
  .gauge { flex: none; display: flex; gap: 2px; margin-bottom: 12px; }
  .seg { flex: 1; height: 3px; background: var(--line-1); transition: background var(--dur) var(--ease); }
  .seg.on { background: var(--accent-2); }

  .board { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr);
           grid-template-rows: repeat(4, 1fr); gap: 8px; min-height: 0; }
  .cell {
    border-radius: var(--radius); background: var(--s-1); border: 1px solid var(--line-1);
    position: relative;
    transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease),
                box-shadow var(--dur) var(--ease), transform 90ms var(--ease);
  }
  .cell::after {                       /* corner bracket, machined bezel */
    content: ""; position: absolute; right: 5px; bottom: 5px; width: 6px; height: 6px;
    border-right: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2);
  }
  .cell.lit {
    background: var(--accent); border-color: var(--accent);
    box-shadow: var(--bloom-lg);
  }
  .cell.lit::after { border-color: rgba(11,6,9,.28); }
  .cell.hit { transform: scale(.94); }
  .cell.bad { border-color: var(--error); background: rgba(255,84,112,.14); }

  .overlay {
    position: absolute; inset: 0; display: grid; place-items: center; padding: 24px;
    background: rgba(5,2,3,.9); text-align: center;
  }
  .overlay.hide { display: none; }
  .overlay h2 { font: 400 30px/1.1 var(--font-display); letter-spacing: .04em; margin: 0 0 10px; }
  .overlay p { color: var(--t-2); font-size: 13.5px; margin: 0 0 24px; max-width: 290px;
               line-height: 1.65; margin-inline: auto; }
  .big { font: 500 54px/1 var(--font-mono); font-variant-numeric: tabular-nums;
         color: var(--accent); letter-spacing: -.02em; }
  .big small { font: 500 11px/1 var(--font-ui); letter-spacing: .16em; text-transform: uppercase;
               color: var(--t-2); display: block; margin-top: 10px; }
  .ornament { color: var(--accent-2); font-size: 15px; margin-bottom: 14px; }
  button.go {
    appearance: none; border: 1px solid var(--accent); border-radius: var(--radius);
    padding: 13px 34px; background: var(--accent); color: var(--s-0);
    font: 500 11px/1 var(--font-ui); letter-spacing: .18em; text-transform: uppercase;
    transition: box-shadow var(--dur) var(--ease), transform 90ms var(--ease);
  }
  button.go:active { transform: scale(.97); box-shadow: var(--bloom); }
  button.go:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: 1ms !important; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <div class="stat"><div class="k">Round</div><div class="v" id="round">0<small>/15</small></div></div>
    <div class="stat"><div class="k">Last</div><div class="v" id="last">—</div></div>
    <div class="stat"><div class="k">Best avg</div><div class="v brandish" id="best">—</div></div>
  </div>
  <div class="gauge" id="gauge"></div>
  <div class="board" id="board"></div>
</div>

<div class="overlay" id="overlay">
  <div>
    <div id="head">
      <div class="ornament">❦</div>
      <h2>Reflex</h2>
      <p>One cell lights. Strike it. Fifteen rounds, averaged.</p>
    </div>
    <button class="go" id="go">Begin</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var ROUNDS = 15, CELLS = 12, BKEY = 'reflex.best';

  var board   = document.getElementById('board');
  var gauge   = document.getElementById('gauge');
  var overlay = document.getElementById('overlay');
  var head    = document.getElementById('head');
  var elRound = document.getElementById('round');
  var elLast  = document.getElementById('last');
  var elBest  = document.getElementById('best');

  var cells = [], segs = [], times = [], round = 0, active = -1, litAt = 0, waiting = null;

  for (var i = 0; i < CELLS; i++) {
    var c = document.createElement('div');
    c.className = 'cell';
    c.dataset.i = i;
    board.appendChild(c);
    cells.push(c);
  }
  for (var j = 0; j < ROUNDS; j++) {
    var s = document.createElement('div');
    s.className = 'seg';
    gauge.appendChild(s);
    segs.push(s);
  }

  var best = parseFloat(localStorage.getItem(BKEY) || '0') || 0;
  if (best) elBest.textContent = Math.round(best) + 'ms';

  board.addEventListener('pointerdown', function (e) {
    var c = e.target.closest('.cell');
    if (!c || active < 0) return;
    e.preventDefault();

    if (+c.dataset.i === active) {
      var ms = performance.now() - litAt;
      times.push(ms);
      elLast.textContent = Math.round(ms) + 'ms';
      c.classList.remove('lit');
      c.classList.add('hit');
      setTimeout(function () { c.classList.remove('hit'); }, 110);
      segs[round - 1].classList.add('on');
      active = -1;
      if (round >= ROUNDS) finish(); else next();
    } else {
      // Missing costs you: a 150ms penalty folded into this round.
      c.classList.add('bad');
      setTimeout(function () { c.classList.remove('bad'); }, 140);
      litAt -= 150;
      if (navigator.vibrate) navigator.vibrate(12);
    }
  });

  function next() {
    round++;
    elRound.innerHTML = round + '<small>/' + ROUNDS + '</small>';
    var delay = 450 + Math.random() * 1250;
    waiting = setTimeout(function () {
      var i;
      do { i = Math.floor(Math.random() * CELLS); } while (i === active);
      active = i;
      cells[i].classList.add('lit');
      litAt = performance.now();
    }, delay);
  }

  function finish() {
    var avg = times.reduce(function (a, b) { return a + b; }, 0) / times.length;
    var isBest = !best || avg < best;
    if (isBest) { best = avg; localStorage.setItem(BKEY, String(avg)); elBest.textContent = Math.round(avg) + 'ms'; }

    head.innerHTML =
      '<div class="big">' + Math.round(avg) + '<small>ms average</small></div>' +
      '<p>' + (isBest ? 'A new personal best.' : 'Your best stands at ' + Math.round(best) + 'ms.') +
      ' Fastest single strike: ' + Math.round(Math.min.apply(null, times)) + 'ms.</p>';
    document.getElementById('go').textContent = 'Again';
    overlay.classList.remove('hide');
  }

  document.getElementById('go').addEventListener('click', function () {
    clearTimeout(waiting);
    cells.forEach(function (c) { c.className = 'cell'; });
    segs.forEach(function (s) { s.className = 'seg'; });
    times = []; round = 0; active = -1;
    elLast.textContent = '—';
    overlay.classList.add('hide');
    next();
  });
})();

  // The launcher's metrics panel asks; every game answers, so a viewport
  // mismatch names which side of the frame boundary lost the pixels.
  (function () {
    var probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;' +
      'pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) ' +
      'env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';
    document.body.appendChild(probe);
    window.addEventListener('message', function (e) {
      if (!e.data || e.data.type !== 'arcade:spec?') return;
      var vv = window.visualViewport, doc = document.documentElement, cs = getComputedStyle(probe);
      function v(n) { return Math.round(parseFloat(cs[n]) || 0); }
      try {
        window.parent.postMessage({
          type: 'arcade:spec', name: 'Reflex',
          win: (window.innerWidth || 0) + '\u00d7' + (window.innerHeight || 0),
          doc: (doc.clientWidth || 0) + '\u00d7' + (doc.clientHeight || 0),
          vv: vv ? Math.round(vv.width) + '\u00d7' + Math.round(vv.height) : 'n/a',
          stage: Math.round(document.body.clientWidth) + '\u00d7' + Math.round(document.body.clientHeight),
          ins: v('paddingTop') + ' / ' + v('paddingRight') + ' / ' +
               v('paddingBottom') + ' / ' + v('paddingLeft')
        }, '*');
      } catch (err) {}
    });
  }());
</script>
</body>
</html>
