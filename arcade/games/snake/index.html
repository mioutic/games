<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snake</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; background: #0b0b12; color: #f2f2f7; overflow: hidden; touch-action: none;
    font: 400 17px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #app { height: 100%; display: flex; flex-direction: column; align-items: center;
         padding: 14px calc(env(safe-area-inset-right,0px) + 14px)
                  calc(env(safe-area-inset-bottom,0px) + 14px) calc(env(safe-area-inset-left,0px) + 14px); }
  .hud { flex: none; width: 100%; max-width: 520px; display: flex; justify-content: space-between; margin-bottom: 12px; }
  .stat { text-align: center; flex: 1; }
  .k { font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: #8e8e99; }
  .v { font-size: 21px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .v.green { color: #3ecf8e; }
  .stage { flex: 1; width: 100%; display: grid; place-items: center; min-height: 0; }
  canvas { background: #12121a; border: 1px solid #272733; border-radius: 20px; display: block;
           max-width: 100%; max-height: 100%; touch-action: none; }
  .hint { flex: none; color: #55555f; font-size: 12px; margin-top: 12px; }

  .overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px;
             background: rgba(11,11,18,.9); backdrop-filter: blur(14px); text-align: center; }
  .overlay.hide { display: none; }
  .overlay h2 { font-size: 30px; font-weight: 700; letter-spacing: -.02em; margin: 0 0 8px; }
  .overlay p { color: #8e8e99; font-size: 14.5px; margin: 0 0 22px; max-width: 280px; line-height: 1.55; }
  .big { font-size: 56px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums;
         background: linear-gradient(100deg,#3ecf8e,#4aa8ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  button.go { appearance: none; border: 0; border-radius: 999px; padding: 15px 40px; font-size: 17px; font-weight: 600;
              color: #08160f; background: linear-gradient(100deg,#5fe0a5,#3ecf8e); }
  button.go:active { transform: scale(.95); }
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <div class="stat"><div class="k">Score</div><div class="v" id="score">0</div></div>
    <div class="stat"><div class="k">Best</div><div class="v green" id="best">0</div></div>
  </div>
  <div class="stage"><canvas id="cv"></canvas></div>
  <div class="hint">Swipe anywhere to steer</div>
</div>

<div class="overlay" id="overlay">
  <div>
    <div id="head">
      <h2>Snake</h2>
      <p>Swipe to steer. Eat the dots, grow, and stay off yourself. Walls wrap.</p>
    </div>
    <button class="go" id="go">Start</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var N = 17, BKEY = 'snake.best';
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var overlay = document.getElementById('overlay'), head = document.getElementById('head');
  var elScore = document.getElementById('score'), elBest = document.getElementById('best');

  var cell = 0, dpr = Math.min(window.devicePixelRatio || 1, 3);
  var snake, dir, queued, food, score, tick, timer, dead = true;

  var best = parseInt(localStorage.getItem(BKEY) || '0', 10) || 0;
  elBest.textContent = best;

  function size() {
    var stage = document.querySelector('.stage');
    var side = Math.floor(Math.min(stage.clientWidth, stage.clientHeight));
    side = Math.max(160, side - (side % N));
    cell = side / N;
    cv.style.width = side + 'px';
    cv.style.height = side + 'px';
    cv.width = side * dpr;
    cv.height = side * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  window.addEventListener('resize', size);

  function spawnFood() {
    var open = [];
    for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) {
      if (!snake.some(function (s) { return s.x === x && s.y === y; })) open.push({ x: x, y: y });
    }
    food = open[Math.floor(Math.random() * open.length)];
  }

  function reset() {
    snake = [{ x: 8, y: 8 }, { x: 7, y: 8 }, { x: 6, y: 8 }];
    dir = { x: 1, y: 0 };
    queued = null;
    score = 0; tick = 145; dead = false;
    elScore.textContent = '0';
    spawnFood();
    clearInterval(timer);
    timer = setInterval(step, tick);
    draw();
  }

  function step() {
    if (queued) { dir = queued; queued = null; }
    var h = { x: (snake[0].x + dir.x + N) % N, y: (snake[0].y + dir.y + N) % N };

    if (snake.some(function (s, i) { return i < snake.length - 1 && s.x === h.x && s.y === h.y; })) return die();

    snake.unshift(h);
    if (h.x === food.x && h.y === food.y) {
      score++;
      elScore.textContent = score;
      spawnFood();
      if (score % 4 === 0 && tick > 70) {           // ramp the pace every few bites
        tick -= 8;
        clearInterval(timer);
        timer = setInterval(step, tick);
      }
      if (navigator.vibrate) navigator.vibrate(8);
    } else {
      snake.pop();
    }
    draw();
  }

  function die() {
    dead = true;
    clearInterval(timer);
    if (navigator.vibrate) navigator.vibrate([18, 40, 18]);
    if (score > best) { best = score; localStorage.setItem(BKEY, String(best)); elBest.textContent = best; }
    head.innerHTML = '<div class="big">' + score + '</div>' +
      '<p>' + (score >= best && score > 0 ? 'New best.' : 'Best so far: ' + best + '.') + '</p>';
    document.getElementById('go').textContent = 'Again';
    overlay.classList.remove('hide');
  }

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
  }

  function draw() {
    if (!cell) return;
    var side = N * cell;
    ctx.clearRect(0, 0, side, side);

    if (food) {
      ctx.fillStyle = '#ff5c9d';
      var p = cell * 0.26;
      rr(food.x * cell + p, food.y * cell + p, cell - p * 2, cell - p * 2, (cell - p * 2) / 2);
    }
    if (snake) {
      for (var i = snake.length - 1; i >= 0; i--) {
        var t = 1 - (i / Math.max(snake.length, 1)) * 0.55;
        ctx.fillStyle = i === 0 ? '#7fe9b6' : 'rgba(62,207,142,' + t.toFixed(3) + ')';
        var m = cell * 0.09;
        rr(snake[i].x * cell + m, snake[i].y * cell + m, cell - m * 2, cell - m * 2, cell * 0.28);
      }
    }
  }

  function turn(x, y) {
    var cur = queued || dir;
    if (cur.x === -x && cur.y === -y) return;   // no instant reversals
    if (cur.x === x && cur.y === y) return;
    queued = { x: x, y: y };
  }

  var sx = 0, sy = 0, swiping = false;
  window.addEventListener('touchstart', function (e) {
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; swiping = true;
  }, { passive: true });
  window.addEventListener('touchmove', function (e) {
    if (!swiping || dead) return;
    var dx = e.touches[0].clientX - sx, dy = e.touches[0].clientY - sy;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0); else turn(0, dy > 0 ? 1 : -1);
    swiping = false;
  }, { passive: true });

  window.addEventListener('keydown', function (e) {
    var m = { ArrowUp: [0,-1], ArrowDown: [0,1], ArrowLeft: [-1,0], ArrowRight: [1,0],
              w: [0,-1], s: [0,1], a: [-1,0], d: [1,0] }[e.key];
    if (m) { e.preventDefault(); turn(m[0], m[1]); }
  });

  document.getElementById('go').addEventListener('click', function () {
    overlay.classList.add('hide');
    reset();
  });

  size();
})();
</script>
</body>
</html>
