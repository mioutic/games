<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snake</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>
  /* Sanguine — see DESIGN.md */
  :root {
    --s-0: #0b0609;  --s-1: #12080c;  --s-2: #1a0d12;
    --t-0: #f2e6e6;  --t-1: #c3a9ad;  --t-2: #8f6f76;  --t-3: #5c434a;
    --accent: #e9d8c5;  --accent-2: #b81d3a;  --brand: #d9557a;
    --line-0: #150a0e;  --line-1: #2a141c;  --line-2: #3d1f28;
    --bloom: 0 0 12px rgba(216,58,88,.45), 0 0 26px rgba(216,58,88,.16);
    --lit-within: inset 0 0 60px rgba(184,29,58,.05);
    --font-display: Georgia, "Times New Roman", serif;
    --font-ui: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    --radius: 2px;  --dur: 160ms;  --ease: cubic-bezier(.2,.6,.2,1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; touch-action: none;
    background: var(--s-0); color: var(--t-0);
    font: 400 16px/1.45 var(--font-ui); -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  #app {
    height: 100%; display: flex; flex-direction: column; align-items: center;
    padding: 14px calc(env(safe-area-inset-right,0px) + 14px)
             calc(env(safe-area-inset-bottom,0px) + 14px) calc(env(safe-area-inset-left,0px) + 14px);
  }
  .hud { flex: none; width: 100%; max-width: 520px; display: flex;
         border: 1px solid var(--line-1); border-radius: var(--radius); background: var(--s-1); }
  .stat { flex: 1; padding: 9px 6px 8px; text-align: center; border-right: 1px solid var(--line-0); }
  .stat:last-child { border-right: 0; }
  .k { font: 500 9px/1 var(--font-ui); letter-spacing: .16em; text-transform: uppercase; color: var(--t-2); }
  .v { margin-top: 6px; font: 500 19px/1 var(--font-mono); font-variant-numeric: tabular-nums; color: var(--t-0); }
  .v.brandish { color: var(--brand); }

  .stage { flex: 1; width: 100%; display: grid; place-items: center; min-height: 0; padding: 14px 0; }
  canvas {
    background: var(--s-1); border: 1px solid var(--line-2); border-radius: var(--radius);
    display: block; max-width: 100%; max-height: 100%; touch-action: none;
    box-shadow: var(--lit-within);
  }
  .hint { flex: none; font: 500 9px/1 var(--font-ui); letter-spacing: .16em;
          text-transform: uppercase; color: var(--t-3); }

  .overlay {
    position: absolute; inset: 0; display: grid; place-items: center; padding: 24px;
    background: rgba(5,2,3,.9); text-align: center;
  }
  .overlay.hide { display: none; }
  .overlay h2 { font: 400 30px/1.1 var(--font-display); letter-spacing: .04em; margin: 0 0 10px; }
  .overlay p { color: var(--t-2); font-size: 13.5px; margin: 0 0 24px; max-width: 290px;
               line-height: 1.65; margin-inline: auto; }
  .big { font: 500 54px/1 var(--font-mono); font-variant-numeric: tabular-nums;
         color: var(--accent); letter-spacing: -.02em; }
  .big small { font: 500 11px/1 var(--font-ui); letter-spacing: .16em; text-transform: uppercase;
               color: var(--t-2); display: block; margin-top: 10px; }
  .ornament { color: var(--accent-2); font-size: 15px; margin-bottom: 14px; }
  button.go {
    appearance: none; border: 1px solid var(--accent); border-radius: var(--radius);
    padding: 13px 34px; background: var(--accent); color: var(--s-0);
    font: 500 11px/1 var(--font-ui); letter-spacing: .18em; text-transform: uppercase;
    transition: box-shadow var(--dur) var(--ease), transform 90ms var(--ease);
  }
  button.go:active { transform: scale(.97); box-shadow: var(--bloom); }
  button.go:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: 1ms !important; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <div class="stat"><div class="k">Score</div><div class="v" id="score">0</div></div>
    <div class="stat"><div class="k">Best</div><div class="v brandish" id="best">0</div></div>
  </div>
  <div class="stage"><canvas id="cv"></canvas></div>
  <div class="hint">Swipe to steer</div>
</div>

<div class="overlay" id="overlay">
  <div>
    <div id="head">
      <div class="ornament">❦</div>
      <h2>Snake</h2>
      <p>Swipe to steer. Take the drops, grow, and stay clear of yourself. The walls wrap.</p>
    </div>
    <button class="go" id="go">Begin</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var N = 17, BKEY = 'snake.best';

  // Sanguine palette, read straight from the tokens above.
  var C_GRID = '#150a0e', C_HEAD = '#f2e6e6', C_BODY = '233,216,197', C_FOOD = '#b81d3a';

  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var overlay = document.getElementById('overlay'), head = document.getElementById('head');
  var elScore = document.getElementById('score'), elBest = document.getElementById('best');

  var cell = 0, dpr = Math.min(window.devicePixelRatio || 1, 3);
  var snake, dir, queued, food, score, tick, timer, dead = true;

  var best = parseInt(localStorage.getItem(BKEY) || '0', 10) || 0;
  elBest.textContent = best;

  function size() {
    var stage = document.querySelector('.stage');
    var side = Math.floor(Math.min(stage.clientWidth, stage.clientHeight));
    side = Math.max(160, side - (side % N));
    cell = side / N;
    cv.style.width = side + 'px';
    cv.style.height = side + 'px';
    cv.width = side * dpr;
    cv.height = side * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  window.addEventListener('resize', size);

  function spawnFood() {
    var open = [];
    for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) {
      if (!snake.some(function (s) { return s.x === x && s.y === y; })) open.push({ x: x, y: y });
    }
    food = open[Math.floor(Math.random() * open.length)];
  }

  function reset() {
    snake = [{ x: 8, y: 8 }, { x: 7, y: 8 }, { x: 6, y: 8 }];
    dir = { x: 1, y: 0 };
    queued = null;
    score = 0; tick = 145; dead = false;
    elScore.textContent = '0';
    spawnFood();
    clearInterval(timer);
    timer = setInterval(step, tick);
    draw();
  }

  function step() {
    if (queued) { dir = queued; queued = null; }
    var h = { x: (snake[0].x + dir.x + N) % N, y: (snake[0].y + dir.y + N) % N };

    if (snake.some(function (s, i) { return i < snake.length - 1 && s.x === h.x && s.y === h.y; })) return die();

    snake.unshift(h);
    if (h.x === food.x && h.y === food.y) {
      score++;
      elScore.textContent = score;
      spawnFood();
      if (score % 4 === 0 && tick > 70) {           // ramp the pace every few bites
        tick -= 8;
        clearInterval(timer);
        timer = setInterval(step, tick);
      }
      if (navigator.vibrate) navigator.vibrate(8);
    } else {
      snake.pop();
    }
    draw();
  }

  function die() {
    dead = true;
    clearInterval(timer);
    if (navigator.vibrate) navigator.vibrate([18, 40, 18]);
    if (score > best) { best = score; localStorage.setItem(BKEY, String(best)); elBest.textContent = best; }
    head.innerHTML = '<div class="big">' + score + '<small>collected</small></div>' +
      '<p>' + (score >= best && score > 0 ? 'A new personal best.' : 'Your best stands at ' + best + '.') + '</p>';
    document.getElementById('go').textContent = 'Again';
    overlay.classList.remove('hide');
  }

  function rect(x, y, w, h) { ctx.fillRect(x, y, w, h); }

  function draw() {
    if (!cell) return;
    var side = N * cell;
    ctx.clearRect(0, 0, side, side);

    // Faint machined grid — the instrument bed the game sits on.
    ctx.strokeStyle = C_GRID;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var g = 1; g < N; g++) {
      var p = Math.round(g * cell) + 0.5;
      ctx.moveTo(p, 0); ctx.lineTo(p, side);
      ctx.moveTo(0, p); ctx.lineTo(side, p);
    }
    ctx.stroke();

    if (food) {
      // Arterial drop, with its bloom.
      ctx.save();
      ctx.shadowColor = 'rgba(216,58,88,.75)';
      ctx.shadowBlur = cell * 0.9;
      ctx.fillStyle = C_FOOD;
      var fp = cell * 0.24;
      rect(food.x * cell + fp, food.y * cell + fp, cell - fp * 2, cell - fp * 2);
      ctx.restore();
    }

    if (snake) {
      var m = cell * 0.12;
      for (var i = snake.length - 1; i >= 0; i--) {
        if (i === 0) {
          ctx.fillStyle = C_HEAD;
        } else {
          var t = 1 - (i / Math.max(snake.length, 1)) * 0.6;
          ctx.fillStyle = 'rgba(' + C_BODY + ',' + t.toFixed(3) + ')';
        }
        rect(snake[i].x * cell + m, snake[i].y * cell + m, cell - m * 2, cell - m * 2);
      }
    }
  }

  function turn(x, y) {
    var cur = queued || dir;
    if (cur.x === -x && cur.y === -y) return;   // no instant reversals
    if (cur.x === x && cur.y === y) return;
    queued = { x: x, y: y };
  }

  var sx = 0, sy = 0, swiping = false;
  window.addEventListener('touchstart', function (e) {
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; swiping = true;
  }, { passive: true });
  window.addEventListener('touchmove', function (e) {
    if (!swiping || dead) return;
    var dx = e.touches[0].clientX - sx, dy = e.touches[0].clientY - sy;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0); else turn(0, dy > 0 ? 1 : -1);
    swiping = false;
  }, { passive: true });

  window.addEventListener('keydown', function (e) {
    var m = { ArrowUp: [0,-1], ArrowDown: [0,1], ArrowLeft: [-1,0], ArrowRight: [1,0],
              w: [0,-1], s: [0,1], a: [-1,0], d: [1,0] }[e.key];
    if (m) { e.preventDefault(); turn(m[0], m[1]); }
  });

  document.getElementById('go').addEventListener('click', function () {
    overlay.classList.add('hide');
    reset();
  });

  size();
})();

  // The launcher's metrics panel asks; every game answers, so a viewport
  // mismatch names which side of the frame boundary lost the pixels.
  (function () {
    var probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;' +
      'pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) ' +
      'env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';
    document.body.appendChild(probe);
    window.addEventListener('message', function (e) {
      if (!e.data || e.data.type !== 'arcade:spec?') return;
      var vv = window.visualViewport, doc = document.documentElement, cs = getComputedStyle(probe);
      function v(n) { return Math.round(parseFloat(cs[n]) || 0); }
      try {
        window.parent.postMessage({
          type: 'arcade:spec', name: 'Snake',
          win: (window.innerWidth || 0) + '\u00d7' + (window.innerHeight || 0),
          doc: (doc.clientWidth || 0) + '\u00d7' + (doc.clientHeight || 0),
          vv: vv ? Math.round(vv.width) + '\u00d7' + Math.round(vv.height) : 'n/a',
          stage: Math.round(document.body.clientWidth) + '\u00d7' + Math.round(document.body.clientHeight),
          ins: v('paddingTop') + ' / ' + v('paddingRight') + ' / ' +
               v('paddingBottom') + ' / ' + v('paddingLeft')
        }, '*');
      } catch (err) {}
    });
  }());
</script>
</body>
</html>
