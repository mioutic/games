<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0609"/>
      <stop offset="1" stop-color="#241119"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b81d3a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#b81d3a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="180" height="180" fill="url(#ground)"/>
  <circle cx="90" cy="90" r="42" fill="url(#bloom)"/>

  <!-- machined bezel: inner edge r62.5, outer r67.5 -->
  <circle cx="90" cy="90" r="65" fill="none" stroke="#e9d8c5" stroke-width="5"/>

  <!-- tick marks, r71.6 to r78.5; the four cardinals run full length -->
  <g stroke="#e9d8c5" stroke-width="4" stroke-linecap="butt">
    <path d="M90 11.5v6.9" transform="rotate(0 90 90)"/>
    <path d="M90 11.5v6.9" transform="rotate(90 90 90)"/>
    <path d="M90 11.5v6.9" transform="rotate(180 90 90)"/>
    <path d="M90 11.5v6.9" transform="rotate(270 90 90)"/>
    <g opacity="0.72">
      <path d="M90 14.6v3.8" transform="rotate(30 90 90)"/>
      <path d="M90 14.6v3.8" transform="rotate(60 90 90)"/>
      <path d="M90 14.6v3.8" transform="rotate(120 90 90)"/>
      <path d="M90 14.6v3.8" transform="rotate(150 90 90)"/>
      <path d="M90 14.6v3.8" transform="rotate(210 90 90)"/>
      <path d="M90 14.6v3.8" transform="rotate(240 90 90)"/>
      <path d="M90 14.6v3.8" transform="rotate(300 90 90)"/>
      <path d="M90 14.6v3.8" transform="rotate(330 90 90)"/>
    </g>
  </g>

  <!-- arterial drop: apex y58.5, bulb centre y101.7 r20.3 -->
  <path d="M90 58.5c7.6 12.7 20.3 24.6 20.3 33.2a20.3 20.3 0 0 1-40.6 0c0-8.6 12.7-20.5 20.3-33.2z"
        fill="#b81d3a"/>
</svg>
