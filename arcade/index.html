<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Arcade</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arcade">
<meta name="theme-color" content="#0b0609">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  /* Sanguine — see DESIGN.md. Pallor and blood: bone is the accent, crimson
     is decorative, and the ground stays near-black oxblood throughout. */
  :root {
    --s-0: #0b0609;  --s-1: #12080c;  --s-2: #1a0d12;  --s-3: #241119;
    --t-0: #f2e6e6;  --t-1: #c3a9ad;  --t-2: #8f6f76;  --t-3: #5c434a;
    --accent: #e9d8c5;
    --accent-2: #b81d3a;
    --brand: #d9557a;
    --line-0: #150a0e;  --line-1: #2a141c;  --line-2: #3d1f28;
    --error: #ff5470;  --success: #5fa777;  --pending: #a884c9;
    --cat-1: #6fb3ab; --cat-2: #8a8fc9; --cat-3: #a884c9; --cat-4: #c96a8e;

    --bloom:    0 0 12px rgba(216,58,88,.45), 0 0 26px rgba(216,58,88,.16);
    --bloom-lg: 0 0 22px rgba(216,58,88,.45), 0 0 52px rgba(216,58,88,.16);
    --lit-within: inset 0 0 60px rgba(184,29,58,.05);
    --scrim: #050203;

    --ov-hover: rgba(233,216,197,.06);
    --ov-active: rgba(233,216,197,.12);

    --font-display: Georgia, "Times New Roman", serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;

    --radius: 2px;
    --dur: 160ms;
    --ease: cubic-bezier(.2,.6,.2,1);

    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: min(env(safe-area-inset-bottom, 0px), 34px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--s-0); color: var(--t-0);
    font: 400 16px/1.45 var(--font-ui);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    touch-action: manipulation;
  }
  body { overflow-x: hidden; }

  /* micro-label: the console voice — uppercase, wide, small */
  .micro {
    font: 500 10px/1 var(--font-ui);
    letter-spacing: .16em; text-transform: uppercase; color: var(--t-2);
  }

  .wrap {
    padding: calc(var(--safe-t) + 18px) calc(var(--safe-r) + 16px)
             calc(var(--safe-b) + 18px) calc(var(--safe-l) + 16px);
    max-width: 760px; margin: 0 auto;
    min-height: 100%;
    min-height: 100dvh;      /* survives Safari's collapsing toolbars */
    /* ...and this overrides it with the measured height, because dvh is itself
       short by the safe-area strip once installed to the home screen. */
    min-height: var(--vh, 100dvh);
    display: flex; flex-direction: column;
  }

  /* ---------- masthead ---------- */
  header { display: flex; align-items: flex-start; gap: 14px; }
  .mark { flex: none; width: 34px; height: 34px; margin-top: 2px; color: var(--accent); }
  .mark .rotor { transform-origin: 50% 50%; animation: rotor 60s linear infinite; }
  @keyframes rotor { to { transform: rotate(360deg); } }

  h1 {
    font: 400 30px/1 var(--font-display);
    letter-spacing: .04em; margin: 0; color: var(--t-0);
  }
  .status { display: flex; align-items: center; gap: 7px; margin-top: 9px; }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--t-3); flex: none;
    transition: background var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  }
  .dot.ok      { background: var(--success); box-shadow: 0 0 8px rgba(95,167,119,.7); }
  .dot.cached  { background: var(--pending); box-shadow: 0 0 8px rgba(168,132,201,.7); }
  .dot.fail    { background: var(--error);   box-shadow: 0 0 8px rgba(255,84,112,.7); }

  .spacer { flex: 1; }

  .instrs { flex: none; display: flex; gap: 8px; }
  button.instr {
    appearance: none; flex: none;
    width: 38px; height: 38px; border-radius: var(--radius);
    border: 1px solid var(--line-2); background: var(--s-1);
    color: var(--accent); display: grid; place-items: center;
    transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);
  }
  button.instr:active { background: var(--ov-active); border-color: var(--accent-2); }
  button.instr:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.instr.busy svg { animation: sweep 900ms linear infinite; }
  @keyframes sweep { to { transform: rotate(360deg); } }

  .rule {
    height: 1px; background: var(--line-1); margin: 16px 0 14px;
    position: relative;
  }
  .rule::after {
    content: ""; position: absolute; left: 0; top: 0; width: 46px; height: 1px;
    background: var(--accent-2);
  }

  /* ---------- grid ---------- */
  /* The grid takes the slack rather than leaving a band of nothing above the
     footer; card content centres itself so a tall card still reads as full. */
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
          flex: 1 1 auto; grid-auto-rows: minmax(152px, 1fr); }
  /* Landscape has height to spare across, not down — shorter rows so the
     library still fits without scrolling. */
  @media (max-height: 500px) {
    .grid { grid-auto-rows: minmax(124px, 1fr); }
    .card { min-height: 124px; padding: 11px 11px 9px; }
    .card .glyph { margin-bottom: 7px; }
    .card .desc { -webkit-line-clamp: 1; }
    .foot { padding-top: 14px; }
  }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(3, 1fr); } }

  .card {
    position: relative; display: flex; flex-direction: column; text-align: left;
    appearance: none; border: 1px solid var(--line-1); border-radius: var(--radius);
    background: var(--s-1); color: inherit; padding: 15px 13px 11px;
    min-height: 152px; overflow: hidden;
    transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease),
                box-shadow var(--dur) var(--ease);
  }
  .card::before {                      /* channel strip: the game's categorical ink */
    content: ""; position: absolute; inset: 0 0 auto 0; height: 2px;
    background: var(--ink, var(--cat-1)); opacity: .85;
  }
  .card .bracket {                     /* machined corner bracket */
    position: absolute; right: 9px; bottom: 9px; width: 9px; height: 9px;
    border-right: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2);
  }
  .card:active {
    background: var(--ov-hover); border-color: var(--accent-2);
    box-shadow: var(--bloom), var(--lit-within);
  }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card .glyph { color: var(--accent); margin-top: auto; margin-bottom: 12px; }
  .card .name {
    font: 400 18px/1.15 var(--font-display); letter-spacing: .02em; color: var(--t-0);
  }
  .card .desc {
    color: var(--t-2); font-size: 12px; line-height: 1.4; margin-top: 5px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card .readout {
    margin-top: auto; padding-top: 10px; display: flex; align-items: baseline;
    justify-content: space-between; gap: 8px; border-top: 1px solid var(--line-0);
  }
  .card .readout .val {
    font: 500 13px/1 var(--font-mono); font-variant-numeric: tabular-nums; color: var(--t-1);
  }
  .card .readout .val.empty { color: var(--t-3); }

  /* ---------- states ---------- */
  .state { grid-column: 1 / -1; text-align: center; color: var(--t-2);
           padding: 54px 18px; font-size: 13.5px; line-height: 1.7; }
  .state code {
    font: 400 12px/1 var(--font-mono); color: var(--t-1);
    background: var(--s-2); border: 1px solid var(--line-1); border-radius: var(--radius);
    padding: 3px 5px;
  }
  .skel {
    min-height: 152px; border: 1px solid var(--line-1); border-radius: var(--radius);
    background: var(--s-1); position: relative; overflow: hidden;
  }
  .skel::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, var(--ov-hover), transparent);
    transform: translateX(-100%); animation: scan 1.4s var(--ease) infinite;
  }
  @keyframes scan { to { transform: translateX(100%); } }

  /* The stamp rides in the flow rather than fixed to the viewport: that is
     what makes its bottom gap equal the header's top gap on any device. */
  .footbar { margin-top: auto; padding-top: 22px; display: flex;
             align-items: flex-end; gap: 10px; }
  .foot { flex: 1; min-width: 0; text-align: center;
          color: var(--t-3); font-size: 11px; line-height: 1.8; }
  .foot code { font-family: var(--font-mono); color: var(--t-2); }

  .version {
    flex: none; appearance: none; white-space: nowrap;
    font: 500 9.5px/1 var(--font-mono); letter-spacing: .1em;
    color: var(--brand); border: 1px solid var(--line-2); border-radius: var(--radius);
    /* the trailing letter-spacing eats into the right edge, so pad it back */
    padding: 5px 8px 5px 7px; background: var(--s-1);
    font-variant-numeric: tabular-nums;
  }
  .version:active { background: var(--ov-active); }
  .version[hidden] { display: none; }

  /* ---------- metrics sheet ---------- */
  /* Guessing at someone else's device is not a technique (DESIGN.md): this
     reads the real numbers off the launcher and off the running game. */
  .sheet {
    position: fixed; inset: 0; z-index: 60; display: grid; place-items: center;
    background: rgba(5,2,3,.72); backdrop-filter: blur(3px);
    padding: calc(var(--safe-t) + 14px) calc(var(--safe-r) + 14px)
             calc(var(--safe-b) + 14px) calc(var(--safe-l) + 14px);
  }
  .sheet[hidden] { display: none; }
  .sheet .card {
    width: 100%; max-width: 460px; max-height: 100%; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: var(--s-1); border: 1px solid var(--line-2); border-radius: var(--radius);
    box-shadow: 0 0 0 1px rgba(0,0,0,.6), var(--lit-within);
    padding: 15px 15px 13px;
  }
  .sheet h2 {
    font: 400 17px/1 var(--font-display); letter-spacing: .04em;
    margin: 0 0 3px; color: var(--t-0);
  }
  .sheet .hint { color: var(--t-3); font-size: 11px; margin: 0 0 11px; }
  .sect {
    font: 500 9px/1 var(--font-ui); letter-spacing: .2em; text-transform: uppercase;
    color: var(--t-2); margin: 13px 0 5px; display: flex; align-items: center; gap: 8px;
  }
  .sect::after { content: ""; flex: 1; height: 1px; background: var(--line-1); }
  .mrow {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 3.5px 0; border-bottom: 1px solid var(--line-0);
    font-size: 11.5px; color: var(--t-1);
  }
  .mrow b {
    font: 500 11.5px/1.35 var(--font-mono); font-variant-numeric: tabular-nums;
    color: var(--t-0); text-align: right; white-space: nowrap;
  }
  .mrow b.warn { color: var(--warning); }
  .mrow b.bad  { color: var(--error); }
  .mrow b.ok   { color: var(--success); }
  .verdict {
    margin-top: 12px; padding: 9px 10px; font-size: 11.5px; line-height: 1.5;
    border: 1px solid var(--line-2); border-left: 2px solid var(--accent-2);
    background: var(--s-2); color: var(--t-1);
  }
  .sheet .acts { display: flex; gap: 8px; margin-top: 13px; }
  .sheet .acts button {
    flex: 1; appearance: none; padding: 10px 8px; border-radius: var(--radius);
    border: 1px solid var(--line-2); background: var(--s-2); color: var(--t-1);
    font: 500 10px/1 var(--font-ui); letter-spacing: .16em; text-transform: uppercase;
  }
  .sheet .acts button.key { background: var(--accent); color: var(--t-inv); border-color: var(--accent); }
  .sheet .acts button:active { background: var(--ov-active); }

  /* ---------- player ---------- */
  .player {
    /* Width/height are set from measurement in JS — `inset: 0` sizes to the
       layout viewport, which is not the visible area while Safari is
       overlaying a toolbar. */
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: var(--s-0); z-index: 50;
    display: flex; flex-direction: column;
    transform: translateY(100%); visibility: hidden;
    transition: transform 200ms var(--ease), visibility 200ms var(--ease);
  }
  .player.open { transform: translateY(0); visibility: visible; }
  .player .bar {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: calc(var(--safe-t) + 9px) calc(var(--safe-r) + 12px) 9px calc(var(--safe-l) + 6px);
    background: var(--s-1); border-bottom: 1px solid var(--line-2);
  }
  .back {
    appearance: none; border: 0; background: transparent; color: var(--accent);
    display: flex; align-items: center; gap: 5px; padding: 7px 9px;
    border-radius: var(--radius); font: 500 10px/1 var(--font-ui);
    letter-spacing: .16em; text-transform: uppercase;
  }
  .back:active { background: var(--ov-active); }
  .back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .player .title {
    font: 400 15px/1 var(--font-display); letter-spacing: .03em;
    /* offsets the wider Back control so the name still reads as centred */
    flex: 1; text-align: center; margin-right: 36px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pspec {
    appearance: none; flex: none; width: 32px; height: 32px;
    border: 1px solid var(--line-2); border-radius: var(--radius);
    background: var(--s-2); color: var(--t-2); display: grid; place-items: center;
  }
  .pspec:active { background: var(--ov-active); color: var(--accent); }
  .player iframe { flex: 1; width: 100%; border: 0; background: var(--s-0); display: block; }

  /* Fullscreen: a game can ask for the bar to go, and nothing of the
     launcher's replaces it — a floating chevron parked over the game's own HUD
     is exactly what fullscreen was asked for to get rid of. The way out is the
     game's settings sheet, which is where fullscreen was turned on and which
     carries a Leave button of its own. */
  .player.fs .bar { display: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: 1ms !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <svg class="mark" viewBox="0 0 34 34" fill="none" aria-hidden="true">
      <g class="rotor" stroke="currentColor" stroke-width="1.1">
        <circle cx="17" cy="17" r="12.4"/>
        <path d="M17 1.6v3.2M17 29.2v3.2M1.6 17h3.2M29.2 17h3.2" stroke-linecap="butt"/>
      </g>
      <path d="M17 9.4c1.5 2.5 4 4.9 4 6.6a4 4 0 0 1-8 0c0-1.7 2.5-4.1 4-6.6z" fill="#b81d3a"/>
    </svg>

    <div>
      <h1>Arcade</h1>
      <div class="status">
        <span class="dot" id="dot"></span>
        <span class="micro" id="sub">Loading</span>
      </div>
    </div>

    <div class="spacer"></div>

    <div class="instrs">
    <button class="instr" id="specs" aria-label="Display metrics">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="square" aria-hidden="true">
        <path d="M3.5 7.5v-4h4M20.5 7.5v-4h-4M3.5 16.5v4h4M20.5 16.5v4h-4"/>
        <path d="M7.5 12h9M7.5 9.8v4.4M16.5 9.8v4.4"/>
      </svg>
    </button>

    <button class="instr" id="refresh" aria-label="Refresh">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="square" aria-hidden="true">
        <path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>
      </svg>
    </button>
    </div>
  </header>

  <div class="rule"></div>

  <div class="grid" id="grid">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </div>

  <div class="footbar">
    <div class="foot">
      Drop a folder into <code>arcade/games/</code> with an <code>index.html</code>, push, then refresh.
    </div>
    <button class="version" id="version" hidden aria-label="Build and viewport"></button>
  </div>
</div>

<div class="player" id="player">
  <div class="bar">
    <button class="back" id="back">
      <svg width="9" height="15" viewBox="0 0 12 20" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M10 2 2 10l8 8"/></svg>
      Arcade
    </button>
    <div class="title" id="ptitle"></div>
    <!-- The metrics that matter most are the running game's, and the header
         button is behind the player by then — so it gets one of its own. -->
    <button class="pspec" id="pspec" aria-label="Display metrics">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="square" aria-hidden="true">
        <path d="M3.5 7.5v-4h4M20.5 7.5v-4h-4M3.5 16.5v4h4M20.5 16.5v4h-4"/>
        <path d="M7.5 12h9M7.5 9.8v4.4M16.5 9.8v4.4"/>
      </svg>
    </button>
  </div>
  <iframe id="frame" allow="autoplay; fullscreen; gamepad; accelerometer; gyroscope"
          referrerpolicy="no-referrer" title="Game"></iframe>
</div>

<!-- Reads the four insets back as real pixels; env() cannot be read any other way. -->
<div id="probe" aria-hidden="true" style="position:fixed;top:0;left:0;width:0;height:0;
     visibility:hidden;pointer-events:none;
     padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px)
             env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)"></div>

<div class="sheet" id="specsheet" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-label="Display metrics">
    <h2>❦ Display metrics</h2>
    <p class="hint">Live measurements from this launcher and from whatever is loaded in the frame.</p>
    <div id="metrics"></div>
    <div class="verdict" id="verdict"></div>
    <div class="acts">
      <button id="copySpecs">Copy</button>
      <button id="closeSpecs" class="key">Close</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // Discovery order: games.json served from this same origin (CI regenerates it
  // on every push, so it needs no token and works on a private repo), then the
  // GitHub API as a fallback for a public repo whose index hasn't been built.
  var REPO   = 'mioutic/games';
  var DIR    = 'arcade/games';
  var REFS   = ['main', 'claude/iphone-game-browser-5qg6ng'];   // tried in order
  var TTL    = 5 * 60 * 1000;
  var CKEY   = 'arcade.cache.v2';

  var INKS = ['#6fb3ab', '#8a8fc9', '#a884c9', '#c96a8e'];   // categorical, muted

  // Line glyphs, 24x24, drawn rather than borrowed — no emoji anywhere (DESIGN.md).
  var GLYPHS = {
    bolt:    '<path d="M13.5 2.5 5 13h5.2l-.7 8.5L19 11h-5.2l.7-8.5Z"/>',
    serpent: '<path d="M6 20.5c0-4 12-4 12-8s-12-4-12-8h4"/>'
           + '<circle cx="11.5" cy="4.5" r="1.5" fill="currentColor" stroke="none"/>',
    grid:    '<path d="M3.5 3.5h17v17h-17zM9.2 3.5v17M14.8 3.5v17M3.5 9.2h17M3.5 14.8h17"/>',
    crypt:   '<path d="M5 21V10.5a7 7 0 0 1 14 0V21"/><path d="M2.5 21h19"/><path d="M9.5 21v-6.5a2.5 2.5 0 0 1 5 0V21"/>',
    blade:   '<path d="M12 2.4 13.7 6.8V15h-3.4V6.8z"/>'
           + '<path d="M7.2 15h9.6"/><path d="M12 15v3.8"/><path d="M10 19.4h4"/>',
    chalice: '<path d="M6.8 4.5h10.4l-1.7 6.2a3.7 3.7 0 0 1-7 0z"/>'
           + '<path d="M12 12.8v7.2"/><path d="M8.3 20.4h7.4"/>',
    'default': '<path d="M12 2.6 21.4 12 12 21.4 2.6 12 12 2.6Z"/>'
  };

  function glyphSvg(name, size) {
    var body = GLYPHS[name] || GLYPHS['default'];
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" '
         + 'stroke="currentColor" stroke-width="1.4" stroke-linecap="square" '
         + 'stroke-linejoin="miter" aria-hidden="true">' + body + '</svg>';
  }

  var grid   = document.getElementById('grid');
  var sub    = document.getElementById('sub');
  var dot    = document.getElementById('dot');
  var player = document.getElementById('player');
  var frame  = document.getElementById('frame');
  var ptitle = document.getElementById('ptitle');

  // A bundled build (see tools/build-pwa.py) inlines every game into one
  // file so the launcher works with no server and no network at all.
  var BUNDLE = window.__ARCADE_BUNDLE__ || null;

  /* ---------------- discovery ---------------- */

  function discover() {
    if (BUNDLE) return Promise.resolve(BUNDLE.games.map(normalize));
    return fetch('games.json', { cache: 'no-cache' })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)); })
      .then(function (data) {
        var list = (data && data.games) || [];
        if (!list.length) throw new Error('empty index');
        return list.map(normalize);
      })
      .catch(function () {
        return listFolders().then(function (slugs) { return Promise.all(slugs.sort().map(describe)); });
      });
  }

  // Must be idempotent: the cache stores already-normalized records, so this
  // runs a second time over its own output and has to accept either key.
  function normalize(g) {
    var slug = g.slug;
    return {
      slug:  slug,
      name:  g.name || titleize(slug),
      desc:  g.description || g.desc || '',
      glyph: g.glyph || 'default',
      ink:   g.ink || INKS[hash(slug) % INKS.length],
      stat:  g.stat || null,
      entry: g.entry || 'index.html'
    };
  }

  function listFolders() {
    var i = 0;
    function attempt() {
      if (i >= REFS.length) return Promise.reject(new Error('no ref matched'));
      var ref = REFS[i++];
      var url = 'https://api.github.com/repos/' + REPO + '/contents/' + DIR + '?ref=' + encodeURIComponent(ref);
      return fetch(url, { headers: { Accept: 'application/vnd.github+json' } })
        .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)); })
        .then(function (items) {
          var dirs = (items || []).filter(function (it) { return it.type === 'dir'; })
                                  .map(function (it) { return it.name; });
          return dirs.length ? dirs : attempt();
        })
        .catch(attempt);
    }
    return attempt();
  }

  // Metadata comes from the site itself (same origin, no rate limit). A game.json
  // is optional — without one we derive a decent title from the folder name.
  function describe(slug) {
    return fetch('games/' + slug + '/game.json', { cache: 'no-cache' })
      .then(function (r) { return r.ok ? r.json() : {}; })
      .catch(function () { return {}; })
      .then(function (meta) { meta.slug = slug; return normalize(meta); });
  }

  function titleize(s) {
    return s.replace(/[-_]+/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); });
  }
  function hash(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return h;
  }

  // Each game names the localStorage key holding its personal best, so the
  // launcher can show it as a readout without knowing anything else about it.
  function readStat(stat) {
    if (!stat || !stat.key) return null;
    var raw;
    try { raw = localStorage.getItem(stat.key); } catch (e) { return null; }
    if (raw === null || raw === '') return null;
    var n = parseFloat(raw);
    if (!isFinite(n) || n <= 0) return null;
    if (stat.format === 'ms') return Math.round(n) + 'ms';
    if (stat.format === 'sec') return n.toFixed(1) + 's';
    return String(Math.round(n));
  }

  /* ---------------- render ---------------- */

  function setStatus(cls, text) {
    dot.className = 'dot' + (cls ? ' ' + cls : '');
    sub.textContent = text;
  }

  function render(games) {
    grid.innerHTML = '';
    if (!games.length) {
      setStatus('fail', 'Empty');
      var s = document.createElement('div');
      s.className = 'state';
      s.innerHTML = 'No titles installed.<br>Drop a folder with an <code>index.html</code> into <code>arcade/games/</code>.';
      grid.appendChild(s);
      return;
    }

    games.forEach(function (g) {
      var b = document.createElement('button');
      b.className = 'card';
      b.style.setProperty('--ink', g.ink);

      var gl = document.createElement('div');
      gl.className = 'glyph';
      gl.innerHTML = glyphSvg(g.glyph, 26);

      var nm = document.createElement('div');
      nm.className = 'name';
      nm.textContent = g.name;

      b.appendChild(gl);
      b.appendChild(nm);

      if (g.desc) {
        var d = document.createElement('div');
        d.className = 'desc';
        d.textContent = g.desc;
        b.appendChild(d);
      }

      var ro = document.createElement('div');
      ro.className = 'readout';
      var lab = document.createElement('span');
      lab.className = 'micro';
      lab.textContent = (g.stat && g.stat.label) || 'Best';
      var val = document.createElement('span');
      var v = readStat(g.stat);
      val.className = 'val' + (v ? '' : ' empty');
      val.textContent = v || '—';
      ro.appendChild(lab);
      ro.appendChild(val);
      b.appendChild(ro);

      var br = document.createElement('div');
      br.className = 'bracket';
      b.appendChild(br);

      b.addEventListener('click', function () { open(g); });
      grid.appendChild(b);
    });
  }

  function showError(msg) {
    setStatus('fail', 'Offline');
    grid.innerHTML = '';
    var s = document.createElement('div');
    s.className = 'state';
    s.textContent = msg;
    grid.appendChild(s);
  }

  /* ---------------- player ---------------- */

  var current = null;

  function open(g) {
    current = g;
    ptitle.textContent = g.name;
    // Fullscreen belongs to the game that asked for it. A game with no settings
    // sheet has no way to ask for the bar back, so inheriting the previous
    // game's fullscreen would leave it with no way out at all.
    player.classList.remove('fs');
    if (BUNDLE) {
      frame.removeAttribute('src');
      frame.srcdoc = BUNDLE.html[g.slug] || '<p>Missing.</p>';
    } else {
      frame.src = 'games/' + g.slug + '/' + g.entry;
    }
    player.classList.add('open');
    document.body.style.overflow = 'hidden';
    if (history.pushState) history.pushState({ game: g.slug }, '', '#' + g.slug);
  }

  function close() {
    player.classList.remove('open');
    player.classList.remove('fs');
    document.body.style.overflow = '';
    setTimeout(function () {
      if (player.classList.contains('open')) return;
      frame.removeAttribute('srcdoc');
      frame.src = 'about:blank';
      // A game may have just set a new personal best; refresh the readouts.
      if (current && lastGames) render(lastGames);
      current = null;
    }, 220);
  }

  document.getElementById('back').addEventListener('click', function () { leave(); });
  function leave() { if (location.hash) history.back(); else close(); }

  // Games ask for fullscreen by message; only the running game may ask, and
  // leaving one always clears it.
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || e.source !== frame.contentWindow) return;
    if (d.type === 'arcade:fullscreen') {
      player.classList.toggle('fs', !!d.on);
      fitPlayer();
    } else if (d.type === 'arcade:exit') {
      // Fullscreen leaves no launcher chrome at all, so the game asks for us.
      leave();
    } else if (d.type === 'arcade:spec') {
      gameSpec = sanitizeSpec(d); gameSpecAt = Date.now();
    }
  });
  window.addEventListener('popstate', close);

  /* ---------------- display metrics ---------------- */

  // Safari reports its viewport several different ways and they disagree, so
  // the player is sized from measurement and the numbers are put on screen
  // rather than inferred from a unit (DESIGN.md).

  var probe = document.getElementById('probe');
  var gameSpec = null, gameSpecAt = 0;

  // The game half of this panel arrives over postMessage, so it is untrusted
  // text going into innerHTML.
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function sanitizeSpec(d) {
    function str(v) { return v == null ? '' : String(v).slice(0, 48); }
    return { name: str(d.name), win: str(d.win), doc: str(d.doc), vv: str(d.vv),
             stage: str(d.stage), canvas: str(d.canvas), ins: str(d.ins),
             fps: d.fps == null ? null : str(d.fps), scale: str(d.scale) };
  }

  function insets() {
    var cs = getComputedStyle(probe);
    return { t: parseFloat(cs.paddingTop)    || 0, r: parseFloat(cs.paddingRight) || 0,
             b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft)  || 0 };
  }

  function isStandalone() {
    if (window.navigator.standalone === true) return true;
    return !!(window.matchMedia &&
              (matchMedia('(display-mode: standalone)').matches ||
               matchMedia('(display-mode: fullscreen)').matches));
  }

  function measure() {
    var vv = window.visualViewport, doc = document.documentElement;
    var w = Math.max(doc.clientWidth || 0, window.innerWidth || 0,
                     vv ? Math.round(vv.width + (vv.offsetLeft || 0)) : 0);
    var h = Math.max(doc.clientHeight || 0, window.innerHeight || 0,
                     vv ? Math.round(vv.height + (vv.offsetTop || 0)) : 0);
    // Installed to the home screen there is no browser chrome that could
    // explain a short viewport, so a report 59px under the screen is Safari
    // being wrong rather than something owning those pixels — take the screen.
    if (isStandalone() && screen.width && screen.height) {
      var lng = Math.max(screen.width, screen.height);
      var sht = Math.min(screen.width, screen.height);
      if (h >= w) { h = Math.max(h, lng); w = Math.max(w, sht); }
      else        { h = Math.max(h, sht); w = Math.max(w, lng); }
    }
    return { w: w, h: h };
  }

  function fitPlayer() {
    var m = measure();
    player.style.width  = m.w + 'px';
    player.style.height = m.h + 'px';
    document.documentElement.style.setProperty('--vh', m.h + 'px');
  }
  fitPlayer();
  window.addEventListener('resize', fitPlayer);
  window.addEventListener('orientationchange', function () {
    // Safari reports the pre-rotation size during the rotation itself.
    setTimeout(fitPlayer, 60); setTimeout(fitPlayer, 260); setTimeout(fitPlayer, 600);
  });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fitPlayer);
    window.visualViewport.addEventListener('scroll', fitPlayer);
  }

  function displayMode() {
    if (window.navigator.standalone === true) return 'standalone (iOS)';
    if (window.matchMedia) {
      var modes = ['fullscreen', 'standalone', 'minimal-ui'];
      for (var i = 0; i < modes.length; i++)
        if (matchMedia('(display-mode: ' + modes[i] + ')').matches) return modes[i];
    }
    return 'browser tab';
  }

  function collect() {
    var vv = window.visualViewport, doc = document.documentElement, ins = insets();
    var winW = window.innerWidth || 0, winH = window.innerHeight || 0;
    var sw = screen.width || 0, sh = screen.height || 0;
    var long = Math.max(sw, sh), short = Math.min(sw, sh);
    var portrait = winH >= winW;
    var expW = portrait ? short : long, expH = portrait ? long : short;

    var open = player.classList.contains('open');
    var r = open ? frame.getBoundingClientRect() : null;
    var above  = r ? Math.max(0, Math.round(r.top)) : 0;
    var below  = r ? Math.max(0, Math.round(winH - r.bottom)) : 0;
    var outside = Math.max(0, expH - winH);

    var g = (gameSpec && Date.now() - gameSpecAt < 4000) ? gameSpec : null;

    return {
      mode: displayMode(),
      win: winW + '×' + winH,
      doc: (doc.clientWidth || 0) + '×' + (doc.clientHeight || 0),
      vv: vv ? Math.round(vv.width) + '×' + Math.round(vv.height) +
               ' +' + Math.round(vv.offsetLeft || 0) + ',' + Math.round(vv.offsetTop || 0) : 'n/a',
      screen: sw + '×' + sh + ' @' + (window.devicePixelRatio || 1) + '×',
      expect: expW + '×' + expH,
      ins: ins.t + ' / ' + ins.r + ' / ' + ins.b + ' / ' + ins.l,
      player: open ? Math.round(player.getBoundingClientRect().width) + '×' +
                     Math.round(player.getBoundingClientRect().height) : '—',
      frame: r ? Math.round(r.width) + '×' + Math.round(r.height) : '— not open',
      fs: open ? (player.classList.contains('fs') ? 'on' : 'off') : '—',
      above: above, below: below, outside: outside,
      lost: above + below + outside,
      insT: ins.t, insB: ins.b,
      game: g
    };
  }

  var METRIC_ROWS = [
    ['Mode',            'mode'],
    ['window.inner',    'win'],
    ['doc.client',      'doc'],
    ['visualViewport',  'vv'],
    ['screen',          'screen'],
    ['Expected cover',  'expect'],
    ['Insets t/r/b/l',  'ins']
  ];

  var sheetEl   = document.getElementById('specsheet');
  var metricsEl = document.getElementById('metrics');
  var verdictEl = document.getElementById('verdict');
  var specTimer = null, lastText = '';

  function paintSpecs() {
    var m = collect();
    var html = '', text = [];

    function sect(t) { html += '<div class="sect">' + esc(t) + '</div>'; text.push('[' + t + ']'); }
    function row(label, value, cls) {
      html += '<div class="mrow"><span>' + esc(label) + '</span><b' +
              (cls ? ' class="' + cls + '"' : '') + '>' + esc(value) + '</b></div>';
      text.push(label + ': ' + value);
    }

    sect('Launcher');
    for (var i = 0; i < METRIC_ROWS.length; i++)
      row(METRIC_ROWS[i][0], m[METRIC_ROWS[i][1]]);

    sect('Frame');
    row('Player', m.player);
    row('Game frame', m.frame);
    row('Fullscreen', m.fs);
    row('Lost above', m.above + 'px', m.above ? 'warn' : 'ok');
    row('Lost below', m.below + 'px', m.below ? 'warn' : 'ok');
    row('Outside window', m.outside + 'px', m.outside ? 'warn' : 'ok');
    row('Total unused', m.lost + 'px', m.lost > 1 ? (m.lost > 20 ? 'bad' : 'warn') : 'ok');

    if (m.game) {
      var g = m.game;
      sect(g.name || 'Game');
      row('window.inner', g.win || '—');
      row('doc.client', g.doc || '—');
      row('visualViewport', g.vv || '—');
      row('Stage', g.stage || '—');
      row('Canvas px', g.canvas || '—');
      row('Insets t/r/b/l', g.ins || '—');
      if (g.fps != null) row('FPS / scale', g.fps + ' @ ' + g.scale);
    } else if (player.classList.contains('open')) {
      sect('Game'); row('Reporting', 'no answer');
    }

    metricsEl.innerHTML = html;

    // Naming where the pixels went is the whole point: inside the layout is
    // ours to fix, outside the window is not.
    var v;
    if (m.lost <= 1) {
      v = 'Covered. The frame matches the physical screen exactly.';
    } else {
      var bits = [];
      if (m.above)   bits.push(m.above + 'px above the frame');
      if (m.below)   bits.push(m.below + 'px below it');
      if (m.outside) bits.push(m.outside + 'px outside the window');
      v = m.lost + 'px unused — ' + bits.join(', ') + '. ';
      if (m.above || m.below) {
        v += 'The band inside the window is launcher chrome; a game’s fullscreen setting takes it. ';
      }
      if (m.outside) {
        v += (m.insT + m.insB >= m.outside - 2)
          ? 'The outside band matches the safe-area insets (' + m.insT + ' top, ' + m.insB +
            ' bottom), so the system inset the web view — not this layout.'
          : 'Insets read ' + m.insT + '/' + m.insB + ', so that band is browser chrome rather ' +
            'than a safe area; installing to the home screen reclaims it.';
      }
    }
    verdictEl.textContent = v;

    lastText = 'Arcade v' + (window.__ARCADE_VERSION__ || '?') + '\n' +
               text.join('\n') + '\n\n' + v;
  }

  function openSpecs() {
    sheetEl.hidden = false;
    paintSpecs();
    clearInterval(specTimer);
    specTimer = setInterval(function () {
      if (player.classList.contains('open') && frame.contentWindow)
        frame.contentWindow.postMessage({ type: 'arcade:spec?' }, '*');
      paintSpecs();
    }, 500);
  }
  function closeSpecs() { sheetEl.hidden = true; clearInterval(specTimer); specTimer = null; }

  document.getElementById('specs').addEventListener('click', openSpecs);
  document.getElementById('pspec').addEventListener('click', openSpecs);
  document.getElementById('closeSpecs').addEventListener('click', closeSpecs);
  sheetEl.addEventListener('click', function (e) { if (e.target === sheetEl) closeSpecs(); });
  document.getElementById('copySpecs').addEventListener('click', function (e) {
    var b = e.currentTarget;
    var done = function (ok) {
      b.textContent = ok ? 'Copied' : 'No clipboard';
      setTimeout(function () { b.textContent = 'Copy'; }, 1400);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(lastText).then(function () { done(true); },
                                                   function () { done(false); });
    } else { done(false); }
  });

  /* ---------------- load ---------------- */

  var lastGames = null;

  function paint(games, cls, note) {
    lastGames = games;
    render(games);
    if (games.length) {
      setStatus(cls, games.length + (games.length === 1 ? ' title' : ' titles') + (note ? ' · ' + note : ''));
    }
  }

  function load(force) {
    var cached = null;
    try { cached = JSON.parse(localStorage.getItem(CKEY) || 'null'); } catch (e) {}

    if (cached && cached.games && !force && Date.now() - cached.at < TTL) {
      paint(cached.games.map(normalize), 'ok', null);
      return Promise.resolve();
    }
    if (cached && cached.games && cached.games.length) paint(cached.games.map(normalize), 'cached', 'cached');

    return discover()
      .then(function (games) {
        try { localStorage.setItem(CKEY, JSON.stringify({ at: Date.now(), games: games })); } catch (e) {}
        paint(games, 'ok', null);
      })
      .catch(function () {
        if (cached && cached.games && cached.games.length) {
          paint(cached.games.map(normalize), 'cached', 'cached');
        } else {
          showError('Could not load the game list. Check your connection and refresh.');
        }
      });
  }

  /* ---------------- refresh ---------------- */

  var btn = document.getElementById('refresh');

  // In a bundled build the list is baked in, so there is nothing to re-fetch —
  // the button checks for a newer service worker instead.
  function checkForUpdate() {
    if (!('serviceWorker' in navigator)) return Promise.resolve();
    return navigator.serviceWorker.getRegistration()
      .then(function (reg) {
        if (!reg) return;
        return reg.update().then(function () {
          if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
        });
      })
      .catch(function () {});
  }

  btn.addEventListener('click', function () {
    btn.classList.add('busy');
    var job = BUNDLE
      ? checkForUpdate().then(function () { location.reload(); })
      : load(true);
    job.then(function () { btn.classList.remove('busy'); });
  });

  if (!BUNDLE) {
    // Pull-to-refresh, for when the list is already at the top.
    var startY = 0, pulling = false;
    window.addEventListener('touchstart', function (e) {
      if (window.scrollY <= 0 && !player.classList.contains('open')) {
        startY = e.touches[0].clientY; pulling = true;
      }
    }, { passive: true });
    window.addEventListener('touchend', function (e) {
      if (pulling && e.changedTouches[0].clientY - startY > 90) btn.click();
      pulling = false;
    }, { passive: true });
  }

  /* ---------------- build stamp + service worker ---------------- */

  if (window.__ARCADE_VERSION__) {
    var vEl = document.getElementById('version');
    var showSize = false;
    function stamp() {
      vEl.textContent = showSize
        ? Math.round(window.innerWidth) + '×' + Math.round(window.innerHeight) +
          ' @' + (window.devicePixelRatio || 1) + '×'
        : 'v' + window.__ARCADE_VERSION__;
    }
    vEl.addEventListener('click', function () { showSize = !showSize; stamp(); });
    window.addEventListener('resize', stamp);
    stamp();
    vEl.hidden = false;
  }

  // Relative on purpose: this has to work from a GitHub Pages project subpath.
  if (window.__ARCADE_SW__ && 'serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
    var reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (reloading) return;
      reloading = true;
      location.reload();
    });
  }

  load(false);
})();
</script>
</body>
</html>
