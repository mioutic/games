<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Arcade</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0609">
<!-- The deployed app lives in ./play/. This is the repository root, which is
     the URL GitHub's Pages settings advertises and the one "Visit site" opens,
     so it forwards rather than 404s. Relative on purpose: Pages serves this
     from the project subpath /games/. -->
<meta http-equiv="refresh" content="0; url=./play/">
<link rel="canonical" href="./play/">
<style>
  html, body { height: 100%; margin: 0; background: #0b0609; color: #f2e6e6;
               font: 400 15px/1.6 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  main { height: 100%; display: grid; place-content: center; place-items: center;
         gap: 14px; text-align: center; padding: 24px; }
  h1 { font: 400 30px/1 Georgia, "Times New Roman", serif; letter-spacing: .04em; margin: 0; }
  p { color: #8f6f76; margin: 0; font-size: 13px; }
  .mark { color: #e9d8c5; }
  a { display: inline-block; margin-top: 8px; padding: 12px 26px;
      border: 1px solid #e9d8c5; border-radius: 2px; background: #e9d8c5; color: #0b0609;
      text-decoration: none; font: 500 11px/1 -apple-system, system-ui, sans-serif;
      letter-spacing: .18em; text-transform: uppercase; }
</style>
</head>
<body>
<main>
  <svg class="mark" width="34" height="34" viewBox="0 0 34 34" fill="none" aria-hidden="true">
    <g stroke="currentColor" stroke-width="1.1">
      <circle cx="17" cy="17" r="12.4"/>
      <path d="M17 1.6v3.2M17 29.2v3.2M1.6 17h3.2M29.2 17h3.2"/>
    </g>
    <path d="M17 9.4c1.5 2.5 4 4.9 4 6.6a4 4 0 0 1-8 0c0-1.7 2.5-4.1 4-6.6z" fill="#b81d3a"/>
  </svg>
  <h1>Arcade</h1>
  <p>Taking you to the arcade&hellip;</p>
  <a href="./play/">Enter</a>
</main>
<script>location.replace('./play/');</script>
</body>
</html>
