        if (!list.length) throw new Error('empty index');
        return list.map(normalize);
      })
      .catch(function () {
        return listFolders().then(function (slugs) { return Promise.all(slugs.sort().map(describe)); });
      });
  }

  // Must be idempotent: the cache stores already-normalized records, so this
  // runs a second time over its own output and has to accept either key.
  function normalize(g) {
    var slug = g.slug;
    return {
      slug:  slug,
      name:  g.name || titleize(slug),
      desc:  g.description || g.desc || '',
      glyph: g.glyph || 'default',
      ink:   g.ink || INKS[hash(slug) % INKS.length],
      stat:  g.stat || null,
      entry: g.entry || 'index.html'
    };
  }

  function listFolders() {
    var i = 0;
    function attempt() {
      if (i >= REFS.length) return Promise.reject(new Error('no ref matched'));
      var ref = REFS[i++];
      var url = 'https://api.github.com/repos/' + REPO + '/contents/' + DIR + '?ref=' + encodeURIComponent(ref);
      return fetch(url, { headers: { Accept: 'application/vnd.github+json' } })
        .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)); })
        .then(function (items) {
          var dirs = (items || []).filter(function (it) { return it.type === 'dir'; })
                                  .map(function (it) { return it.name; });
          return dirs.length ? dirs : attempt();
        })
        .catch(attempt);
    }
    return attempt();
  }

  // Metadata comes from the site itself (same origin, no rate limit). A game.json
  // is optional — without one we derive a decent title from the folder name.
  function describe(slug) {
    return fetch('games/' + slug + '/game.json', { cache: 'no-cache' })
      .then(function (r) { return r.ok ? r.json() : {}; })
      .catch(function () { return {}; })
      .then(function (meta) { meta.slug = slug; return normalize(meta); });
  }

  function titleize(s) {
    return s.replace(/[-_]+/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); });
  }
  function hash(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return h;
  }

  // Each game names the localStorage key holding its personal best, so the
  // launcher can show it as a readout without knowing anything else about it.
  function readStat(stat) {
    if (!stat || !stat.key) return null;
    var raw;
    try { raw = localStorage.getItem(stat.key); } catch (e) { return null; }
    if (raw === null || raw === '') return null;
    var n = parseFloat(raw);
    if (!isFinite(n) || n <= 0) return null;
    if (stat.format === 'ms') return Math.round(n) + 'ms';
    if (stat.format === 'sec') return n.toFixed(1) + 's';
    return String(Math.round(n));
  }

  /* ---------------- render ---------------- */

  function setStatus(cls, text) {
    dot.className = 'dot' + (cls ? ' ' + cls : '');
    sub.textContent = text;
  }

  function render(games) {
    grid.innerHTML = '';
    if (!games.length) {
      setStatus('fail', 'Empty');
      var s = document.createElement('div');
      s.className = 'state';
      s.innerHTML = 'No titles installed.<br>Drop a folder with an <code>index.html</code> into <code>arcade/games/</code>.';
      grid.appendChild(s);
      return;
    }

    games.forEach(function (g) {
      var b = document.createElement('button');
      b.className = 'card';
      b.style.setProperty('--ink', g.ink);

      var gl = document.createElement('div');
      gl.className = 'glyph';
      gl.innerHTML = glyphSvg(g.glyph, 26);

      var nm = document.createElement('div');
      nm.className = 'name';
      nm.textContent = g.name;

      b.appendChild(gl);
      b.appendChild(nm);

      if (g.desc) {
        var d = document.createElement('div');
        d.className = 'desc';
        d.textContent = g.desc;
        b.appendChild(d);
      }

      var ro = document.createElement('div');
      ro.className = 'readout';
      var lab = document.createElement('span');
      lab.className = 'micro';
      lab.textContent = (g.stat && g.stat.label) || 'Best';
      var val = document.createElement('span');
      var v = readStat(g.stat);
      val.className = 'val' + (v ? '' : ' empty');
      val.textContent = v || '—';
      ro.appendChild(lab);
      ro.appendChild(val);
      b.appendChild(ro);

      var br = document.createElement('div');
      br.className = 'bracket';
      b.appendChild(br);

      b.addEventListener('click', function () { open(g); });
      grid.appendChild(b);
    });
  }

  function showError(msg) {
    setStatus('fail', 'Offline');
    grid.innerHTML = '';
    var s = document.createElement('div');
    s.className = 'state';
    s.textContent = msg;
    grid.appendChild(s);
  }

  /* ---------------- player ---------------- */

  var current = null;

  function open(g) {
    current = g;
    ptitle.textContent = g.name;
    // Fullscreen belongs to the game that asked for it. A game with no settings
    // sheet has no way to ask for the bar back, so inheriting the previous
    // game's fullscreen would leave it with no way out at all.
    player.classList.remove('fs');
    if (BUNDLE) {
      frame.removeAttribute('src');
      frame.srcdoc = BUNDLE.html[g.slug] || '<p>Missing.</p>';
    } else {
      frame.src = 'games/' + g.slug + '/' + g.entry;
    }
    player.classList.add('open');
    document.body.style.overflow = 'hidden';
    if (history.pushState) history.pushState({ game: g.slug }, '', '#' + g.slug);
  }

  function close() {
    player.classList.remove('open');
    player.classList.remove('fs');
    document.body.style.overflow = '';
    setTimeout(function () {
      if (player.classList.contains('open')) return;
      frame.removeAttribute('srcdoc');
      frame.src = 'about:blank';
      // A game may have just set a new personal best; refresh the readouts.
      if (current && lastGames) render(lastGames);
      current = null;
    }, 220);
  }

  document.getElementById('back').addEventListener('click', function () { leave(); });
  function leave() { if (location.hash) history.back(); else close(); }

  // Games ask for fullscreen by message; only the running game may ask, and
  // leaving one always clears it.
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || e.source !== frame.contentWindow) return;
    if (d.type === 'arcade:fullscreen') {
      player.classList.toggle('fs', !!d.on);
      fitPlayer();
    } else if (d.type === 'arcade:exit') {
      // Fullscreen leaves no launcher chrome at all, so the game asks for us.
      leave();
    } else if (d.type === 'arcade:spec') {
      gameSpec = sanitizeSpec(d); gameSpecAt = Date.now();
    }
  });
  window.addEventListener('popstate', close);

  /* ---------------- display metrics ---------------- */

  // Safari reports its viewport several different ways and they disagree, so
  // the player is sized from measurement and the numbers are put on screen
  // rather than inferred from a unit (DESIGN.md).

  var probe = document.getElementById('probe');
  var gameSpec = null, gameSpecAt = 0;

  // The game half of this panel arrives over postMessage, so it is untrusted
  // text going into innerHTML.
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function sanitizeSpec(d) {
    function str(v) { return v == null ? '' : String(v).slice(0, 48); }
    return { name: str(d.name), win: str(d.win), doc: str(d.doc), vv: str(d.vv),
             stage: str(d.stage), canvas: str(d.canvas), ins: str(d.ins),
             fps: d.fps == null ? null : str(d.fps), scale: str(d.scale) };
  }

  function insets() {
    var cs = getComputedStyle(probe);
    return { t: parseFloat(cs.paddingTop)    || 0, r: parseFloat(cs.paddingRight) || 0,
             b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft)  || 0 };
  }

  function isStandalone() {
    if (window.navigator.standalone === true) return true;
    return !!(window.matchMedia &&
              (matchMedia('(display-mode: standalone)').matches ||
               matchMedia('(display-mode: fullscreen)').matches));
  }

  function measure() {
    var vv = window.visualViewport, doc = document.documentElement;
    var w = Math.max(doc.clientWidth || 0, window.innerWidth || 0,
                     vv ? Math.round(vv.width + (vv.offsetLeft || 0)) : 0);
    var h = Math.max(doc.clientHeight || 0, window.innerHeight || 0,
                     vv ? Math.round(vv.height + (vv.offsetTop || 0)) : 0);
    // Installed to the home screen there is no browser chrome that could
    // explain a short viewport, so a report 59px under the screen is Safari
    // being wrong rather than something owning those pixels — take the screen.
    if (isStandalone() && screen.width && screen.height) {
      var lng = Math.max(screen.width, screen.height);
      var sht = Math.min(screen.width, screen.height);
      if (h >= w) { h = Math.max(h, lng); w = Math.max(w, sht); }
      else        { h = Math.max(h, sht); w = Math.max(w, lng); }
    }
    return { w: w, h: h };
  }

  function fitPlayer() {
    var m = measure();
    player.style.width  = m.w + 'px';
    player.style.height = m.h + 'px';
    document.documentElement.style.setProperty('--vh', m.h + 'px');
  }
  fitPlayer();
  window.addEventListener('resize', fitPlayer);
  window.addEventListener('orientationchange', function () {
    // Safari reports the pre-rotation size during the rotation itself.
    setTimeout(fitPlayer, 60); setTimeout(fitPlayer, 260); setTimeout(fitPlayer, 600);
  });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fitPlayer);
    window.visualViewport.addEventListener('scroll', fitPlayer);
  }

  function displayMode() {
    if (window.navigator.standalone === true) return 'standalone (iOS)';
    if (window.matchMedia) {
      var modes = ['fullscreen', 'standalone', 'minimal-ui'];
      for (var i = 0; i < modes.length; i++)
        if (matchMedia('(display-mode: ' + modes[i] + ')').matches) return modes[i];
    }
    return 'browser tab';
  }

  function collect() {
    var vv = window.visualViewport, doc = document.documentElement, ins = insets();
    var winW = window.innerWidth || 0, winH = window.innerHeight || 0;
    var sw = screen.width || 0, sh = screen.height || 0;
    var long = Math.max(sw, sh), short = Math.min(sw, sh);
    var portrait = winH >= winW;
    var expW = portrait ? short : long, expH = portrait ? long : short;

    var open = player.classList.contains('open');
    var r = open ? frame.getBoundingClientRect() : null;
    var above  = r ? Math.max(0, Math.round(r.top)) : 0;
    var below  = r ? Math.max(0, Math.round(winH - r.bottom)) : 0;
    var outside = Math.max(0, expH - winH);

    var g = (gameSpec && Date.now() - gameSpecAt < 4000) ? gameSpec : null;

    return {
      mode: displayMode(),
      win: winW + '×' + winH,
      doc: (doc.clientWidth || 0) + '×' + (doc.clientHeight || 0),
      vv: vv ? Math.round(vv.width) + '×' + Math.round(vv.height) +
               ' +' + Math.round(vv.offsetLeft || 0) + ',' + Math.round(vv.offsetTop || 0) : 'n/a',
      screen: sw + '×' + sh + ' @' + (window.devicePixelRatio || 1) + '×',
      expect: expW + '×' + expH,
      ins: ins.t + ' / ' + ins.r + ' / ' + ins.b + ' / ' + ins.l,
      player: open ? Math.round(player.getBoundingClientRect().width) + '×' +
                     Math.round(player.getBoundingClientRect().height) : '—',
      frame: r ? Math.round(r.width) + '×' + Math.round(r.height) : '— not open',
      fs: open ? (player.classList.contains('fs') ? 'on' : 'off') : '—',
      above: above, below: below, outside: outside,
      lost: above + below + outside,
      insT: ins.t, insB: ins.b,
      game: g
    };
  }

  var METRIC_ROWS = [
    ['Mode',            'mode'],
    ['window.inner',    'win'],
    ['doc.client',      'doc'],
    ['visualViewport',  'vv'],
    ['screen',          'screen'],
    ['Expected cover',  'expect'],
    ['Insets t/r/b/l',  'ins']
  ];

  var sheetEl   = document.getElementById('specsheet');
  var metricsEl = document.getElementById('metrics');
  var verdictEl = document.getElementById('verdict');
  var specTimer = null, lastText = '';

  function paintSpecs() {
    var m = collect();
    var html = '', text = [];

    function sect(t) { html += '<div class="sect">' + esc(t) + '</div>'; text.push('[' + t + ']'); }
    function row(label, value, cls) {
      html += '<div class="mrow"><span>' + esc(label) + '</span><b' +
              (cls ? ' class="' + cls + '"' : '') + '>' + esc(value) + '</b></div>';
      text.push(label + ': ' + value);
    }

    sect('Launcher');
    for (var i = 0; i < METRIC_ROWS.length; i++)
      row(METRIC_ROWS[i][0], m[METRIC_ROWS[i][1]]);

    sect('Frame');
    row('Player', m.player);
    row('Game frame', m.frame);
    row('Fullscreen', m.fs);
    row('Lost above', m.above + 'px', m.above ? 'warn' : 'ok');
    row('Lost below', m.below + 'px', m.below ? 'warn' : 'ok');
    row('Outside window', m.outside + 'px', m.outside ? 'warn' : 'ok');
    row('Total unused', m.lost + 'px', m.lost > 1 ? (m.lost > 20 ? 'bad' : 'warn') : 'ok');

    if (m.game) {
      var g = m.game;
      sect(g.name || 'Game');
      row('window.inner', g.win || '—');
      row('doc.client', g.doc || '—');
      row('visualViewport', g.vv || '—');
      row('Stage', g.stage || '—');
      row('Canvas px', g.canvas || '—');
      row('Insets t/r/b/l', g.ins || '—');
      if (g.fps != null) row('FPS / scale', g.fps + ' @ ' + g.scale);
    } else if (player.classList.contains('open')) {
      sect('Game'); row('Reporting', 'no answer');
    }

    metricsEl.innerHTML = html;

    // Naming where the pixels went is the whole point: inside the layout is
    // ours to fix, outside the window is not.
    var v;
    if (m.lost <= 1) {
      v = 'Covered. The frame matches the physical screen exactly.';
    } else {
      var bits = [];
      if (m.above)   bits.push(m.above + 'px above the frame');
      if (m.below)   bits.push(m.below + 'px below it');
      if (m.outside) bits.push(m.outside + 'px outside the window');
      v = m.lost + 'px unused — ' + bits.join(', ') + '. ';
      if (m.above || m.below) {
        v += 'The band inside the window is launcher chrome; a game’s fullscreen setting takes it. ';
      }
      if (m.outside) {
        v += (m.insT + m.insB >= m.outside - 2)
          ? 'The outside band matches the safe-area insets (' + m.insT + ' top, ' + m.insB +
            ' bottom), so the system inset the web view — not this layout.'
          : 'Insets read ' + m.insT + '/' + m.insB + ', so that band is browser chrome rather ' +
            'than a safe area; installing to the home screen reclaims it.';
      }
    }
    verdictEl.textContent = v;

    lastText = 'Arcade v' + (window.__ARCADE_VERSION__ || '?') + '\n' +
               text.join('\n') + '\n\n' + v;
  }

  function openSpecs() {
    sheetEl.hidden = false;
    paintSpecs();
    clearInterval(specTimer);
    specTimer = setInterval(function () {
      if (player.classList.contains('open') && frame.contentWindow)
        frame.contentWindow.postMessage({ type: 'arcade:spec?' }, '*');
      paintSpecs();
    }, 500);
  }
  function closeSpecs() { sheetEl.hidden = true; clearInterval(specTimer); specTimer = null; }

  document.getElementById('specs').addEventListener('click', openSpecs);
  document.getElementById('pspec').addEventListener('click', openSpecs);
  document.getElementById('closeSpecs').addEventListener('click', closeSpecs);
  sheetEl.addEventListener('click', function (e) { if (e.target === sheetEl) closeSpecs(); });
  document.getElementById('copySpecs').addEventListener('click', function (e) {
    var b = e.currentTarget;
    var done = function (ok) {
      b.textContent = ok ? 'Copied' : 'No clipboard';
      setTimeout(function () { b.textContent = 'Copy'; }, 1400);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(lastText).then(function () { done(true); },
                                                   function () { done(false); });
    } else { done(false); }
  });

  /* ---------------- load ---------------- */

  var lastGames = null;

  function paint(games, cls, note) {
    lastGames = games;
    render(games);
    if (games.length) {
      setStatus(cls, games.length + (games.length === 1 ? ' title' : ' titles') + (note ? ' · ' + note : ''));
    }
  }

  function load(force) {
    var cached = null;
    try { cached = JSON.parse(localStorage.getItem(CKEY) || 'null'); } catch (e) {}

    if (cached && cached.games && !force && Date.now() - cached.at < TTL) {
      paint(cached.games.map(normalize), 'ok', null);
      return Promise.resolve();
    }
    if (cached && cached.games && cached.games.length) paint(cached.games.map(normalize), 'cached', 'cached');

    return discover()
      .then(function (games) {
        try { localStorage.setItem(CKEY, JSON.stringify({ at: Date.now(), games: games })); } catch (e) {}
        paint(games, 'ok', null);
      })
      .catch(function () {
        if (cached && cached.games && cached.games.length) {
          paint(cached.games.map(normalize), 'cached', 'cached');
        } else {
          showError('Could not load the game list. Check your connection and refresh.');
        }
      });
  }

  /* ---------------- refresh ---------------- */

  var btn = document.getElementById('refresh');

  // In a bundled build the list is baked in, so there is nothing to re-fetch —
  // the button checks for a newer service worker instead.
  function checkForUpdate() {
    if (!('serviceWorker' in navigator)) return Promise.resolve();
    return navigator.serviceWorker.getRegistration()
      .then(function (reg) {
        if (!reg) return;
        return reg.update().then(function () {
          if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
        });
      })
      .catch(function () {});
  }

  btn.addEventListener('click', function () {
    btn.classList.add('busy');
    var job = BUNDLE
      ? checkForUpdate().then(function () { location.reload(); })
      : load(true);
    job.then(function () { btn.classList.remove('busy'); });
  });

  if (!BUNDLE) {
    // Pull-to-refresh, for when the list is already at the top.
    var startY = 0, pulling = false;
    window.addEventListener('touchstart', function (e) {
      if (window.scrollY <= 0 && !player.classList.contains('open')) {
        startY = e.touches[0].clientY; pulling = true;
      }
    }, { passive: true });
    window.addEventListener('touchend', function (e) {
      if (pulling && e.changedTouches[0].clientY - startY > 90) btn.click();
      pulling = false;
    }, { passive: true });
  }

  /* ---------------- build stamp + service worker ---------------- */

  if (window.__ARCADE_VERSION__) {
    var vEl = document.getElementById('version');
    var showSize = false;
    function stamp() {
      vEl.textContent = showSize
        ? Math.round(window.innerWidth) + '×' + Math.round(window.innerHeight) +
          ' @' + (window.devicePixelRatio || 1) + '×'
        : 'v' + window.__ARCADE_VERSION__;
    }
    vEl.addEventListener('click', function () { showSize = !showSize; stamp(); });
    window.addEventListener('resize', stamp);
    stamp();
    vEl.hidden = false;
  }

  // Relative on purpose: this has to work from a GitHub Pages project subpath.
  if (window.__ARCADE_SW__ && 'serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
    var reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (reloading) return;
      reloading = true;
      location.reload();
    });
  }

  load(false);
})();
</script>
</body>
</html>
