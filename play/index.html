%22%3E%0A%20%20%20%20%20%20%3Cpath%20d%3D%22M90%2014.6v3.8%22%20transform%3D%22rotate%2830%2090%2090%29%22%2F%3E%0A%20%20%20%20%20%20%3Cpath%20d%3D%22M90%2014.6v3.8%22%20transform%3D%22rotate%2860%2090%2090%29%22%2F%3E%0A%20%20%20%20%20%20%3Cpath%20d%3D%22M90%2014.6v3.8%22%20transform%3D%22rotate%28120%2090%2090%29%22%2F%3E%0A%20%20%20%20%20%20%3Cpath%20d%3D%22M90%2014.6v3.8%22%20transform%3D%22rotate%28150%2090%2090%29%22%2F%3E%0A%20%20%20%20%20%20%3Cpath%20d%3D%22M90%2014.6v3.8%22%20transform%3D%22rotate%28210%2090%2090%29%22%2F%3E%0A%20%20%20%20%20%20%3Cpath%20d%3D%22M90%2014.6v3.8%22%20transform%3D%22rotate%28240%2090%2090%29%22%2F%3E%0A%20%20%20%20%20%20%3Cpath%20d%3D%22M90%2014.6v3.8%22%20transform%3D%22rotate%28300%2090%2090%29%22%2F%3E%0A%20%20%20%20%20%20%3Cpath%20d%3D%22M90%2014.6v3.8%22%20transform%3D%22rotate%28330%2090%2090%29%22%2F%3E%0A%20%20%20%20%3C%2Fg%3E%0A%20%20%3C%2Fg%3E%0A%0A%20%20%3C%21--%20arterial%20drop%3A%20apex%20y58.5%2C%20bulb%20centre%20y101.7%20r20.3%20--%3E%0A%20%20%3Cpath%20d%3D%22M90%2058.5c7.6%2012.7%2020.3%2024.6%2020.3%2033.2a20.3%2020.3%200%200%201-40.6%200c0-8.6%2012.7-20.5%2020.3-33.2z%22%0A%20%20%20%20%20%20%20%20fill%3D%22%23b81d3a%22%2F%3E%0A%3C%2Fsvg%3E%0A" type="image/svg+xml">
<style>
  /* Sanguine — see DESIGN.md. Pallor and blood: bone is the accent, crimson
     is decorative, and the ground stays near-black oxblood throughout. */
  :root {
    --s-0: #0b0609;  --s-1: #12080c;  --s-2: #1a0d12;  --s-3: #241119;
    --t-0: #f2e6e6;  --t-1: #c3a9ad;  --t-2: #8f6f76;  --t-3: #5c434a;
    --accent: #e9d8c5;
    --accent-2: #b81d3a;
    --brand: #d9557a;
    --line-0: #150a0e;  --line-1: #2a141c;  --line-2: #3d1f28;
    --error: #ff5470;  --success: #5fa777;  --pending: #a884c9;
    --cat-1: #6fb3ab; --cat-2: #8a8fc9; --cat-3: #a884c9; --cat-4: #c96a8e;

    --bloom:    0 0 12px rgba(216,58,88,.45), 0 0 26px rgba(216,58,88,.16);
    --bloom-lg: 0 0 22px rgba(216,58,88,.45), 0 0 52px rgba(216,58,88,.16);
    --lit-within: inset 0 0 60px rgba(184,29,58,.05);
    --scrim: #050203;

    --ov-hover: rgba(233,216,197,.06);
    --ov-active: rgba(233,216,197,.12);

    --font-display: Georgia, "Times New Roman", serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;

    --radius: 2px;
    --dur: 160ms;
    --ease: cubic-bezier(.2,.6,.2,1);

    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: min(env(safe-area-inset-bottom, 0px), 34px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--s-0); color: var(--t-0);
    font: 400 16px/1.45 var(--font-ui);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    touch-action: manipulation;
  }
  body { overflow-x: hidden; }

  /* micro-label: the console voice — uppercase, wide, small */
  .micro {
    font: 500 10px/1 var(--font-ui);
    letter-spacing: .16em; text-transform: uppercase; color: var(--t-2);
  }

  .wrap {
    padding: calc(var(--safe-t) + 18px) calc(var(--safe-r) + 16px)
             calc(var(--safe-b) + 18px) calc(var(--safe-l) + 16px);
    max-width: 760px; margin: 0 auto;
    min-height: 100%;
    min-height: 100dvh;      /* survives Safari's collapsing toolbars */
    display: flex; flex-direction: column;
  }

  /* ---------- masthead ---------- */
  header { display: flex; align-items: flex-start; gap: 14px; }
  .mark { flex: none; width: 34px; height: 34px; margin-top: 2px; color: var(--accent); }
  .mark .rotor { transform-origin: 50% 50%; animation: rotor 60s linear infinite; }
  @keyframes rotor { to { transform: rotate(360deg); } }

  h1 {
    font: 400 30px/1 var(--font-display);
    letter-spacing: .04em; margin: 0; color: var(--t-0);
  }
  .status { display: flex; align-items: center; gap: 7px; margin-top: 9px; }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--t-3); flex: none;
    transition: background var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  }
  .dot.ok      { background: var(--success); box-shadow: 0 0 8px rgba(95,167,119,.7); }
  .dot.cached  { background: var(--pending); box-shadow: 0 0 8px rgba(168,132,201,.7); }
  .dot.fail    { background: var(--error);   box-shadow: 0 0 8px rgba(255,84,112,.7); }

  .spacer { flex: 1; }

  .instrs { flex: none; display: flex; gap: 8px; }
  button.instr {
    appearance: none; flex: none;
    width: 38px; height: 38px; border-radius: var(--radius);
    border: 1px solid var(--line-2); background: var(--s-1);
    color: var(--accent); display: grid; place-items: center;
    transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);
  }
  button.instr:active { background: var(--ov-active); border-color: var(--accent-2); }
  button.instr:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.instr.busy svg { animation: sweep 900ms linear infinite; }
  @keyframes sweep { to { transform: rotate(360deg); } }

  .rule {
    height: 1px; background: var(--line-1); margin: 16px 0 14px;
    position: relative;
  }
  .rule::after {
    content: ""; position: absolute; left: 0; top: 0; width: 46px; height: 1px;
    background: var(--accent-2);
  }

  /* ---------- grid ---------- */
  /* The grid takes the slack rather than leaving a band of nothing above the
     footer; card content centres itself so a tall card still reads as full. */
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
          flex: 1 1 auto; grid-auto-rows: minmax(152px, 1fr); }
  /* Landscape has height to spare across, not down — shorter rows so the
     library still fits without scrolling. */
  @media (max-height: 500px) {
    .grid { grid-auto-rows: minmax(124px, 1fr); }
    .card { min-height: 124px; padding: 11px 11px 9px; }
    .card .glyph { margin-bottom: 7px; }
    .card .desc { -webkit-line-clamp: 1; }
    .foot { padding-top: 14px; }
  }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(3, 1fr); } }

  .card {
    position: relative; display: flex; flex-direction: column; text-align: left;
    appearance: none; border: 1px solid var(--line-1); border-radius: var(--radius);
    background: var(--s-1); color: inherit; padding: 15px 13px 11px;
    min-height: 152px; overflow: hidden;
    transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease),
                box-shadow var(--dur) var(--ease);
  }
  .card::before {                      /* channel strip: the game's categorical ink */
    content: ""; position: absolute; inset: 0 0 auto 0; height: 2px;
    background: var(--ink, var(--cat-1)); opacity: .85;
  }
  .card .bracket {                     /* machined corner bracket */
    position: absolute; right: 9px; bottom: 9px; width: 9px; height: 9px;
    border-right: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2);
  }
  .card:active {
    background: var(--ov-hover); border-color: var(--accent-2);
    box-shadow: var(--bloom), var(--lit-within);
  }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card .glyph { color: var(--accent); margin-top: auto; margin-bottom: 12px; }
  .card .name {
    font: 400 18px/1.15 var(--font-display); letter-spacing: .02em; color: var(--t-0);
  }
  .card .desc {
    color: var(--t-2); font-size: 12px; line-height: 1.4; margin-top: 5px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card .readout {
    margin-top: auto; padding-top: 10px; display: flex; align-items: baseline;
    justify-content: space-between; gap: 8px; border-top: 1px solid var(--line-0);
  }
  .card .readout .val {
    font: 500 13px/1 var(--font-mono); font-variant-numeric: tabular-nums; color: var(--t-1);
  }
  .card .readout .val.empty { color: var(--t-3); }

  /* ---------- states ---------- */
  .state { grid-column: 1 / -1; text-align: center; color: var(--t-2);
           padding: 54px 18px; font-size: 13.5px; line-height: 1.7; }
  .state code {
    font: 400 12px/1 var(--font-mono); color: var(--t-1);
    background: var(--s-2); border: 1px solid var(--line-1); border-radius: var(--radius);
    padding: 3px 5px;
  }
  .skel {
    min-height: 152px; border: 1px solid var(--line-1); border-radius: var(--radius);
    background: var(--s-1); position: relative; overflow: hidden;
  }
  .skel::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, var(--ov-hover), transparent);
    transform: translateX(-100%); animation: scan 1.4s var(--ease) infinite;
  }
  @keyframes scan { to { transform: translateX(100%); } }

  /* The stamp rides in the flow rather than fixed to the viewport: that is
     what makes its bottom gap equal the header's top gap on any device. */
  .footbar { margin-top: auto; padding-top: 22px; display: flex;
             align-items: flex-end; gap: 10px; }
  .foot { flex: 1; min-width: 0; text-align: center;
          color: var(--t-3); font-size: 11px; line-height: 1.8; }
  .foot code { font-family: var(--font-mono); color: var(--t-2); }

  .version {
    flex: none; appearance: none; white-space: nowrap;
    font: 500 9.5px/1 var(--font-mono); letter-spacing: .1em;
    color: var(--brand); border: 1px solid var(--line-2); border-radius: var(--radius);
    /* the trailing letter-spacing eats into the right edge, so pad it back */
    padding: 5px 8px 5px 7px; background: var(--s-1);
    font-variant-numeric: tabular-nums;
  }
  .version:active { background: var(--ov-active); }
  .version[hidden] { display: none; }

  /* ---------- metrics sheet ---------- */
  /* Guessing at someone else's device is not a technique (DESIGN.md): this
     reads the real numbers off the launcher and off the running game. */
  .sheet {
    position: fixed; inset: 0; z-index: 60; display: grid; place-items: center;
    background: rgba(5,2,3,.72); backdrop-filter: blur(3px);
    padding: calc(var(--safe-t) + 14px) calc(var(--safe-r) + 14px)
             calc(var(--safe-b) + 14px) calc(var(--safe-l) + 14px);
  }
  .sheet[hidden] { display: none; }
  .sheet .card {
    width: 100%; max-width: 460px; max-height: 100%; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: var(--s-1); border: 1px solid var(--line-2); border-radius: var(--radius);
    box-shadow: 0 0 0 1px rgba(0,0,0,.6), var(--lit-within);
    padding: 15px 15px 13px;
  }
  .sheet h2 {
    font: 400 17px/1 var(--font-display); letter-spacing: .04em;
    margin: 0 0 3px; color: var(--t-0);
  }
  .sheet .hint { color: var(--t-3); font-size: 11px; margin: 0 0 11px; }
  .sect {
    font: 500 9px/1 var(--font-ui); letter-spacing: .2em; text-transform: uppercase;
    color: var(--t-2); margin: 13px 0 5px; display: flex; align-items: center; gap: 8px;
  }
  .sect::after { content: ""; flex: 1; height: 1px; background: var(--line-1); }
  .mrow {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 3.5px 0; border-bottom: 1px solid var(--line-0);
    font-size: 11.5px; color: var(--t-1);
  }
  .mrow b {
    font: 500 11.5px/1.35 var(--font-mono); font-variant-numeric: tabular-nums;
    color: var(--t-0); text-align: right; white-space: nowrap;
  }
  .mrow b.warn { color: var(--warning); }
  .mrow b.bad  { color: var(--error); }
  .mrow b.ok   { color: var(--success); }
  .verdict {
    margin-top: 12px; padding: 9px 10px; font-size: 11.5px; line-height: 1.5;
    border: 1px solid var(--line-2); border-left: 2px solid var(--accent-2);
    background: var(--s-2); color: var(--t-1);
  }
  .sheet .acts { display: flex; gap: 8px; margin-top: 13px; }
  .sheet .acts button {
    flex: 1; appearance: none; padding: 10px 8px; border-radius: var(--radius);
    border: 1px solid var(--line-2); background: var(--s-2); color: var(--t-1);
    font: 500 10px/1 var(--font-ui); letter-spacing: .16em; text-transform: uppercase;
  }
  .sheet .acts button.key { background: var(--accent); color: var(--t-inv); border-color: var(--accent); }
  .sheet .acts button:active { background: var(--ov-active); }

  /* ---------- player ---------- */
  .player {
    /* Width/height are set from measurement in JS — `inset: 0` sizes to the
       layout viewport, which is not the visible area while Safari is
       overlaying a toolbar. */
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: var(--s-0); z-index: 50;
    display: flex; flex-direction: column;
    transform: translateY(100%); visibility: hidden;
    transition: transform 200ms var(--ease), visibility 200ms var(--ease);
  }
  .player.open { transform: translateY(0); visibility: visible; }
  .player .bar {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: calc(var(--safe-t) + 9px) calc(var(--safe-r) + 12px) 9px calc(var(--safe-l) + 6px);
    background: var(--s-1); border-bottom: 1px solid var(--line-2);
  }
  .back {
    appearance: none; border: 0; background: transparent; color: var(--accent);
    display: flex; align-items: center; gap: 5px; padding: 7px 9px;
    border-radius: var(--radius); font: 500 10px/1 var(--font-ui);
    letter-spacing: .16em; text-transform: uppercase;
  }
  .back:active { background: var(--ov-active); }
  .back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .player .title {
    font: 400 15px/1 var(--font-display); letter-spacing: .03em;
    /* offsets the wider Back control so the name still reads as centred */
    flex: 1; text-align: center; margin-right: 36px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pspec {
    appearance: none; flex: none; width: 32px; height: 32px;
    border: 1px solid var(--line-2); border-radius: var(--radius);
    background: var(--s-2); color: var(--t-2); display: grid; place-items: center;
  }
  .pspec:active { background: var(--ov-active); color: var(--accent); }
  .player iframe { flex: 1; width: 100%; border: 0; background: var(--s-0); display: block; }

  /* Fullscreen: a game can ask for the bar to go. Something has to stay
     reachable or the only way out is killing the app, so a floating chevron
     replaces it. */
  .player.fs .bar { display: none; }
  /* Fullscreen still needs a way out, but it should not camp on top of the
     game's own HUD. It fades back after a few seconds; while faded a tap
     only brings it back, so the corner cannot be exited by accident. */
  .fsback {
    position: fixed; z-index: 55; display: none;
    top: calc(var(--safe-t) + 4px); left: calc(var(--safe-l) + 4px);
    width: 44px; height: 44px; appearance: none;
    border: 1px solid var(--line-2); border-radius: var(--radius);
    background: rgba(11,6,9,.55); color: var(--accent);
    place-items: center; backdrop-filter: blur(8px);
    transition: opacity 240ms var(--ease);
  }
  .player.fs ~ .fsback { display: grid; }
  .fsback.dim { opacity: .10; border-color: transparent; background: transparent;
                backdrop-filter: none; }
  .fsback:active { background: var(--ov-active); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: 1ms !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <svg class="mark" viewBox="0 0 34 34" fill="none" aria-hidden="true">
      <g class="rotor" stroke="currentColor" stroke-width="1.1">
        <circle cx="17" cy="17" r="12.4"/>
        <path d="M17 1.6v3.2M17 29.2v3.2M1.6 17h3.2M29.2 17h3.2" stroke-linecap="butt"/>
      </g>
      <path d="M17 9.4c1.5 2.5 4 4.9 4 6.6a4 4 0 0 1-8 0c0-1.7 2.5-4.1 4-6.6z" fill="#b81d3a"/>
    </svg>

    <div>
      <h1>Arcade</h1>
      <div class="status">
        <span class="dot" id="dot"></span>
        <span class="micro" id="sub">Loading</span>
      </div>
    </div>

    <div class="spacer"></div>

    <div class="instrs">
    <button class="instr" id="specs" aria-label="Display metrics">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="square" aria-hidden="true">
        <path d="M3.5 7.5v-4h4M20.5 7.5v-4h-4M3.5 16.5v4h4M20.5 16.5v4h-4"/>
        <path d="M7.5 12h9M7.5 9.8v4.4M16.5 9.8v4.4"/>
      </svg>
    </button>

afe-area-inset-bottom, 0px), 34px);\n    --safe-l: env(safe-area-inset-left, 0px);\n  }\n  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent;\n      user-select: none; -webkit-user-select: none; }\n  html, body {\n    margin: 0; height: 100%; overflow: hidden; touch-action: none;\n    background: var(--s-0); color: var(--t-0);\n    font: 400 16px/1.45 var(--font-ui); -webkit-font-smoothing: antialiased;\n    overscroll-behavior: none;\n  }\n  /* Sized in JS from visualViewport — iOS reports 100vh, 100dvh and the\n     fixed-position viewport inconsistently. Everything else lives inside. */\n  #stage { position: fixed; top: 0; left: 0; width: 100%; height: 100%;\n           overflow: hidden; }\n  canvas { display: block; width: 100%; height: 100%; touch-action: none; }\n\n  .hud {\n    position: absolute; left: calc(var(--safe-l) + 12px);\n    right: calc(var(--safe-r) + 12px);\n    top: calc(var(--safe-t) + 12px);\n    display: flex; gap: 8px; pointer-events: none;\n  }\n  .panel { border: 1px solid var(--line-1); border-radius: var(--radius);\n           background: rgba(11,6,9,.72); backdrop-filter: blur(8px); }\n  .rail { flex: none; display: flex; }\n  .stat { padding: 7px 13px 6px; text-align: center; border-right: 1px solid var(--line-0); }\n  .stat:last-child { border-right: 0; }\n  .k { font: 500 8.5px/1 var(--font-ui); letter-spacing: .16em; text-transform: uppercase; color: var(--t-2); }\n  .v { margin-top: 5px; font: 500 17px/1 var(--font-mono); font-variant-numeric: tabular-nums; }\n  .v.brandish { color: var(--brand); }\n\n  /* the diagnostics readout — what this hardware is actually doing */\n  .diag { margin-left: auto; padding: 7px 10px 6px; min-width: 118px; }\n  .row { display: flex; justify-content: space-between; gap: 10px; line-height: 1.55; }\n  .row span:first-child { font: 500 8.5px/1.7 var(--font-ui); letter-spacing: .14em;\n                          text-transform: uppercase; color: var(--t-3); }\n  .row span:last-child { font: 500 10px/1.5 var(--font-mono); font-variant-numeric: tabular-nums; color: var(--t-2); }\n  #fps.good { color: var(--success); } #fps.fair { color: var(--warning); } #fps.poor { color: var(--error); }\n\n  .gauge { position: absolute; left: calc(var(--safe-l) + 12px);\n           right: calc(var(--safe-r) + 12px);\n           bottom: calc(var(--safe-b) + 30px);\n           display: flex; gap: 2px; pointer-events: none; }\n  .seg { flex: 1; height: 3px; background: var(--line-1); transition: background 120ms var(--ease); }\n  .seg.on { background: var(--accent-2); }\n\n  .hint { position: absolute; left: 0; right: 0; bottom: calc(var(--safe-b) + 11px);\n          text-align: center; font: 500 8.5px/1 var(--font-ui); letter-spacing: .16em;\n          text-transform: uppercase; color: var(--t-3); pointer-events: none; }\n\n  .overlay { position: absolute; inset: 0; z-index: 5; display: flex;\n             align-items: center; justify-content: center; text-align: center;\n             padding: calc(var(--safe-t) + 16px) calc(var(--safe-r) + 16px)\n                      calc(var(--safe-b) + 16px) calc(var(--safe-l) + 16px);\n             background: rgba(5,2,3,.9);\n             overflow-y: auto; -webkit-overflow-scrolling: touch; }\n  .overlay.hide { display: none; }\n  .overlay h2 { font: 400 30px/1.1 var(--font-display); letter-spacing: .04em; margin: 0 0 10px; }\n  .overlay p { color: var(--t-2); font-size: 13.5px; margin: 0 0 24px; max-width: 300px;\n               line-height: 1.65; margin-inline: auto; }\n  .big { font: 500 54px/1 var(--font-mono); font-variant-numeric: tabular-nums;\n         color: var(--accent); letter-spacing: -.02em; }\n  .big small { font: 500 11px/1 var(--font-ui); letter-spacing: .16em; text-transform: uppercase;\n               color: var(--t-2); display: block; margin-top: 10px; }\n  .ornament { color: var(--accent-2); font-size: 15px; margin-bottom: 14px; }\n  button.go {\n    appearance: none; border: 1px solid var(--accent); border-radius: var(--radius);\n    padding: 13px 34px; background: var(--accent); color: var(--s-0);\n    font: 500 11px/1 var(--font-ui); letter-spacing: .18em; text-transform: uppercase;\n    transition: box-shadow var(--dur) var(--ease), transform 90ms var(--ease);\n  }\n  button.go:active { transform: scale(.97); box-shadow: var(--bloom); }\n  button.go:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }\n\n  .spec { margin-top: 22px; font: 500 8.5px/1.9 var(--font-ui); letter-spacing: .14em;\n          text-transform: uppercase; color: var(--t-3); }\n\n  .summary { margin: 18px auto 0; max-width: 260px; }\n  .summary .row { border-top: 1px solid var(--line-0); padding: 6px 0; }\n  .summary .row span:first-child { color: var(--t-3); }\n  .summary .row span:last-child { color: var(--t-1); font-size: 11px; }\n\n  /* ---------- settings ---------- */\n  .gear {\n    position: absolute; z-index: 4;\n    right: calc(var(--safe-r) + 12px); bottom: calc(var(--safe-b) + 48px);\n    width: 38px; height: 38px; appearance: none;\n    border: 1px solid var(--line-2); border-radius: var(--radius);\n    background: rgba(11,6,9,.72); color: var(--accent);\n    display: grid; place-items: center;\n    transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);\n  }\n  .gear:active { background: rgba(233,216,197,.12); border-color: var(--accent-2); }\n  .gear:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }\n\n  .sheet { z-index: 8; align-items: center; }\n  /* Landscape leaves ~390px of height, so the sheet caps and scrolls. */\n  .sheet .card {\n    width: 100%; max-width: 340px; max-height: 100%; overflow-y: auto;\n    -webkit-overflow-scrolling: touch; padding: 16px;\n    background: var(--s-1); text-align: left;\n  }\n  .cardhead { display: flex; align-items: baseline; gap: 9px; padding-bottom: 12px;\n              border-bottom: 1px solid var(--line-2); margin-bottom: 4px; }\n  .cardhead h3 { font: 400 20px/1 var(--font-display); letter-spacing: .04em; margin: 0; }\n  .ornament.sm { font-size: 12px; margin: 0; }\n\n  .opt { display: flex; align-items: center; justify-content: space-between; gap: 14px;\n         padding: 13px 0; border-bottom: 1px solid var(--line-0); }\n  .opt.off { display: none; }\n  .optk { font: 500 10px/1 var(--font-ui); letter-spacing: .16em;\n          text-transform: uppercase; color: var(--t-1); }\n  .optd { font-size: 11.5px; line-height: 1.45; color: var(--t-3); margin-top: 5px; max-width: 190px; }\n  .optd.warn { color: var(--warning); }\n\n  /* A segmented throw, not a pill — two cells and a bone slug that slides. */\n  .sw {\n    appearance: none; flex: none; width: 52px; height: 26px; padding: 2px;\n    border: 1px solid var(--line-2); border-radius: var(--radius);\n    background: var(--s-0); position: relative;\n    transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease);\n  }\n  .sw span {\n    display: block; width: 23px; height: 20px; background: var(--t-3);\n    transition: transform var(--dur) var(--ease), background var(--dur) var(--ease);\n  }\n  .sw[aria-checked=\"true\"] { border-color: var(--accent-2); }\n  .sw[aria-checked=\"true\"] span { transform: translateX(23px); background: var(--accent);\n                                  box-shadow: var(--bloom); }\n  .sw:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }\n\n  .rng { flex: none; width: 108px; appearance: none; height: 22px; background: transparent; }\n  .rng::-webkit-slider-runnable-track { height: 3px; background: var(--line-2); }\n  .rng::-webkit-slider-thumb { appearance: none; width: 12px; height: 18px; margin-top: -7px;\n                               background: var(--accent); border: 0; border-radius: 1px; }\n  .rng::-moz-range-track { height: 3px; background: var(--line-2); }\n  .rng::-moz-range-thumb { width: 12px; height: 18px; background: var(--accent);\n                           border: 0; border-radius: 1px; }\n\n  .mini {\n    appearance: none; flex: none; padding: 8px 15px;\n    border: 1px solid var(--line-2); border-radius: var(--radius);\n    background: var(--s-0); color: var(--accent);\n    font: 500 9.5px/1 var(--font-ui); letter-spacing: .16em; text-transform: uppercase;\n  }\n  .mini:active { background: rgba(233,216,197,.12); }\n  .mini.done { color: var(--success); border-color: var(--success); }\n  .mini.spaced { margin-top: 14px; }\n\n  button.go.wide { display: block; width: 100%; margin-top: 18px; }\n  .diag.off, .gear.off { display: none; }\n\n  @media (prefers-reduced-motion: reduce) {\n    *, *::before, *::after { transition-duration: 1ms !important; }\n  }\n</style>\n</head>\n<body>\n<div id=\"stage\"><canvas id=\"cv\"></canvas>\n\n<div class=\"hud\">\n  <div class=\"panel rail\">\n    <div class=\"stat\"><div class=\"k\">Depth</div><div class=\"v\" id=\"score\">0</div></div>\n    <div class=\"stat\"><div class=\"k\">Best</div><div class=\"v brandish\" id=\"best\">0</div></div>\n    <div class=\"stat\"><div class=\"k\">Chain</div><div class=\"v\" id=\"combo\">—</div></div>\n  </div>\n  <div class=\"panel diag\">\n    <div class=\"row\"><span>Fps</span><span id=\"fps\">—</span></div>\n    <div class=\"row\"><span>Scale</span><span id=\"scale\">—</span></div>\n    <div class=\"row\"><span>Draws</span><span id=\"draws\">—</span></div>\n    <div class=\"row\"><span>Tris</span><span id=\"tris\">—</span></div>\n  </div>\n</div>\n\n<button class=\"gear\" id=\"gear\" aria-label=\"Settings\">\n  <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"\n       stroke-width=\"1.6\" stroke-linecap=\"square\" aria-hidden=\"true\">\n    <circle cx=\"12\" cy=\"12\" r=\"3.1\"/>\n    <path d=\"M12 2.6v3M12 18.4v3M2.6 12h3M18.4 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1\"/>\n  </svg>\n</button>\n\n<div class=\"gauge\" id=\"gauge\"></div>\n<div class=\"hint\" id=\"hint\">Drag to steer</div>\n\n<div class=\"overlay\" id=\"overlay\">\n  <div>\n    <div id=\"head\">\n      <div class=\"ornament\">❦</div>\n      <h2>Ossuary</h2>\n      <p>Descend the bone corridor. Steer, take the drops, and do not touch the pillars.</p>\n    </div>\n    <button class=\"go\" id=\"go\">Descend</button>\n    <div><button class=\"mini spaced\" id=\"openSettings\">Settings</button></div>\n    <div class=\"spec\" id=\"spec\"></div>\n  </div>\n</div>\n\n<div class=\"overlay sheet hide\" id=\"settings\">\n  <div class=\"panel card\">\n    <div class=\"cardhead\">\n      <span class=\"ornament sm\">❦</span>\n      <h3>Settings</h3>\n    </div>\n\n    <div class=\"opt\" id=\"rowFs\">\n      <div>\n        <div class=\"optk\">Fullscreen</div>\n        <div class=\"optd\">Hide the Arcade bar. A floating chevron takes you back.</div>\n      </div>\n      <button class=\"sw\" id=\"swFs\" role=\"switch\" aria-checked=\"false\"><span></span></button>\n    </div>\n\n    <div class=\"opt\">\n      <div>\n        <div class=\"optk\">Motion steering</div>\n        <div class=\"optd\" id=\"motionNote\">Tilt the phone to steer instead of dragging.</div>\n      </div>\n      <button class=\"sw\" id=\"swMotion\" role=\"switch\" aria-checked=\"false\"><span></span></button>\n    </div>\n\n    <div class=\"opt\" id=\"rowSens\">\n      <div>\n        <div class=\"optk\">Tilt sensitivity</div>\n        <div class=\"optd\"><span id=\"sensVal\">1.0</span>×</div>\n      </div>\n      <input class=\"rng\" id=\"sens\" type=\"range\" min=\"4\" max=\"20\" step=\"1\" value=\"10\">\n    </div>\n\n    <div class=\"opt\" id=\"rowCal\">\n      <div>\n        <div class=\"optk\">Neutral angle</div>\n        <div class=\"optd\">Hold the phone as you like, then set.</div>\n      </div>\n      <button class=\"mini\" id=\"calibrate\">Set</button>\n    </div>\n\n    <div class=\"opt\">\n      <div>\n        <div class=\"optk\">Haptics</div>\n        <div class=\"optd\">Buzz on pickups and impacts.</div>\n      </div>\n 0; z-index: 5; display: flex;\n    align-items: center; justify-content: center; text-align: center;\n    padding: calc(var(--safe-t) + 16px) calc(var(--safe-r) + 16px)\n             calc(var(--safe-b) + 16px) calc(var(--safe-l) + 16px);\n    background: rgba(5,2,3,.9); overflow-y: auto; -webkit-overflow-scrolling: touch;\n  }\n  .overlay.hide { display: none; }\n  .overlay h2 { font: 400 28px/1.1 var(--font-display); letter-spacing: .04em; margin: 0 0 10px; }\n  .overlay p { color: var(--t-2); font-size: 13.5px; margin: 0 0 22px; max-width: 300px;\n               line-height: 1.6; margin-inline: auto; }\n  .big { font: 500 46px/1 var(--font-mono); font-variant-numeric: tabular-nums;\n         color: var(--accent); letter-spacing: -.02em; }\n  .big small { font: 500 11px/1 var(--font-ui); letter-spacing: .16em; text-transform: uppercase;\n               color: var(--t-2); display: block; margin-top: 10px; }\n  .ornament { color: var(--accent-2); font-size: 15px; margin-bottom: 12px; }\n  .ornament.sm { font-size: 12px; margin: 0; }\n  button.go {\n    appearance: none; border: 1px solid var(--accent); border-radius: var(--radius);\n    padding: 13px 34px; background: var(--accent); color: var(--s-0);\n    font: 500 11px/1 var(--font-ui); letter-spacing: .18em; text-transform: uppercase;\n  }\n  button.go:active { transform: scale(.97); box-shadow: var(--bloom); }\n  button.go.wide { display: block; width: 100%; margin-top: 16px; }\n  button.go.ghost { background: transparent; color: var(--accent); border-color: var(--line-2); }\n  .spec { margin-top: 18px; font: 500 8.5px/1.9 var(--font-ui); letter-spacing: .14em;\n          text-transform: uppercase; color: var(--t-3); }\n  .summary { margin: 16px auto 0; max-width: 260px; }\n  .summary .row { border-top: 1px solid var(--line-0); padding: 6px 0; }\n  .summary .row span:first-child { color: var(--t-3); }\n  .summary .row span:last-child { color: var(--t-1); font-size: 11px; }\n\n  /* The sheet has to survive landscape, so it caps its height and scrolls. */\n  .sheet { z-index: 8; }\n  .sheet .card {\n    width: 100%; max-width: 340px; max-height: 100%; overflow-y: auto;\n    -webkit-overflow-scrolling: touch;\n    padding: 16px; background: var(--s-1); text-align: left;\n  }\n  .cardhead { display: flex; align-items: baseline; gap: 9px; padding: 2px 0 11px;\n              border-bottom: 1px solid var(--line-2); margin-bottom: 2px;\n              position: sticky; top: -16px; background: var(--s-1); }\n  .cardhead h3 { font: 400 20px/1 var(--font-display); letter-spacing: .04em; margin: 0; }\n  .opt { display: flex; align-items: center; justify-content: space-between; gap: 14px;\n         padding: 12px 0; border-bottom: 1px solid var(--line-0); }\n  .opt.off { display: none; }\n  .optk { font: 500 10px/1 var(--font-ui); letter-spacing: .16em;\n          text-transform: uppercase; color: var(--t-1); }\n  .optd { font-size: 11.5px; line-height: 1.4; color: var(--t-3); margin-top: 5px; max-width: 195px; }\n  .sw { appearance: none; flex: none; width: 52px; height: 26px; padding: 2px;\n        border: 1px solid var(--line-2); border-radius: var(--radius); background: var(--s-0); }\n  .sw span { display: block; width: 23px; height: 20px; background: var(--t-3);\n             transition: transform var(--dur) var(--ease), background var(--dur) var(--ease); }\n  .sw[aria-checked=\"true\"] { border-color: var(--accent-2); }\n  .sw[aria-checked=\"true\"] span { transform: translateX(23px); background: var(--accent);\n                                  box-shadow: var(--bloom); }\n  .rng { flex: none; width: 104px; appearance: none; height: 22px; background: transparent; }\n  .rng::-webkit-slider-runnable-track { height: 3px; background: var(--line-2); }\n  .rng::-webkit-slider-thumb { appearance: none; width: 12px; height: 18px; margin-top: -7px;\n                               background: var(--accent); border: 0; border-radius: 1px; }\n  .rng::-moz-range-track { height: 3px; background: var(--line-2); }\n  .rng::-moz-range-thumb { width: 12px; height: 18px; background: var(--accent); border: 0; }\n\n  @media (prefers-reduced-motion: reduce) {\n    *, *::before, *::after { transition-duration: 1ms !important; }\n  }\n</style>\n</head>\n<body>\n<div id=\"stage\"><canvas id=\"cv\"></canvas>\n\n<div class=\"hud\">\n  <div class=\"panel rail\">\n    <div class=\"bearing\">\n      <svg id=\"arrow\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"\n           stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"square\" aria-hidden=\"true\">\n        <path d=\"M12 3.2 18.4 20 12 15.8 5.6 20z\"/>\n      </svg>\n    </div>\n    <div class=\"stat\"><div class=\"k\">Relics</div><div class=\"v\" id=\"relics\">0/6</div></div>\n    <div class=\"stat\"><div class=\"k\">Time</div><div class=\"v\" id=\"time\">0.0</div></div>\n    <div class=\"stat\" id=\"cellSky\"><div class=\"k\">Sky</div><div class=\"v sm\" id=\"sky\">Night</div></div>\n    <div class=\"stat\" id=\"cellBest\"><div class=\"k\">Best</div><div class=\"v brandish\" id=\"best\">—</div></div>\n  </div>\n  <div class=\"rightcol\">\n  <div class=\"panel diag\">\n    <div class=\"row\"><span>Fps</span><span id=\"fps\">—</span></div>\n    <div class=\"row\"><span>Scale</span><span id=\"scale\">—</span></div>\n    <div class=\"row\"><span>Draws</span><span id=\"draws\">—</span></div>\n    <div class=\"row\"><span>Tris</span><span id=\"tris\">—</span></div>\n    <div class=\"row\"><span>View</span><span id=\"view\">—</span></div>\n    <div class=\"row\"><span>Unused</span><span id=\"gap\">—</span></div>\n    <div class=\"row\"><span>Doc/In/VV</span><span id=\"hts\">—</span></div>\n  </div>\n  <button class=\"fight on\" id=\"fight\" aria-pressed=\"true\">\n    <i></i><span id=\"fightLbl\">Fights on</span>\n  </button>\n  <button class=\"fight\" id=\"view3\" aria-pressed=\"false\">\n    <i></i><span id=\"viewLbl\">First person</span>\n  </button>\n  </div>\n</div>\n\n<div class=\"pad left\" id=\"padMove\">\n  <div class=\"tick h\"></div><div class=\"tick v\"></div>\n  <div class=\"knob\"></div><div class=\"lbl\">Move</div>\n</div>\n<div class=\"pad right\" id=\"padLook\">\n  <div class=\"tick h\"></div><div class=\"tick v\"></div>\n  <div class=\"knob\"></div><div class=\"lbl\">Look</div>\n</div>\n\n<button class=\"flare\" id=\"flare\"><div class=\"fill\" id=\"flareFill\"></div><span>Flare</span></button>\n<button class=\"gear\" id=\"gear\" aria-label=\"Settings\">\n  <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"\n       stroke-width=\"1.6\" stroke-linecap=\"square\" aria-hidden=\"true\">\n    <circle cx=\"12\" cy=\"12\" r=\"3.1\"/>\n    <path d=\"M12 2.6v3M12 18.4v3M2.6 12h3M18.4 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1\"/>\n  </svg>\n</button>\n\n<div class=\"panel battle\" id=\"battle\">\n  <div class=\"bars\">\n    <div class=\"bar\">\n      <div class=\"barhead\"><span class=\"who\">You</span><span class=\"hp\" id=\"hpYou\">100</span></div>\n      <div class=\"meter\" id=\"mYou\"><i style=\"width:100%\"></i></div>\n    </div>\n    <div class=\"bar\">\n      <div class=\"barhead\"><span class=\"who\" id=\"foeName\">Mire</span><span class=\"hp\" id=\"hpFoe\">60</span></div>\n      <div class=\"meter foe\" id=\"mFoe\"><i style=\"width:100%\"></i></div>\n    </div>\n  </div>\n  <div class=\"log\" id=\"log\">Something wet unfolds itself from the dark.</div>\n  <div class=\"acts\">\n    <button class=\"act\" data-a=\"lance\">Lance<small>18–26</small></button>\n    <button class=\"act\" data-a=\"ember\">Ember<small>10–34</small></button>\n    <button class=\"act\" data-a=\"ward\">Ward<small>mend 18</small></button>\n  </div>\n</div>\n\n<div class=\"overlay\" id=\"overlay\">\n  <div>\n    <div id=\"head\">\n      <div class=\"ornament\">❦</div>\n      <h2>Reliquary</h2>\n      <p>Six relics wait in the hall. Left pad walks, right pad looks. Something else is down here with you.</p>\n    </div>\n    <button class=\"go\" id=\"go\">Enter</button>\n    <div><button class=\"go ghost\" id=\"openSettings\" style=\"margin-top:14px\">Settings</button></div>\n    <div class=\"spec\" id=\"spec\"></div>\n  </div>\n</div>\n\n<div class=\"overlay sheet hide\" id=\"settings\">\n  <div class=\"panel card\">\n    <div class=\"cardhead\"><span class=\"ornament sm\">❦</span><h3>Settings</h3></div>\n\n    <div class=\"opt\" id=\"rowFs\">\n      <div><div class=\"optk\">Fullscreen</div>\n      <div class=\"optd\">Hide the Arcade bar. A floating chevron takes you back.</div></div>\n      <button class=\"sw\" id=\"swFs\" role=\"switch\" aria-checked=\"false\"><span></span></button>\n    </div>\n\n    <div class=\"opt\">\n      <div><div class=\"optk\">Floor reflections</div>\n      <div class=\"optd\">Renders the hall a second time, mirrored. The most expensive thing here.</div></div>\n      <button class=\"sw\" id=\"swReflect\" role=\"switch\" aria-checked=\"true\"><span></span></button>\n    </div>\n\n    <div class=\"opt\">\n      <div><div class=\"optk\">Light shafts</div>\n      <div class=\"optd\">Moonlight through the breaks in the vault. Thickens in rain.</div></div>\n      <button class=\"sw\" id=\"swShafts\" role=\"switch\" aria-checked=\"true\"><span></span></button>\n    </div>\n\n    <div class=\"opt\">\n      <div><div class=\"optk\">Rain</div>\n      <div class=\"optd\">Falls through the broken vault, and wets the floor.</div></div>\n      <button class=\"sw\" id=\"swRain\" role=\"switch\" aria-checked=\"true\"><span></span></button>\n    </div>\n\n    <div class=\"opt\">\n      <div><div class=\"optk\">Look speed</div><div class=\"optd\"><span id=\"lookVal\">1.0</span>×</div></div>\n      <input class=\"rng\" id=\"look\" type=\"range\" min=\"4\" max=\"22\" step=\"1\" value=\"10\">\n    </div>\n\n    <div class=\"opt\">\n      <div><div class=\"optk\">Haptics</div><div class=\"optd\">Buzz on pickups and hits.</div></div>\n      <button class=\"sw\" id=\"swHaptic\" role=\"switch\" aria-checked=\"true\"><span></span></button>\n    </div>\n\n    <div class=\"opt\">\n      <div><div class=\"optk\">Film grain</div><div class=\"optd\">Sensor noise over the image.</div></div>\n      <button class=\"sw\" id=\"swGrain\" role=\"switch\" aria-checked=\"true\"><span></span></button>\n    </div>\n\n    <div class=\"opt\">\n      <div><div class=\"optk\">Diagnostics</div><div class=\"optd\">Frame rate and render cost.</div></div>\n      <button class=\"sw\" id=\"swDiag\" role=\"switch\" aria-checked=\"true\"><span></span></button>\n    </div>\n\n    <button class=\"go wide\" id=\"closeSettings\">Resume</button>\n  </div>\n</div>\n\n</div>\n\n<script>\n(function () {\n  'use strict';\n\n  /* ============================================================\n     Reliquary — free movement through a pillared hall under a\n     broken vault, with weather, a day/night cycle, wandering\n     blobs and turn-based fights. Built to push the renderer and\n     to keep the cost of each piece visible while it does.\n     ============================================================ */\n\n  var BKEY = 'reliquary.best';\n  var SKEY = 'reliquary.settings';\n\n  var cv = document.getElementById('cv');\n  var overlay = document.getElementById('overlay');\n  var head = document.getElementById('head');\n  var elRelics = document.getElementById('relics');\n  var elTime = document.getElementById('time');\n  var elBest = document.getElementById('best');\n  var elSky = document.getElementById('sky');\n  var elFps = document.getElementById('fps');\n  var elScale = document.getElementById('scale');\n  var elDraws = document.getElementById('draws');\n  var elTris = document.getElementById('tris');\n  var elView = document.getElementById('view');\n  var elGap = document.getElementById('gap');\n  var elHts = document.getElementById('hts');\n  var elSpec = document.getElementById('spec');\n  var arrow = document.getElementById('arrow');\n\n  var framed = window.self !== window.top;\n\n  var gl = cv.getContext('webgl2', {\n    antialias: false, alpha: false, depth: true,\n    powerPreference: 'high-performance', preserveDrawingBuffer: false\n  });\n  if (!gl) {\n    head.innerHTML = '<div class=\"ornament\">❦</div><h2>Reliquary</h2>' +\n      '<p>This browser has no WebGL2. On iPhone that means Safari 15 or newer.</p>';\n    document.getElementById('go').style.display = 'none';\n    throw new Error('no webgl2');\n  }\n\n  /* ---------------- matrices ---------------- */\n\n  function m4mul(a, b, out) {\n    out = out || new Float32Array(16);\n    for (var c = 0; c < 4; c++) {\n      var b0=b[c*4], b1=b[c*4+1], b2=b[c*4+2], b3=b[c*4+3];\n      out[c*4]   = a[0]*b0 + a[4]*b1 + a[8]*b2  + a[12]*b3;\n      out[c*4+1] = a[1]*b0 + a[5]*b1 + a[9]*b2  + a[13]*b3;\n      out[c*4+2] = a[2]*b0 + a[6]*b1 + a[10]*b2 + a[14]*b3;\n      out[c*4+3] = a[3]*b0 + a[7]*b1 + a[11]*b2 + a[15]*b3;\n    }\n    return out;\n  }\n  function m4perspective(fovy, aspect, near, far) {\n    var f = 1/Math.tan(fovy/2), nf = 1/(near-far);\n    return new Float32Array([f/aspect,0,0,0, 0,f,0,0, 0,0,(far+near)*nf,-1, 0,0,2*far*near*nf,0]);\n  }\n  function m4ortho(l, r, b, t, n, f) {\n    return new Float32Array([2/(r-l),0,0,0, 0,2/(t-b),0,0, 0,0,-2/(f-n),0,\n      -(r+l)/(r-l), -(t+b)/(t-b), -(f+n)/(f-n), 1]);\n  }\n  function m4lookAt(ex, ey, ez, cx, cy, cz, ux, uy, uz) {\n    var zx=ex-cx, zy=ey-cy, zz=ez-cz;\n    var zl=Math.hypot(zx,zy,zz)||1; zx/=zl; zy/=zl; zz/=zl;\n    var xx=uy*zz-uz*zy, xy=uz*zx-ux*zz, xz=ux*zy-uy*zx;\n    var xl=Math.hypot(xx,xy,xz)||1; xx/=xl; xy/=xl; xz/=xl;\n    var yx=zy*xz-zz*xy, yy=zz*xx-zx*xz, yz=zx*xy-zy*xx;\n    return new Float32Array([xx,yx,zx,0, xy,yy,zy,0, xz,yz,zz,0,\n      -(xx*ex+xy*ey+xz*ez), -(yx*ex+yy*ey+yz*ez), -(zx*ex+zy*ey+zz*ez), 1]);\n  }\n  function writeTRS(buf, o, px, py, pz, sx, sy, sz, ry) {\n    var c=Math.cos(ry), s=Math.sin(ry);\n    buf[o]=c*sx; buf[o+1]=0; buf[o+2]=-s*sx; buf[o+3]=0;\n    buf[o+4]=0; buf[o+5]=sy; buf[o+6]=0; buf[o+7]=0;\n    buf[o+8]=s*sz; buf[o+9]=0; buf[o+10]=c*sz; buf[o+11]=0;\n    buf[o+12]=px; buf[o+13]=py; buf[o+14]=pz; buf[o+15]=1;\n  }\n  // writeTRS only carries a yaw, which is enough for architecture and useless\n  // for a limb. This aims the mesh's local +Y down an arbitrary vector, so a\n  // unit mesh centred on the origin becomes a bone between two points.\n  function writeAim(buf, o, px, py, pz, dx, dy, dz, len, rx, rz) {\n    var l = Math.hypot(dx, dy, dz) || 1;\n    var yx = dx/l, yy = dy/l, yz = dz/l;\n    // Any axis not parallel to the bone works as the seed for the basis.\n    var ax = Math.abs(yy) > 0.985 ? 1 : 0, ay = Math.abs(yy) > 0.985 ? 0 : 1;\n    var xx = ay*yz - 0*yy, xy = 0*yx - ax*yz, xz = ax*yy - ay*yx;\n    var xl = Math.hypot(xx, xy, xz) || 1; xx/=xl; xy/=xl; xz/=xl;\n    var zx = xy*yz - xz*yy, zy = xz*yx - xx*yz, zz = xx*yy - xy*yx;\n    buf[o]=xx*rx;    buf[o+1]=xy*rx;   buf[o+2]=xz*rx;   buf[o+3]=0;\n    buf[o+4]=yx*len; buf[o+5]=yy*len;  buf[o+6]=yz*len;  buf[o+7]=0;\n    buf[o+8]=zx*rz;  buf[o+9]=zy*rz;   buf[o+10]=zz*rz;  buf[o+11]=0;\n    buf[o+12]=px; buf[o+13]=py; buf[o+14]=pz; buf[o+15]=1;\n  }\n\n  /* ---------------- gl helpers ---------------- */\n\n  function compile(type, src, label) {\n    var sh = gl.createShader(type);\n    gl.shaderSource(sh, src); gl.compileShader(sh);\n    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(label + ': ' + gl.getShaderInfoLog(sh));\n    return sh;\n  }\n  function program(vs, fs, label) {\n    var p = gl.createProgram();\n    gl.attachShader(p, compile(gl.VERTEX_SHADER, vs, label + '.vert'));\n    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs, label + '.frag'));\n    gl.linkProgram(p);\n    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(label + ' link: ' + gl.getProgramInfoLog(p));\n    p.u = {};\n    var n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);\n    for (var i = 0; i < n; i++) {\n      var nm = <script>

  var GLYPHS = {
    bolt:    '<path d="M13.5 2.5 5 13h5.2l-.7 8.5L19 11h-5.2l.7-8.5Z"/>',
    serpent: '<path d="M6 20.5c0-4 12-4 12-8s-12-4-12-8h4"/>'

  var grid   = document.getElementById('grid');
  var sub    = document.getElementById('sub');
  var dot    = document.getElementById('dot');

  var frame  = document.getElementById('frame');

  // file so the launcher works with no server and no network at all.
  var BUNDLE = window.__ARCADE_BUNDLE__ || null;

  function discover() {

      .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)); })
      .then(function (data) {

  // Must be idempotent: the cache stores already-normalized records, so this
  // runs a second time over its own output and has to accept either key.
  function normalize(g) {

      slug:  slug,
      name:  g.name || titleize(slug),
      desc:  g.description || g.desc || '',

      ink:   g.ink || INKS[hash(slug) % INKS.length],

  function listFolders() {

        .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)); })

  // is optional — without one we derive a decent title from the folder name.
  function describe(slug) {

      .then(function (r) { return r.ok ? r.json() : {}; })

  // launcher can show it as a readout without knowing anything else about it.

  /* ---------------- render ---------------- */

  function setStatus(cls, text) {

  }

  function render(games) {

      setStatus('fail', 'Empty');
      var s = document.createElement('div');
      s.className = 'state';
      s.innerHTML = 'No titles installed.<br>Drop a folder with an <code>index.html</code> into <code>arcade/games/</code>.';

      b.className = 'card';
      b.style.setProperty('--ink', g.ink);

      var gl = document.createElement('div');
      gl.className = 'glyph';
      gl.innerHTML = glyphSvg(g.glyph, 26);

      var nm = document.createElement('div');
      nm.className = 'name';
      nm.textContent = g.name;

      b.appendChild(nm);

        d.className = 'desc';
        d.textContent = g.desc;
        b.appendChild(d);

      ro.appendChild(val);
      b.appendChild(ro);

      br.className = 'bracket';
      b.appendChild(br);

  function showError(msg) {
    setStatus('fail', 'Offline');

    var v;
    if (m.lost <= 1) {
      v = 'Covered. The frame matches the physical screen exactly.';
    } else {
      var bits = [];
      if (m.above)   bits.push(m.above + 'px above the frame');
      if (m.below)   bits.push(m.below + 'px below it');
      if (m.outside) bits.push(m.outside + 'px outside the window');
      v = m.lost + 'px unused — ' + bits.join(', ') + '. ';
      if (m.above || m.below) {
        v += 'The band inside the window is launcher chrome; a game’s fullscreen setting takes it. ';
      }
      if (m.outside) {
        v += (m.insT + m.insB >= m.outside - 2)
          ? 'The outside band matches the safe-area insets (' + m.insT + ' top, ' + m.insB +
            ' bottom), so the system inset the web view — not this layout.'
          : 'Insets read ' + m.insT + '/' + m.insB + ', so that band is browser chrome rather ' +
            'than a safe area; installing to the home screen reclaims it.';
      }
    }
    verdictEl.textContent = v;

    lastText = 'Arcade v' + (window.__ARCADE_VERSION__ || '?') + '\n' +
               text.join('\n') + '\n\n' + v;
  }

  function openSpecs() {
    sheetEl.hidden = false;
    paintSpecs();
    clearInterval(specTimer);
    specTimer = setInterval(function () {
      if (player.classList.contains('open') && frame.contentWindow)
        frame.contentWindow.postMessage({ type: 'arcade:spec?' }, '*');
      paintSpecs();
    }, 500);
  }
  function closeSpecs() { sheetEl.hidden = true; clearInterval(specTimer); specTimer = null; }

  document.getElementById('specs').addEventListener('click', openSpecs);
  document.getElementById('pspec').addEventListener('click', openSpecs);
  document.getElementById('closeSpecs').addEventListener('click', closeSpecs);
  sheetEl.addEventListener('click', function (e) { if (e.target === sheetEl) closeSpecs(); });
  document.getElementById('copySpecs').addEventListener('click', function (e) {
    var b = e.currentTarget;
    var done = function (ok) {
      b.textContent = ok ? 'Copied' : 'No clipboard';
      setTimeout(function () { b.textContent = 'Copy'; }, 1400);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(lastText).then(function () { done(true); },
                                                   function () { done(false); });
    } else { done(false); }
  });

  /* ---------------- load ---------------- */

  var lastGames = null;

  function paint(games, cls, note) {
    lastGames = games;
    render(games);
    if (games.length) {
      setStatus(cls, games.length + (games.length === 1 ? ' title' : ' titles') + (note ? ' · ' + note : ''));
    }
  }

  function load(force) {
    var cached = null;
    try { cached = JSON.parse(localStorage.getItem(CKEY) || 'null'); } catch (e) {}

    if (cached && cached.games && !force && Date.now() - cached.at < TTL) {
      paint(cached.games.map(normalize), 'ok', null);
      return Promise.resolve();
    }
    if (cached && cached.games && cached.games.length) paint(cached.games.map(normalize), 'cached', 'cached');

    return discover()
      .then(function (games) {
        try { localStorage.setItem(CKEY, JSON.stringify({ at: Date.now(), games: games })); } catch (e) {}
        paint(games, 'ok', null);
      })
      .catch(function () {
        if (cached && cached.games && cached.games.length) {
          paint(cached.games.map(normalize), 'cached', 'cached');
        } else {
          showError('Could not load the game list. Check your connection and refresh.');
        }
      });
  }

  /* ---------------- refresh ---------------- */

  var btn = document.getElementById('refresh');

  // In a bundled build the list is baked in, so there is nothing to re-fetch —
  // the button checks for a newer service worker instead.
  function checkForUpdate() {
    if (!('serviceWorker' in navigator)) return Promise.resolve();
    return navigator.serviceWorker.getRegistration()
      .then(function (reg) {
        if (!reg) return;
        return reg.update().then(function () {
          if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
        });
      })
      .catch(function () {});
  }

  btn.addEventListener('click', function () {
    btn.classList.add('busy');
    var job = BUNDLE
      ? checkForUpdate().then(function () { location.reload(); })
      : load(true);
    job.then(function () { btn.classList.remove('busy'); });
  });

  if (!BUNDLE) {
    // Pull-to-refresh, for when the list is already at the top.
    var startY = 0, pulling = false;
    window.addEventListener('touchstart', function (e) {
      if (window.scrollY <= 0 && !player.classList.contains('open')) {
        startY = e.touches[0].clientY; pulling = true;
      }
    }, { passive: true });
    window.addEventListener('touchend', function (e) {
      if (pulling && e.changedTouches[0].clientY - startY > 90) btn.click();
      pulling = false;
    }, { passive: true });
  }

  /* ---------------- build stamp + service worker ---------------- */

  if (window.__ARCADE_VERSION__) {
    var vEl = document.getElementById('version');
    var showSize = false;
    function stamp() {
      vEl.textContent = showSize
        ? Math.round(window.innerWidth) + '×' + Math.round(window.innerHeight) +
          ' @' + (window.devicePixelRatio || 1) + '×'
        : 'v' + window.__ARCADE_VERSION__;
    }
    vEl.addEventListener('click', function () { showSize = !showSize; stamp(); });
    window.addEventListener('resize', stamp);
    stamp();
    vEl.hidden = false;
  }

  // Relative on purpose: this has to work from a GitHub Pages project subpath.
  if (window.__ARCADE_SW__ && 'serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
    var reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (reloading) return;
      reloading = true;
      location.reload();
    });
  }

  load(false);
})();
</script>
</body>
</html>
