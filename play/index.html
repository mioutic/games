%22%3E%0A%20%20%20%20%20%20%3Cpath%20d%3D%22M90%2014.6v3.8%22%20transform%3D%22rotate%2830%2090%2090%29%22%2F%3E%0A%20%20%20%20%20%20%3Cpath%20d%3D%22M90%2014.6v3.8%22%20transform%3D%22rotate%2860%2090%2090%29%22%2F%3E%0A%20%20%20%20%20%20%3Cpath%20d%3D%22M90%2014.6v3.8%22%20transform%3D%22rotate%28120%2090%2090%29%22%2F%3E%0A%20%20%20%20%20%20%3Cpath%20d%3D%22M90%2014.6v3.8%22%20transform%3D%22rotate%28150%2090%2090%29%22%2F%3E%0A%20%20%20%20%20%20%3Cpath%20d%3D%22M90%2014.6v3.8%22%20transform%3D%22rotate%28210%2090%2090%29%22%2F%3E%0A%20%20%20%20%20%20%3Cpath%20d%3D%22M90%2014.6v3.8%22%20transform%3D%22rotate%28240%2090%2090%29%22%2F%3E%0A%20%20%20%20%20%20%3Cpath%20d%3D%22M90%2014.6v3.8%22%20transform%3D%22rotate%28300%2090%2090%29%22%2F%3E%0A%20%20%20%20%20%20%3Cpath%20d%3D%22M90%2014.6v3.8%22%20transform%3D%22rotate%28330%2090%2090%29%22%2F%3E%0A%20%20%20%20%3C%2Fg%3E%0A%20%20%3C%2Fg%3E%0A%0A%20%20%3C%21--%20arterial%20drop%3A%20apex%20y58.5%2C%20bulb%20centre%20y101.7%20r20.3%20--%3E%0A%20%20%3Cpath%20d%3D%22M90%2058.5c7.6%2012.7%2020.3%2024.6%2020.3%2033.2a20.3%2020.3%200%200%201-40.6%200c0-8.6%2012.7-20.5%2020.3-33.2z%22%0A%20%20%20%20%20%20%20%20fill%3D%22%23b81d3a%22%2F%3E%0A%3C%2Fsvg%3E%0A" type="image/svg+xml">
<style>
  /* Sanguine — see DESIGN.md. Pallor and blood: bone is the accent, crimson
     is decorative, and the ground stays near-black oxblood throughout. */
  :root {
    --s-0: #0b0609;  --s-1: #12080c;  --s-2: #1a0d12;  --s-3: #241119;
    --t-0: #f2e6e6;  --t-1: #c3a9ad;  --t-2: #8f6f76;  --t-3: #5c434a;
    --accent: #e9d8c5;
    --accent-2: #b81d3a;
    --brand: #d9557a;
    --line-0: #150a0e;  --line-1: #2a141c;  --line-2: #3d1f28;
    --error: #ff5470;  --success: #5fa777;  --pending: #a884c9;
    --cat-1: #6fb3ab; --cat-2: #8a8fc9; --cat-3: #a884c9; --cat-4: #c96a8e;

    --bloom:    0 0 12px rgba(216,58,88,.45), 0 0 26px rgba(216,58,88,.16);
    --bloom-lg: 0 0 22px rgba(216,58,88,.45), 0 0 52px rgba(216,58,88,.16);
    --lit-within: inset 0 0 60px rgba(184,29,58,.05);
    --scrim: #050203;

    --ov-hover: rgba(233,216,197,.06);
    --ov-active: rgba(233,216,197,.12);

    --font-display: Georgia, "Times New Roman", serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;

    --radius: 2px;
    --dur: 160ms;
    --ease: cubic-bezier(.2,.6,.2,1);

    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: min(env(safe-area-inset-bottom, 0px), 34px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--s-0); color: var(--t-0);
    font: 400 16px/1.45 var(--font-ui);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    touch-action: manipulation;
  }
  body { overflow-x: hidden; }

  /* micro-label: the console voice — uppercase, wide, small */
  .micro {
    font: 500 10px/1 var(--font-ui);
    letter-spacing: .16em; text-transform: uppercase; color: var(--t-2);
  }

  .wrap {
    padding: calc(var(--safe-t) + 18px) calc(var(--safe-r) + 16px)
             calc(var(--safe-b) + 18px) calc(var(--safe-l) + 16px);
    max-width: 760px; margin: 0 auto;
    min-height: 100%;
    min-height: 100dvh;      /* survives Safari's collapsing toolbars */
    /* ...and this overrides it with the measured height, because dvh is itself
       short by the safe-area strip once installed to the home screen. */
    min-height: var(--vh, 100dvh);
    display: flex; flex-direction: column;
  }

  /* ---------- masthead ---------- */
  header { display: flex; align-items: flex-start; gap: 14px; }
  .mark { flex: none; width: 34px; height: 34px; margin-top: 2px; color: var(--accent); }
  .mark .rotor { transform-origin: 50% 50%; animation: rotor 60s linear infinite; }
  @keyframes rotor { to { transform: rotate(360deg); } }

  h1 {
    font: 400 30px/1 var(--font-display);
    letter-spacing: .04em; margin: 0; color: var(--t-0);
  }
  .status { display: flex; align-items: center; gap: 7px; margin-top: 9px; }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--t-3); flex: none;
    transition: background var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  }
  .dot.ok      { background: var(--success); box-shadow: 0 0 8px rgba(95,167,119,.7); }
  .dot.cached  { background: var(--pending); box-shadow: 0 0 8px rgba(168,132,201,.7); }
  .dot.fail    { background: var(--error);   box-shadow: 0 0 8px rgba(255,84,112,.7); }

  .spacer { flex: 1; }

  .instrs { flex: none; display: flex; gap: 8px; }
  button.instr {
    appearance: none; flex: none;
    width: 38px; height: 38px; border-radius: var(--radius);
    border: 1px solid var(--line-2); background: var(--s-1);
    color: var(--accent); display: grid; place-items: center;
    transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);
  }
  button.instr:active { background: var(--ov-active); border-color: var(--accent-2); }
  button.instr:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.instr.busy svg { animation: sweep 900ms linear infinite; }
  @keyframes sweep { to { transform: rotate(360deg); } }

  .rule {
    height: 1px; background: var(--line-1); margin: 16px 0 14px;
    position: relative;
  }
  .rule::after {
    content: ""; position: absolute; left: 0; top: 0; width: 46px; height: 1px;
    background: var(--accent-2);
  }

  /* ---------- grid ---------- */
  /* The grid takes the slack rather than leaving a band of nothing above the
     footer; card content centres itself so a tall card still reads as full. */
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
          flex: 1 1 auto; grid-auto-rows: minmax(152px, 1fr); }
  /* Landscape has height to spare across, not down — shorter rows so the
     library still fits without scrolling. */
  @media (max-height: 500px) {
    .grid { grid-auto-rows: minmax(124px, 1fr); }
    .card { min-height: 124px; padding: 11px 11px 9px; }
    .card .glyph { margin-bottom: 7px; }
    .card .desc { -webkit-line-clamp: 1; }
    .foot { padding-top: 14px; }
  }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(3, 1fr); } }

  .card {
    position: relative; display: flex; flex-direction: column; text-align: left;
    appearance: none; border: 1px solid var(--line-1); border-radius: var(--radius);
    background: var(--s-1); color: inherit; padding: 15px 13px 11px;
    min-height: 152px; overflow: hidden;
    transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease),
                box-shadow var(--dur) var(--ease);
  }
  .card::before {                      /* channel strip: the game's categorical ink */
    content: ""; position: absolute; inset: 0 0 auto 0; height: 2px;
    background: var(--ink, var(--cat-1)); opacity: .85;
  }
  .card .bracket {                     /* machined corner bracket */
    position: absolute; right: 9px; bottom: 9px; width: 9px; height: 9px;
    border-right: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2);
  }
  .card:active {
    background: var(--ov-hover); border-color: var(--accent-2);
    box-shadow: var(--bloom), var(--lit-within);
  }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card .glyph { color: var(--accent); margin-top: auto; margin-bottom: 12px; }
  .card .name {
    font: 400 18px/1.15 var(--font-display); letter-spacing: .02em; color: var(--t-0);
  }
  .card .desc {
    color: var(--t-2); font-size: 12px; line-height: 1.4; margin-top: 5px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card .readout {
    margin-top: auto; padding-top: 10px; display: flex; align-items: baseline;
    justify-content: space-between; gap: 8px; border-top: 1px solid var(--line-0);
  }
  .card .readout .val {
    font: 500 13px/1 var(--font-mono); font-variant-numeric: tabular-nums; color: var(--t-1);
  }
  .card .readout .val.empty { color: var(--t-3); }

  /* ---------- states ---------- */
  .state { grid-column: 1 / -1; text-align: center; color: var(--t-2);
           padding: 54px 18px; font-size: 13.5px; line-height: 1.7; }
  .state code {
    font: 400 12px/1 var(--font-mono); color: var(--t-1);
    background: var(--s-2); border: 1px solid var(--line-1); border-radius: var(--radius);
    padding: 3px 5px;
  }
  .skel {
    min-height: 152px; border: 1px solid var(--line-1); border-radius: var(--radius);
    background: var(--s-1); position: relative; overflow: hidden;
  }
  .skel::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, var(--ov-hover), transparent);
    transform: translateX(-100%); animation: scan 1.4s var(--ease) infinite;
  }
  @keyframes scan { to { transform: translateX(100%); } }

  /* The stamp rides in the flow rather than fixed to the viewport: that is
     what makes its bottom gap equal the header's top gap on any device. */
  .footbar { margin-top: auto; padding-top: 22px; display: flex;
             align-items: flex-end; gap: 10px; }
  .foot { flex: 1; min-width: 0; text-align: center;
          color: var(--t-3); font-size: 11px; line-height: 1.8; }
  .foot code { font-family: var(--font-mono); color: var(--t-2); }

  .version {
    flex: none; appearance: none; white-space: nowrap;
    font: 500 9.5px/1 var(--font-mono); letter-spacing: .1em;
    color: var(--brand); border: 1px solid var(--line-2); border-radius: var(--radius);
    /* the trailing letter-spacing eats into the right edge, so pad it back */
    padding: 5px 8px 5px 7px; background: var(--s-1);
    font-variant-numeric: tabular-nums;
  }
  .version:active { background: var(--ov-active); }
  .version[hidden] { display: none; }

  /* ---------- metrics sheet ---------- */
  /* Guessing at someone else's device is not a technique (DESIGN.md): this
     reads the real numbers off the launcher and off the running game. */
  .sheet {
    position: fixed; inset: 0; z-index: 60; display: grid; place-items: center;
    background: rgba(5,2,3,.72); backdrop-filter: blur(3px);
    padding: calc(var(--safe-t) + 14px) calc(var(--safe-r) + 14px)
             calc(var(--safe-b) + 14px) calc(var(--safe-l) + 14px);
  }
  .sheet[hidden] { display: none; }
  .sheet .card {
    width: 100%; max-width: 460px; max-height: 100%; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: var(--s-1); border: 1px solid var(--line-2); border-radius: var(--radius);
    box-shadow: 0 0 0 1px rgba(0,0,0,.6), var(--lit-within);
    padding: 15px 15px 13px;
  }
  .sheet h2 {
    font: 400 17px/1 var(--font-display); letter-spacing: .04em;
    margin: 0 0 3px; color: var(--t-0);
  }
  .sheet .hint { color: var(--t-3); font-size: 11px; margin: 0 0 11px; }
  .sect {
    font: 500 9px/1 var(--font-ui); letter-spacing: .2em; text-transform: uppercase;
    color: var(--t-2); margin: 13px 0 5px; display: flex; align-items: center; gap: 8px;
  }
  .sect::after { content: ""; flex: 1; height: 1px; background: var(--line-1); }
  .mrow {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 3.5px 0; border-bottom: 1px solid var(--line-0);
    font-size: 11.5px; color: var(--t-1);
  }
  .mrow b {
    font: 500 11.5px/1.35 var(--font-mono); font-variant-numeric: tabular-nums;
    color: var(--t-0); text-align: right; white-space: nowrap;
  }
  .mrow b.warn { color: var(--warning); }
  .mrow b.bad  { color: var(--error); }
  .mrow b.ok   { color: var(--success); }
  .verdict {
    margin-top: 12px; padding: 9px 10px; font-size: 11.5px; line-height: 1.5;
    border: 1px solid var(--line-2); border-left: 2px solid var(--accent-2);
    background: var(--s-2); color: var(--t-1);
  }
  .sheet .acts { display: flex; gap: 8px; margin-top: 13px; }
  .sheet .acts button {
    flex: 1; appearance: none; padding: 10px 8px; border-radius: var(--radius);
    border: 1px solid var(--line-2); background: var(--s-2); color: var(--t-1);
    font: 500 10px/1 var(--font-ui); letter-spacing: .16em; text-transform: uppercase;
  }
  .sheet .acts button.key { background: var(--accent); color: var(--t-inv); border-color: var(--accent); }
  .sheet .acts button:active { background: var(--ov-active); }

  /* ---------- player ---------- */
  .player {
    /* Width/height are set from measurement in JS — `inset: 0` sizes to the
       layout viewport, which is not the visible area while Safari is
       overlaying a toolbar. */
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: var(--s-0); z-index: 50;
    display: flex; flex-direction: column;
    transform: translateY(100%); visibility: hidden;
    transition: transform 200ms var(--ease), visibility 200ms var(--ease);
  }
  .player.open { transform: translateY(0); visibility: visible; }
  .player .bar {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: calc(var(--safe-t) + 9px) calc(var(--safe-r) + 12px) 9px calc(var(--safe-l) + 6px);
    background: var(--s-1); border-bottom: 1px solid var(--line-2);
  }
  .back {
    appearance: none; border: 0; background: transparent; color: var(--accent);
    display: flex; align-items: center; gap: 5px; padding: 7px 9px;
    border-radius: var(--radius); font: 500 10px/1 var(--font-ui);
    letter-spacing: .16em; text-transform: uppercase;
  }
  .back:active { background: var(--ov-active); }
  .back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .player .title {
    font: 400 15px/1 var(--font-display); letter-spacing: .03em;
    /* offsets the wider Back control so the name still reads as centred */
    flex: 1; text-align: center; margin-right: 36px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pspec {
    appearance: none; flex: none; width: 32px; height: 32px;
    border: 1px solid var(--line-2); border-radius: var(--radius);
    background: var(--s-2); color: var(--t-2); display: grid; place-items: center;
  }
  .pspec:active { background: var(--ov-active); color: var(--accent); }
  .player iframe { flex: 1; width: 100%; border: 0; background: var(--s-0); display: block; }

  /* Fullscreen: a game can ask for the bar to go, and nothing of the
     launcher's replaces it — a floating chevron parked over the game's own HUD
     is exactly what fullscreen was asked for to get rid of. The way out is the
     game's settings sheet, which is where fullscreen was turned on and which
     carries a Leave button of its own. */
  .player.fs .bar { display: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: 1ms !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <svg class="mark" viewBox="0 0 34 34" fill="none" aria-hidden="true">
      <g class="rotor" stroke="currentColor" stroke-width="1.1">
        <circle cx="17" cy="17" r="12.4"/>
        <path d="M17 1.6v3.2M17 29.2v3.2M1.6 17h3.2M29.2 17h3.2" stroke-linecap="butt"/>
      </g>
      <path d="M17 9.4c1.5 2.5 4 4.9 4 6.6a4 4 0 0 1-8 0c0-1.7 2.5-4.1 4-6.6z" fill="#b81d3a"/>
    </svg>

    <div>
      <h1>Arcade</h1>
      <div class="status">
        <span class="dot" id="dot"></span>
        <span class="micro" id="sub">Loading</span>
      </div>
    </div>

    <div class="spacer"></div>

    <div class="instrs">
    <button class="instr" id="specs" aria-label="Display metrics">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="square" aria-hidden="true">
        <path d="M3.5 7.5v-4h4M20.5 7.5v-4h-4M3.5 16.5v4h4M20.5 16.5v4h-4"/>
        <path d="M7.5 12h9M7.5 9.8v4.4M16.5 9.8v4.4"/>
      </svg>
    </button>

    <button class="instr" id="refresh" aria-label="Refresh">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="square" aria-hidden="true">
        <path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>
      </svg>
    </button>
    </div>
  </header>

  <div class="rule"></div>

  <div class="grid" id="grid">

%; top: 50%; width: 26px; height: 26px;\n    margin: -13px 0 0 -13px; opacity: .55;\n    transition: transform 90ms var(--ease), opacity 90ms var(--ease);\n  }\n  .reticle.hot { transform: scale(1.5); opacity: .9; }\n  .reticle i {\n    position: absolute; width: 7px; height: 7px; border: 1px solid var(--accent);\n  }\n  .reticle i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; }\n  .reticle i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; }\n  .reticle i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; }\n  .reticle i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; }\n\n  /* ---------- controls ---------- */\n  /* The touch zone is large and invisible; the stick is drawn wherever the\n     thumb lands. That is what makes a faded — or fully invisible — stick still\n     usable: you are never aiming at a thing, you are just touching a corner. */\n  /* Sits *under* the action buttons: a positioned zone with a z-index above\n     them swallows every tap meant for Strike or Guard. */\n  .zone {\n    position: absolute; bottom: 0; height: 44%; pointer-events: auto;\n    touch-action: none; z-index: 0;\n  }\n  .zone.left  { left: 0; right: 50%; }\n  .zone.right { left: 50%; right: 0; }\n\n  .stick {\n    position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px;\n    z-index: 1;\n    border: 1px solid var(--line-1); background: rgba(233,216,197,.03);\n    pointer-events: none;\n    opacity: var(--stick-a, .55);\n    transition: opacity 140ms var(--ease);\n  }\n  .stick.circle { border-radius: 50%; }\n  .stick.square { border-radius: var(--radius); }\n  .stick::before, .stick::after { content: \"\"; position: absolute; background: var(--line-1); }\n  .stick::before { left: 12px; right: 12px; top: 50%; height: 1px; }\n  .stick::after { top: 12px; bottom: 12px; left: 50%; width: 1px; }\n  .stick .knob {\n    position: absolute; left: 50%; top: 50%; width: 44px; height: 44px;\n    margin: -22px 0 0 -22px;\n    background: rgba(233,216,197,.16); border: 1px solid var(--line-2);\n  }\n  .stick.circle .knob { border-radius: 50%; }\n  .stick.square .knob { border-radius: var(--radius); }\n  .stick.active { opacity: calc(var(--stick-a, .55) * 1.55 + .06); }\n  .stick.active .knob { background: rgba(233,216,197,.26); border-color: var(--accent-2); }\n  .stick .lbl { position: absolute; left: 0; right: 0; bottom: -16px; text-align: center; }\n  .stick.active .lbl { opacity: 0; }\n  .stick.hidden { display: none; }\n\n  /* ---------- haul, wake, and the way out ---------- */\n  .haul { display: flex; align-items: baseline; gap: 7px; margin-top: 9px;\n          padding-top: 9px; border-top: 1px solid var(--line-1); }\n  .haul b { font: 600 17px/1 var(--font-mono); color: var(--accent);\n            font-variant-numeric: tabular-nums; }\n  .haul .lost { color: var(--t-2); }\n  .track.wake i { background: linear-gradient(90deg, #6b2030, #b81d3a); }\n  .vitals.awake .track.wake i { box-shadow: 0 0 10px rgba(184,29,58,.5); }\n\n  /* The way out is never a secret — an extraction run is about deciding when\n     to leave, not about finding the door. */\n  .compass {\n    position: absolute; left: 50%; transform: translateX(-50%);\n    top: calc(var(--safe-t) + 10px); display: flex; align-items: center; gap: 8px;\n    padding: 6px 12px; background: rgba(11,6,9,.6);\n    border: 1px solid var(--line-1); border-radius: var(--radius);\n    pointer-events: none; z-index: 5;\n  }\n  .compass i { width: 0; height: 0; display: block;\n               border-left: 5px solid transparent; border-right: 5px solid transparent;\n               border-bottom: 9px solid var(--accent); }\n  .compass span { font: 500 10px/1 var(--font-mono); letter-spacing: .1em;\n                  color: var(--t-1); font-variant-numeric: tabular-nums; }\n  .compass.off { display: none; }\n  .compass.near i { border-bottom-color: var(--success); }\n  .compass.near span { color: var(--success); }\n\n  /* ---------- stash + depth ---------- */\n  .stash { display: flex; gap: 10px; margin: 4px 0 14px; }\n  .stash div { flex: 1; padding: 9px 10px; border: 1px solid var(--line-1);\n               border-radius: var(--radius); background: rgba(233,216,197,.03); }\n  .stash .k { font: 500 8.5px/1 var(--font-ui); letter-spacing: .18em;\n              text-transform: uppercase; color: var(--t-2); }\n  .stash .v { font: 600 16px/1.4 var(--font-mono); color: var(--t-0);\n              font-variant-numeric: tabular-nums; }\n  .depth { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }\n  .depth .lab { font: 500 9px/1 var(--font-ui); letter-spacing: .18em;\n                text-transform: uppercase; color: var(--t-2); }\n  .depth .pick { display: flex; gap: 5px; flex: 1; flex-wrap: wrap; }\n  .depth button {\n    appearance: none; min-width: 32px; padding: 7px 8px; cursor: pointer;\n    border: 1px solid var(--line-2); border-radius: var(--radius);\n    background: rgba(11,6,9,.5); color: var(--t-1);\n    font: 600 12px/1 var(--font-mono); font-variant-numeric: tabular-nums;\n  }\n  .depth button.on { border-color: var(--accent); color: var(--accent);\n                     background: rgba(233,216,197,.10); }\n\n  /* ---------- damage markers ---------- */\n  /* Projected from the world point that was actually struck, so a marker is a\n     readout of where the blade landed rather than a generic popup. */\n  .marks { position: absolute; inset: 0; pointer-events: none; z-index: 3; }\n  .mark {\n    position: absolute; transform: translate(-50%, -50%);\n    font: 500 20px/1 var(--font-mono); font-variant-numeric: tabular-nums;\n    color: var(--t-0); text-shadow: 0 0 10px rgba(0,0,0,.9), 0 0 3px rgba(0,0,0,1);\n    white-space: nowrap;\n  }\n  .mark.crit { color: var(--warning); font-size: 26px; }\n  .mark.block { color: var(--info); font-size: 16px; }\n  .mark small { display: block; font: 500 8px/1 var(--font-ui); letter-spacing: .18em;\n                text-transform: uppercase; color: var(--t-2); margin-top: 3px; }\n\n  /* Attack and block sit above the right pad, under the thumb in both\n     orientations (DESIGN.md: controls reposition, they do not just shrink). */\n  .act {\n    position: absolute; pointer-events: auto; appearance: none; z-index: 2;\n    border: 1px solid var(--line-2); border-radius: var(--radius);\n    background: rgba(11,6,9,.6); color: var(--t-1);\n    font: 500 9px/1 var(--font-ui); letter-spacing: .16em; text-transform: uppercase;\n    display: grid; place-items: center; touch-action: none;\n  }\n  .act:active, .act.on { background: rgba(233,216,197,.16); color: var(--accent);\n                         border-color: var(--accent-2); }\n  .act[disabled] { color: var(--t-3); border-color: var(--line-1); }\n  .strike { right: calc(var(--safe-r) + 16px); bottom: calc(var(--safe-b) + 146px);\n            width: 118px; height: 54px; }\n  .guard  { right: calc(var(--safe-r) + 146px); bottom: calc(var(--safe-b) + 146px);\n            width: 76px; height: 54px; }\n  .gear   { left: calc(var(--safe-l) + 16px); bottom: calc(var(--safe-b) + 146px);\n            width: 46px; height: 46px; }\n\n  @media (max-height: 460px) {\n    .pad { width: 96px; height: 96px; }\n    .strike { bottom: calc(var(--safe-b) + 118px); height: 46px; }\n    .guard  { bottom: calc(var(--safe-b) + 118px); height: 46px; }\n    .gear   { bottom: calc(var(--safe-b) + 118px); }\n    .diag { display: none; }\n\n    /* The intro grew a stash and a depth picker, which pushed Descend 216px\n       below the fold at 430px of height. It still scrolled — but you should not\n       have to go looking for the only button that matters. So the card sheds\n       its least load-bearing parts instead: the control legend and the long\n       second paragraph, both of which are read once and never again. */\n    .card h2 { font-size: 23px; }\n    .card .lede { font-size: 12px; line-height: 1.5; margin-bottom: 9px; }\n    .keys, .card .lede.tail { display: none; }\n    .stash { margin: 2px 0 9px; }\n    .stash > div { padding: 6px 8px; }\n    .stash .v { font-size: 13px; }\n    .depth { margin-bottom: 8px; }\n    .depth button { min-width: 28px; padding: 5px 7px; font-size: 11px; }\n    .card .go { padding: 10px 14px; margin-top: 6px; }\n  }\n\n  /* ---------- overlays ---------- */\n  .overlay {\n    position: absolute; inset: 0; z-index: 6; display: flex;\n    align-items: center; justify-content: center; text-align: center;\n    padding: calc(var(--safe-t) + 16px) calc(var(--safe-r) + 16px)\n             calc(var(--safe-b) + 16px) calc(var(--safe-l) + 16px);\n    background: rgba(5,2,3,.9); overflow-y: auto; -webkit-overflow-scrolling: touch;\n  }\n  .overlay.hide { display: none; }\n  .card { width: 100%; max-width: 340px; max-height: 100%; overflow-y: auto;\n          -webkit-overflow-scrolling: touch; padding: 18px 16px 16px; text-align: left; }\n  .cardhead { display: flex; align-items: center; gap: 9px; margin-bottom: 4px; }\n  .ornament { color: var(--accent-2); font-size: 12px; }\n  h2 { font: 400 27px/1.1 var(--font-display); letter-spacing: .04em; margin: 0 0 10px;\n       text-align: center; }\n  h3 { font: 400 17px/1 var(--font-display); letter-spacing: .04em; margin: 0; }\n  .lede { color: var(--t-2); font-size: 13px; line-height: 1.65; margin: 0 0 18px;\n          text-align: center; }\n  .big { font: 500 44px/1 var(--font-mono); font-variant-numeric: tabular-nums;\n         color: var(--accent); text-align: center; }\n  .big small { font: 500 10px/1 var(--font-ui); letter-spacing: .18em;\n               text-transform: uppercase; color: var(--t-2); display: block; margin-top: 9px; }\n\n  button.go {\n    appearance: none; border: 1px solid var(--accent); border-radius: var(--radius);\n    padding: 13px 30px; background: var(--accent); color: var(--s-0);\n    font: 500 11px/1 var(--font-ui); letter-spacing: .18em; text-transform: uppercase;\n  }\n  button.go:active { transform: scale(.98); box-shadow: var(--bloom); }\n  button.go.wide { display: block; width: 100%; margin-top: 16px; }\n  button.go.ghost { background: transparent; color: var(--accent); border-color: var(--line-2); }\n\n  .opt { display: flex; align-items: center; justify-content: space-between; gap: 14px;\n         padding: 11px 0; border-bottom: 1px solid var(--line-0); }\n  .opt.off { display: none; }\n  .optk { font-size: 13.5px; color: var(--t-0); }\n  .optd { font-size: 11px; color: var(--t-3); margin-top: 2px; line-height: 1.45; }\n  .sw { appearance: none; flex: none; width: 44px; height: 25px; padding: 2px;\n        border: 1px solid var(--line-2); border-radius: var(--radius);\n        background: var(--s-2); position: relative; }\n  .sw span { display: block; width: 18px; height: 19px; background: var(--t-3);\n             border-radius: 1px; transition: transform var(--dur) var(--ease),\n             background var(--dur) var(--ease); }\n  .sw[aria-checked=\"true\"] { border-color: var(--accent-2); }\n  .sw[aria-checked=\"true\"] span { transform: translateX(19px); background: var(--accent); }\n  .rng { flex: none; width: 132px; accent-color: var(--accent); }\n  .seg { flex: none; display: flex; border: 1px solid var(--line-2); border-radius: var(--radius); }\n  .seg button {\n    appearance: none; border: 0; background: transparent; color: var(--t-2);\n    padding: 8px 11px; font: 500 9px/1 var(--font-ui); letter-spacing: .14em;\n    text-transform: uppercase;\n  }\n  .seg button + button { border-left: 1px solid var(--line-2); }\n  .seg button.on { background: var(--accent); color: var(--t-inv, #0b0609); }\n\n  .keys { display: flex; gap: 8px; justify-content: center; margin-bottom: 18px; }\n  .keyk { flex: 1; text-align: center; padding: 9px 4px; border: 1px solid var(--line-1);\n          border-radius: var(--radius); }\n  .keyk b { display: block; font: 400 15px/1 var(--font-display); color: var(--accent);\n            margin-bottom: 5px; }\n  .keyk span { font-size: 10px; color: var(--t-3); line-height: 1.3; display: block; }\n\n  @media (prefers-reduced-motion: reduce) {\n    *, *::before, *::after { animation: none !important; transition-duration: 1ms !important; }\n  }\n</style>\n</head>\n<body>\n\n<div id=\"stage\">\n<canvas id=\"cv\"></canvas>\n\n<div class=\"hud\">\n  <div class=\"panel vitals\">\n    <div class=\"objective\">\n      <div class=\"k micro\">Objective</div>\n      <div class=\"v\" id=\"objV\">Find the sigil</div>\n    </div>\n    <div class=\"meter\">\n      <div class=\"meterhead\"><span class=\"micro\">Vigour</span><b id=\"hpNum\">100</b></div>\n      <div class=\"track hp\" id=\"hpTrack\"><i id=\"hpFill\" style=\"width:100%\"></i></div>\n    </div>\n    <div class=\"meter\">\n      <div class=\"meterhead\"><span class=\"micro\">Wind</span><b id=\"stNum\">100</b></div>\n      <div class=\"track sta\"><i id=\"stFill\" style=\"width:100%\"></i></div>\n    </div>\n    <div class=\"meter\">\n      <div class=\"meterhead\"><span class=\"micro\">The barrow</span><b id=\"wakeNum\">Asleep</b></div>\n      <div class=\"track wake\"><i id=\"wakeFill\" style=\"width:0%\"></i></div>\n    </div>\n    <div class=\"haul\">\n      <b id=\"haulNum\">0</b>\n      <span class=\"micro\" id=\"haulCt\">carrying nothing</span>\n    </div>\n  </div>\n\n  <div class=\"compass off\" id=\"compass\"><i id=\"compArrow\"></i><span id=\"compDist\">—</span></div>\n\n  <div class=\"panel diag\">\n    <div class=\"row\"><span>Fps</span><span id=\"fps\">—</span></div>\n    <div class=\"row\"><span>Scale</span><span id=\"scale\">—</span></div>\n    <div class=\"row\"><span>Draws</span><span id=\"draws\">—</span></div>\n    <div class=\"row\"><span>Tris</span><span id=\"tris\">—</span></div>\n    <div class=\"row\"><span>View</span><span id=\"view\">—</span></div>\n    <div class=\"row\"><span>Unused</span><span id=\"gap\">—</span></div>\n  </div>\n\n  <div class=\"reticle\" id=\"reticle\"><i></i><i></i><i></i><i></i></div>\n\n  <div class=\"panel bench off\" id=\"bench\">\n    <div class=\"row\"><span>Last hit</span><span id=\"bLast\">—</span></div>\n    <div class=\"row\"><span>Tip speed</span><span id=\"bSpeed\">—</span></div>\n    <div class=\"row\"><span>Contact</span><span id=\"bPart\">—</span></div>\n    <div class=\"row\"><span>Total</span><span id=\"bTotal\">0</span></div>\n  </div>\n\n  <div class=\"marks\" id=\"marks\"></div>\n\n  <div class=\"zone left\" id=\"zoneMove\"></div>\n  <div class=\"zone right\" id=\"zoneLook\"></div>\n  <div class=\"stick circle\" id=\"stickMove\"><div class=\"knob\"></div><div class=\"lbl micro\">Move</div></div>\n  <div class=\"stick circle\" id=\"stickLook\"><div class=\"knob\"></div><div class=\"lbl micro\">Look</div></div>\n\n  <button class=\"act strike\" id=\"btnStrike\">Strike</button>\n  <button class=\"act guard\" id=\"btnGuard\">Guard</button>\n  <button class=\"act gear\" id=\"btnGear\" aria-label=\"Settings\">\n    <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"\n         stroke-width=\"1.5\" stroke-linecap=\"square\" aria-hidden=\"true\">\n      <circle cx=\"12\" cy=\"12\" r=\"3.2\"/>\n      <path d=\"M12 2.6v3M12 18.4v3M2.6 12h3M18.4 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1\"/>\n    </svg>\n  </button>\n</div>\n\n<div class=\"overlay\" id=\"intro\">\n  <div class=\"panel card\">\n    <h2>Barrow</h2>\n    <p class=\"lede\">A tomb under a tomb. Your torch is the only light, and the\n      dead down here still hold their iron.</p>\n    <div class=\"keys\">\n      <div class=\"keyk\"><b>❖</b><span>Left pad<br>moves</span></div>\n      <div class=\"keyk\"><b>✦</b><span>Right pad<br>looks</span></div>\n      <div class=\"keyk\"><b>‡</b><span>Strike<br>and guard</span></div>\n    </div>\n    <p class=\"lede tail\" style=\"margin-bottom:14px\">The blade is real. It only hits what\n      it actually passes through — aim it, do not point at things. Carry what you\n      find back to the way out; the barrow keeps whatever you die holding.</p>\n    <div class=\"stash\">\n      <div><div class=\"k\">Banked</div><div class=\"v\" id=\"stashMarks\">0</div></div>\n      <div><div class=\"k\">Deepest</div><div class=\"v\" id=\"stashDeep\">—</div></div>\n      <div><div class=\"k\">Lost</div><div class=\"v\" id=\"stashLost\">0</div></div>\n    </div>\n    <div class=\"depth\">\n      <span class=\"lab\">Depth</span>\n      <div class=\"pick\" id=\"depthPick\"></div>\n    </div>\n    <button class=\"go wide\" id=\"btnDescend\" style=\"margin-top:0\">Descend</button>\n    <button class=\"go ghost wide\" id=\"btnTrain\">Training room</button>\n    <button class=\"go ghost wide\" id=\"btnSettingsFromIntro\">Settings</button>\n  </div>\n</div>\n\n<div class=\"overlay hide\" id=\"over\">\n  <div class=\"panel card\">\n    <div id=\"overHead\"></div>\n    <button class=\"go wide\" id=\"btnAgain\">Again</button>\n    <button class=\"go ghost wide\" id=\"btnMenu\">Main screen</button>\n  </div>\n</div>\n\n<div class=\"overlay hide\" id=\"settings\">\n  <div class=\"panel card\">\n    <div class=\"cardhead\"><span class=\"ornament\">❦</span><h3>Settings</h3></div>\n\n    <div class=\"opt\" id=\"rowFs\">\n      <div><div class=\"optk\">Fullscreen</div>\n      <div class=\"optd\">Hide the Arcade bar entirely. Leave, below, still gets you out.</div></div>\n      <button class=\"sw\" id=\"swFs\" role=\"switch\" aria-checked=\"false\"><span></span></button>\n    </div>\n\n    <div class=\"opt\">\n      <div><div class=\"optk\">Torch shadows</div>\n      <div class=\"optd\">The dungeon is shadow-mapped from your own torch. The most expensive thing here.</div></div>\n      <button class=\"sw\" id=\"swShadow\" role=\"switch\" aria-checked=\"true\"><span></span></button>\n    </div>\n\n    <div class=\"opt\">\n      <div><div class=\"optk\">Look speed</div><div class=\"optd\"><span id=\"lookVal\">1.0</span>×</div></div>\n      <input class=\"rng\" id=\"look\" type=\"range\" min=\"4\" max=\"22\" step=\"1\" value=\"10\">\n    </div>\n\n    <div class=\"opt\">\n      <div><div class=\"optk\">Invert look</div><div class=\"optd\">Drag down to look up.</div></div>\n      <button class=\"sw\" id=\"swInvert\" role=\"switch\" aria-checked=\"false\"><span></span></button>\n    </div>\n\n    <div class=\"opt\">\n      <div><div class=\"optk\">Stick visibility</div>\n      <div class=\"optd\" id=\"alphaVal\">55% — at 0 the sticks are invisible, and the\n        bottom corners still steer.</div></div>\n      <input class=\"rng\" id=\"stickAlpha\" type=\"range\" min=\"0\" max=\"100\" step=\"5\" value=\"55\">\n    </div>\n\n    <div class=\"opt\">\n      <div><div class=\"optk\">Stick shape</div><div class=\"optd\">Round or squared off.</div></div>\n      <div class=\"seg\" id=\"stickShape\">\n        <button data-shape=\"circle\" class=\"on\">Circle</button>\n        <button data-shape=\"square\">Square</button>\n      </div>\n    </div>\n\n    <div class=\"opt\">\n      <div><div class=\"optk\">Sound</div><div class=\"optd\">The torch, the blade, and the dark it is held up against.</div></div>\n      <button class=\"sw\" id=\"swSound\" role=\"switch\" aria-checked=\"true\"><span></span></button>\n    </div>\n    <div class=\"opt\">\n      <div><div class=\"optk\">Haptics</div><div class=\"optd\">Buzz on hits and on being hit.</div></div>\n      <button class=\"sw\" id=\"swHaptic\" role=\"switch\" aria-checked=\"true\"><span></span></button>\n    </div>\n\n    <div class=\"opt\">\n      <div><div class=\"optk\">Film grain</div><div class=\"optd\">Sensor noise over the image.</div></div>\n      <button class=\"sw\" id=\"swGrain\" role=\"switch\" aria-checked=\"true\"><span></span></button>\n    </div>\n\n    <div class=\"opt\">\n      <div><div class=\"optk\">Diagnostics</div><div class=\"optd\">Frame rate and render cost.</div></div>\n      <button class=\"sw\" id=\"swDiag\" role=\"switch\" aria-checked=\"true\"><span></span></button>\n    </div>\n\n    <button class=\"go wide\" id=\"btnResume\">Resume</button>\n    <button class=\"go ghost wide\" id=\"btnLeave\" style=\"margin-top:8px\">Leave to Arcade</button>\n  </div>\n</div>\n\n</div>\n\n<script>\n(function () {\n  'use strict';\n\n  var cv = document.getElementById('cv');\n  var gl = cv.getContext('webgl2', {\n    antialias: false, alpha: false, depth: true,\n    powerPreference: 'high-performance', preserveDrawingBuffer: false\n  });\n  var framed = window.self !== window.top;\n\n  if (!gl) {\n    document.getElementById('intro').innerHTML =\n      '<div class=\"panel card\"><h2>Barrow</h2>' +\n      '<p class=\"lede\">This device has no WebGL2, which is all this game is.</p></div>';\n    return;\n  }\n\n  var BKEY = 'barrow.best', SKEY = 'barrow.settings';\n\n  var elHp = document.getElementById('hpFill'), elHpNum = document.getElementById('hpNum');\n  var elHpTrack = document.getElementById('hpTrack');\n  var elSt = document.getElementById('stFill'), elStNum = document.getElementById('stNum');\n  var elObjV = document.getElementById('objV');\n  var elFps = document.getElementById('fps'), elScale = document.getElementById('scale');\n  var elDraws = document.getElementById('draws'), elTris = document.getElementById('tris');\n  var elView = document.getElementById('view'), elGap = document.getElementById('gap');\n  var vitalsEl = document.querySelector('.vitals');\n  var elWake = document.getElementById('wakeFill'), elWakeNum = document.getElementById('wakeNum');\n  var elHaul = document.getElementById('haulNum'), elHaulCt = document.getElementById('haulCt');\n  var compassEl = document.getElementById('compass');\n  var compArrow = document.getElementById('compArrow');\n  var compDist = document.getElementById('compDist');\n  var reticle = document.getElementById('reticle');\n  var stickMoveEl = document.getElementById('stickMove'), stickLookEl = document.getElementById('stickLook');\n  var strikeBtn = document.getElementById('btnStrike'), guardBt r(--dur) var(--ease),\n             background var(--dur) var(--ease); }\n  .sw[aria-checked=\"true\"] { border-color: var(--accent-2); }\n  .sw[aria-checked=\"true\"] span { transform: translateX(19px); background: var(--accent); }\n  .rng { flex: none; width: 128px; accent-color: var(--accent); }\n\n  /* Roster / stock list, used by the party and fusion screens. */\n  .dl { display: flex; align-items: center; gap: 8px; padding: 8px 9px; margin-bottom: 5px;\n        border: 1px solid var(--line-1); border-radius: var(--radius); background: var(--s-1);\n        width: 100%; appearance: none; color: inherit; text-align: left; }\n  .dl.sel { border-color: var(--accent); box-shadow: var(--bloom); }\n  .dl .nm { flex: 1; min-width: 0; font: 400 13.5px/1.15 var(--font-display); color: var(--t-0);\n            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n  .dl .rc { font: 500 8px/1 var(--font-ui); letter-spacing: .14em; text-transform: uppercase;\n            color: var(--t-3); }\n  .dl .lv { font: 500 10px/1 var(--font-mono); color: var(--t-2); }\n  .dl .aff { display: flex; gap: 3px; }\n  .dl .aff i { width: 6px; height: 6px; border-radius: 50%; background: currentColor;\n               font-style: normal; }\n  .kv { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0;\n        font-size: 12px; color: var(--t-2); border-bottom: 1px solid var(--line-0); }\n  .kv b { font: 500 12px/1 var(--font-mono); color: var(--t-0); font-variant-numeric: tabular-nums; }\n\n  .toast {\n    position: absolute; left: 50%; transform: translateX(-50%);\n    bottom: calc(var(--safe-b) + 132px); z-index: 6; padding: 9px 14px;\n    font-size: 12.5px; color: var(--t-0); pointer-events: none; opacity: 0;\n    transition: opacity 200ms var(--ease); white-space: nowrap; max-width: 90%;\n  }\n  .toast.on { opacity: 1; }\n\n  @media (prefers-reduced-motion: reduce) {\n    *, *::before, *::after { animation: none !important; transition-duration: 1ms !important; }\n  }\n</style>\n</head>\n<body>\n\n<div id=\"stage\">\n<canvas id=\"cv\"></canvas>\n\n<!-- ---------- field ---------- -->\n<div class=\"roster\" id=\"roster\"></div>\n\n<div class=\"hud\" id=\"fieldHud\">\n\n  <div class=\"panel floorlab\">\n    <div class=\"micro\">Stratum</div>\n    <div class=\"v\" id=\"floorNum\">1</div>\n  </div>\n\n  <div class=\"panel purse\">\n    <div><b id=\"macca\">0</b> <span>macca</span></div>\n    <div><span id=\"stockCt\">0</span> <span>in stock</span></div>\n  </div>\n\n  <div class=\"panel map\" id=\"mapBox\"><canvas id=\"mapCv\" width=\"216\" height=\"216\"></canvas></div>\n\n  <div class=\"dpad\">\n    <button class=\"fwd\" id=\"bFwd\" aria-label=\"Forward\">▲</button>\n    <button class=\"lft\" id=\"bLft\" aria-label=\"Turn left\">◀</button>\n    <button class=\"bck\" id=\"bBck\" aria-label=\"Back\">▼</button>\n    <button class=\"rgt\" id=\"bRgt\" aria-label=\"Turn right\">▶</button>\n  </div>\n\n  <div class=\"side\">\n    <button id=\"bParty\">Party</button>\n    <button id=\"bAct\">Search</button>\n    <button id=\"bGear\" aria-label=\"Settings\">\n      <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"\n           stroke-width=\"1.5\" stroke-linecap=\"square\" aria-hidden=\"true\">\n        <circle cx=\"12\" cy=\"12\" r=\"3.2\"/>\n        <path d=\"M12 2.6v3M12 18.4v3M2.6 12h3M18.4 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1\"/>\n      </svg>\n    </button>\n  </div>\n</div>\n\n<!-- ---------- battle ---------- -->\n<div class=\"battle\" id=\"battle\">\n  <div class=\"panel turns\" id=\"turnsBox\"><span class=\"who\" id=\"turnWho\">You</span></div>\n  <div class=\"foes\" id=\"foeList\"></div>\n  <div class=\"panel log\" id=\"log\"></div>\n  <div class=\"cmds\" id=\"cmds\">\n    <div class=\"scroll skills\" id=\"skillList\"></div>\n    <div class=\"cmdrow\" id=\"cmdMain\">\n      <button class=\"cmd\" id=\"cAttack\">Attack</button>\n      <button class=\"cmd\" id=\"cSkill\">Skill</button>\n      <button class=\"cmd\" id=\"cTalk\">Talk</button>\n    </div>\n    <div class=\"cmdrow\" id=\"cmdMain2\">\n      <button class=\"cmd\" id=\"cGuard\">Guard</button>\n      <button class=\"cmd\" id=\"cMaga\">Magatsuhi<small id=\"magaPct\">0%</small></button>\n      <button class=\"cmd\" id=\"cFlee\">Flee</button>\n    </div>\n    <div class=\"cmdrow\" id=\"cmdBack\" style=\"display:none\">\n      <button class=\"cmd\" id=\"cBack\">Back</button>\n    </div>\n  </div>\n</div>\n\n<!-- ---------- negotiation ---------- -->\n<div class=\"talk\" id=\"talk\">\n  <div class=\"panel talkcard\">\n    <div class=\"talkwho\">\n      <h3 id=\"talkName\">—</h3>\n      <span class=\"mood\" id=\"talkMood\">—</span>\n    </div>\n    <div class=\"talkline\" id=\"talkLine\">—</div>\n    <div id=\"talkAns\"></div>\n  </div>\n</div>\n\n<div class=\"panel toast\" id=\"toast\"></div>\n\n<!-- ---------- overlays ---------- -->\n<div class=\"overlay\" id=\"intro\">\n  <div class=\"panel card\">\n    <h2>Covenant</h2>\n    <p class=\"lede\">Descend, and make pacts with what lives down there.\n      Everything you fight can be talked to instead.</p>\n    <div class=\"rule\"></div>\n    <div class=\"kv\"><span>Turn economy</span><b>Press Turn</b></div>\n    <div class=\"kv\"><span>Party</span><b>You + 3</b></div>\n    <div class=\"kv\"><span>Recruitment</span><b>Negotiation</b></div>\n    <button class=\"go wide\" id=\"bStart\" style=\"margin-top:16px\">Descend</button>\n    <button class=\"go ghost wide\" id=\"bRules\">How it works</button>\n    <button class=\"go ghost wide\" id=\"bSettingsIntro\">Settings</button>\n  </div>\n</div>\n\n<div class=\"overlay hide\" id=\"rules\">\n  <div class=\"panel card\">\n    <div class=\"cardhead\"><span class=\"ornament\">❦</span><h3>Press Turn</h3></div>\n    <p class=\"lede\" style=\"text-align:left\">Each side opens its phase with one icon per\n      living combatant. Icons are spent, not taken in order — so a phase can be one\n      action or eight.</p>\n    <div class=\"kv\"><span>Ordinary action</span><b>1 icon</b></div>\n    <div class=\"kv\"><span>Weakness or critical</span><b>½ icon</b></div>\n    <div class=\"kv\"><span>Miss or evade</span><b>2 icons</b></div>\n    <div class=\"kv\"><span>Blocked (null)</span><b>2 icons</b></div>\n    <div class=\"kv\"><span>Repelled or drained</span><b>phase ends</b></div>\n    <div class=\"kv\"><span>Guard / pass</span><b>½ icon</b></div>\n    <p class=\"lede\" style=\"text-align:left;margin-top:14px\">A half icon is spent before a\n      full one, except by a weakness or a critical — which is what lets a good read\n      chain. The enemy plays by the same rules, so your own weaknesses hand them\n      the same gift.</p>\n    <div class=\"rule\"></div>\n    <div class=\"cardhead\"><span class=\"ornament\">❦</span><h3>Negotiation</h3></div>\n    <p class=\"lede\" style=\"text-align:left\">Talk instead of fighting. A demon's mood\n      decides which register of answer it wants — kind, serious, playful or evasive.\n      Read the mood, not the question. They will also ask for macca, or for your own\n      blood. Demons above your level will not serve you, and a full party leaves\n      nowhere to put them.</p>\n    <button class=\"go wide\" id=\"bRulesBack\">Back</button>\n  </div>\n</div>\n\n<div class=\"overlay hide\" id=\"party\">\n  <div class=\"panel card\">\n    <div class=\"cardhead\"><span class=\"ornament\">❦</span><h3 id=\"partyTitle\">Party</h3></div>\n    <p class=\"lede\" id=\"partyHint\" style=\"text-align:left\">Tap a demon to summon or send\n      it back to stock. Four in the field, counting you.</p>\n    <div id=\"partyList\"></div>\n    <div class=\"rule\"></div>\n    <div id=\"stockList\"></div>\n    <button class=\"go wide\" id=\"bFuse\">Fuse</button>\n    <button class=\"go ghost wide\" id=\"bPartyBack\">Back</button>\n  </div>\n</div>\n\n<div class=\"overlay hide\" id=\"fuse\">\n  <div class=\"panel card\">\n    <div class=\"cardhead\"><span class=\"ornament\">❦</span><h3>Fusion</h3></div>\n    <p class=\"lede\" id=\"fuseHint\" style=\"text-align:left\">Pick two. What comes out is\n      the average of their levels, one race up, and it keeps what it can of their skills.</p>\n    <div id=\"fuseList\"></div>\n    <div class=\"rule\"></div>\n    <div id=\"fusePreview\"></div>\n    <button class=\"go wide\" id=\"bFuseGo\" disabled>Fuse</button>\n    <button class=\"go ghost wide\" id=\"bFuseBack\">Back</button>\n  </div>\n</div>\n\n<div class=\"overlay hide\" id=\"over\">\n  <div class=\"panel card\"><div id=\"overBody\"></div>\n    <button class=\"go wide\" id=\"bAgain\">Again</button>\n    <button class=\"go ghost wide\" id=\"bMenu\">Main screen</button>\n  </div>\n</div>\n\n<div class=\"overlay hide\" id=\"settings\">\n  <div class=\"panel card\">\n    <div class=\"cardhead\"><span class=\"ornament\">❦</span><h3>Settings</h3></div>\n    <div class=\"opt\" id=\"rowFs\">\n      <div><div class=\"optk\">Fullscreen</div>\n      <div class=\"optd\">Hide the Arcade bar entirely. Leave, below, still gets you out.</div></div>\n      <button class=\"sw\" id=\"swFs\" role=\"switch\" aria-checked=\"false\"><span></span></button>\n    </div>\n    <div class=\"opt\">\n      <div><div class=\"optk\">Torch shadows</div>\n      <div class=\"optd\">The corridor is shadow-mapped from your own lamp.</div></div>\n      <button class=\"sw\" id=\"swShadow\" role=\"switch\" aria-checked=\"true\"><span></span></button>\n    </div>\n    <div class=\"opt\">\n      <div><div class=\"optk\">Automap</div><div class=\"optd\">Corner readout of where you have been.</div></div>\n      <button class=\"sw\" id=\"swMap\" role=\"switch\" aria-checked=\"true\"><span></span></button>\n    </div>\n    <div class=\"opt\">\n      <div><div class=\"optk\">Battle speed</div><div class=\"optd\"><span id=\"spdVal\">1.0</span>×</div></div>\n      <input class=\"rng\" id=\"spd\" type=\"range\" min=\"6\" max=\"24\" step=\"2\" value=\"10\">\n    </div>\n    <div class=\"opt\">\n      <div><div class=\"optk\">Sound</div><div class=\"optd\">Steel, negotiation, and the room they happen in.</div></div>\n      <button class=\"sw\" id=\"swSound\" role=\"switch\" aria-checked=\"true\"><span></span></button>\n    </div>\n    <div class=\"opt\">\n      <div><div class=\"optk\">Haptics</div><div class=\"optd\">Buzz on hits and recruits.</div></div>\n      <button class=\"sw\" id=\"swHaptic\" role=\"switch\" aria-checked=\"true\"><span></span></button>\n    </div>\n    <div class=\"opt\">\n      <div><div class=\"optk\">Film grain</div><div class=\"optd\">Sensor noise over the image.</div></div>\n      <button class=\"sw\" id=\"swGrain\" role=\"switch\" aria-checked=\"true\"><span></span></button>\n    </div>\n    <div class=\"opt\">\n      <div><div class=\"optk\">Diagnostics</div><div class=\"optd\">Frame rate and render cost.</div></div>\n      <button class=\"sw\" id=\"swDiag\" role=\"switch\" aria-checked=\"false\"><span></span></button>\n    </div>\n    <button class=\"go wide\" id=\"bSetBack\">Resume</button>\n    <button class=\"go ghost wide\" id=\"bLeave\">Leave to Arcade</button>\n  </div>\n</div>\n\n<div class=\"panel\" id=\"diag\" style=\"position:absolute;right:calc(var(--safe-r) + 10px);\n     bottom:calc(var(--safe-b) + 132px);z-index:6;padding:6px 8px;display:none;\n     font:500 10px/1.5 var(--font-mono);color:var(--t-2)\">\n  <span id=\"dFps\">—</span> fps · <span id=\"dDraws\">—</span> draws · <span id=\"dTris\">—</span>\n</div>\n\n</div>\n<script>\n(function () {\n  'use strict';\n\n  var cv = document.getElementById('cv');\n  var gl = cv.getContext('webgl2', { antialias:false, alpha:false, depth:true,\n                                     powerPreference:'high-performance' });\n  var framed = window.self !== window.top;\n  if (!gl) {\n    document.getElementById('intro').innerHTML =\n      '<div class=\"panel card\"><h2>Covenant</h2>' +\n      '<p class=\"lede\">        vague:'Fear is a very old habit of mine.' } },\n    { q: 'If I follow you, what becomes of me?',\n      a: { kind:'You would be looked after. I promise that much.',\n           serious:'You would be useful, and you would live.',\n           playful:'Fame. Riches. A little hat.',\n           vague:'The same as becomes of everything, eventually.' } },\n    { q: 'Say something true.',\n      a: { kind:'You are further from home than I am.',\n           serious:'One of us leaves this corridor.',\n           playful:'I have no idea what I am doing.',\n           vague:'Nothing down here has been true for a long time.' } },\n    { q: 'What do you make of the dark?',\n      a: { kind:'It is cold. You must be tired of it.',\n           serious:'It is cover, and I use it.',\n           playful:'Great for hiding. Terrible for reading.',\n           vague:'It is the part of the room I do not think about.' } }\n  ];\n\n  var OPENERS = {\n    timid:     ['Oh — you can see me? Please do not shout.',\n                'I was not going to bother anyone. Truly.'],\n    irritable: ['What. Say it and be quick about it.',\n                'You are standing in my corridor, human.'],\n    upbeat:    ['Oho! A live one! Do you talk, or only bleed?',\n                'You look interesting. Say something interesting.'],\n    gloomy:    ['...you woke me. Nobody has done that in a while.',\n                'Speak if you must. It will not change anything.']\n  };\n  var REACT = {\n    like:  ['That is exactly it.', 'You understand. Good.', 'Ha! Yes. Yes.'],\n    ok:    ['Hmph. Fine.', 'A safe answer.', 'I have heard worse.'],\n    hate:  ['Wrong. Completely wrong.', 'You disappoint me.', 'Do not waste my time.']\n  };\n\n  var nego = null;\n\n  function toneReaction(mood, tone) {\n    var m = MOODS[mood];\n    if (tone === m.like) return 'like';\n    if (tone === m.hate) return 'hate';\n    return 'ok';\n  }\n\n  function startNegotiation(foe) {\n    // Two gates, both from the series: a demon will not serve someone weaker\n    // than it, and it will not join a party that has nowhere to put it.\n    nego = { foe: foe, favour: 0, rounds: 0, mood: foe.mood, done: false,\n             paid: 0, stage: 'open' };\n    if (foe.talkedTo) nego.favour = 1;      // it remembers you\n    openTalk();\n    var line = pick(OPENERS[foe.mood]);\n    if (foe.lv > hero.lv) {\n      talkLine('<b>' + foe.name + '</b> looks you over and laughs. ' +\n               '\"You are level ' + hero.lv + '. I am ' + foe.lv +\n               '. Come back when that is not embarrassing.\"');\n      talkAnswers([{ t: 'Withdraw', fn: function () { endNegotiation('refused'); } }]);\n      return;\n    }\n    talkLine('<b>' + foe.name + '</b>: \"' + line + '\"');\n    talkAnswers([{ t: 'Go on', fn: nextRound }]);\n  }\n\n  function nextRound() {\n    if (!nego) return;\n    nego.rounds++;\n    if (nego.favour >= 2) return offerPact();\n    if (nego.rounds > 4) return endNegotiation('bored');\n    // A demand every other round, a question otherwise.\n    if (nego.rounds % 2 === 0) return askDemand();\n    askQuestion();\n  }\n\n  function askQuestion() {\n    var q = pick(QUESTIONS);\n    talkLine('<b>' + nego.foe.name + '</b>: \"' + q.q + '\"');\n    var opts = TONES.slice();\n    // Shuffle, so the same tone is never in the same place twice.\n    for (var i = opts.length - 1; i > 0; i--) { var j = ri(i+1), t = opts[i]; opts[i] = opts[j]; opts[j] = t; }\n    talkAnswers(opts.map(function (tone) {\n      return { t: q.a[tone], sub: TONE_NAME[tone], fn: function () { answerWith(tone); } };\n    }));\n  }\n\n  function answerWith(tone) {\n    var r = toneReaction(nego.mood, tone);\n    if (r === 'like') nego.favour += 1;\n    else if (r === 'hate') nego.favour -= 1;\n    talkLine('<b>' + nego.foe.name + '</b>: \"' + pick(REACT[r]) + '\"');\n    if (nego.favour <= -2) return talkAnswers([{ t: 'It has heard enough', fn: function () { endNegotiation('angry'); } }]);\n    talkAnswers([{ t: 'Co ash = 1; t.fx = (t.fx || 0) + Math.min(0.5, total/90);\n      if (t.ail === 'sleep' && total > 0) t.ail = null;\n      var tail = '';\n      if (a === 'w') { tail = ' <b>Weak!</b>'; anyWeak = true; }\n      else if (a === 'r') tail = ' Resisted.';\n      if (anyCrit && a !== 'r') tail += ' <b>Critical!</b>';\n      lines.push(t.name + ' takes ' + total + '.' + tail);\n      if (t.hp <= 0) lines.push('<b>' + t.name + ' falls.</b>');\n    });\n\n    if (!ended && (anyWeak || anyCrit)) worst = 'weak';\n    else if (!ended && allMiss && worst === 'miss') worst = 'miss';\n\n    if (src.side === 'party' && anyWeak) gainMagatsuhi(12);\n    if (src.side === 'foe') gainMagatsuhi(4);\n\n    say('<em>' + src.name + '</em> uses ' + sk.n + '. ' + lines.join(' '));\n    act(function () {\n      paintAll();\n      spend(worst);\n      done();\n    });\n  }\n\n  function tickAil(u) {\n    if (!u.ail) return;\n    if (u.ail === 'poison') {\n      var d = Math.max(1, Math.round(u.maxHp*0.08));\n      u.hp = Math.max(0, u.hp - d);\n    }\n    u.ailT--;\n    if (u.ailT <= 0) u.ail = null;\n  }\n\n  function gainMagatsuhi(n) {\n    magatsuhi = clamp(magatsuhi + n, 0, 100);\n    magaPct.textContent = Math.round(magatsuhi) + '%';\n    cMaga.classList.toggle('key', magatsuhi >= 100);\n  }\n\n  function victory() {\n    say('<em>The way is clear.</em>');\n    act(function () { endBattle(true); }, 500);\n  }\n  function defeat() {\n    say('<em>You are pulled down into the dark.</em>');\n    act(function () { gameOver(); }, 600);\n  }\n\n  /* ---------------- battle UI ---------------- */\n\n  var battleEl = document.getElementById('battle');\n  var fieldHud = document.getElementById('fieldHud');\n  var logEl = document.getElementById('log');\n  var foeListEl = document.getElementById('foeList');\n  var rosterEl = document.getElementById('roster');\n  var turnsBox = document.getElementById('turnsBox');\n  var turnWho = document.getElementById('turnWho');\n  var skillsEl = document.getElement :last-of-type { border-bottom: 0; }\n  .row .lab { font-size: 13px; color: var(--t-1); }\n  .row .sub { display: block; margin-top: 3px; font-size: 11px; color: var(--t-3); line-height: 1.4; }\n  .sw {\n    appearance: none; flex: none; width: 44px; height: 24px; cursor: pointer; position: relative;\n    background: var(--s-3); border: 1px solid var(--line-2); border-radius: var(--radius);\n  }\n  .sw::after {\n    content: \"\"; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px;\n    background: var(--t-3); transition: transform var(--dur) var(--ease), background var(--dur);\n  }\n  .sw[aria-checked=\"true\"] { border-color: var(--accent-2); }\n  .sw[aria-checked=\"true\"]::after { transform: translateX(20px); background: var(--accent); }\n  .seg { display: flex; gap: 5px; }\n  .seg button {\n    appearance: none; padding: 7px 11px; cursor: pointer;\n    background: rgba(11,6,9,.5); border: 1px solid var(--line-2); border-radius: var(--radius);\n    color: var(--t-1); font: 500 9.5px/1 var(--font-ui); letter-spacing: .14em; text-transform: uppercase;\n  }\n  .seg button.on { border-color: var(--accent); color: var(--accent); background: rgba(233,216,197,.10); }\n\n  #probe { position: absolute; left: -9999px; top: 0; width: 1px; height: 1px;\n           padding: env(safe-area-inset-top) env(safe-area-inset-right)\n                    env(safe-area-inset-bottom) env(safe-area-inset-left); }\n</style>\n</head>\n<body>\n\n<div id=\"stage\">\n<canvas id=\"cv\"></canvas>\n<div id=\"probe\"></div>\n\n<div class=\"hud\" id=\"hud\">\n  <div class=\"panel readout\">\n    <div class=\"cell\"><div class=\"micro\">Score</div><div class=\"v accent\" id=\"vScore\">0</div></div>\n    <div class=\"cell\"><div class=\"micro\">Rally</div><div class=\"v\" id=\"vRally\">0</div></div>\n    <div class=\"cell opt\"><div class=\"micro\">Best</div><div class=\"v brandish\" id=\"vBest\">0</div></div>\n    <div class=\"cell\"><div class=\"micro\">Lives</div><div class=\"lives\" id=\"vLives\"></div></div>\n  </div>\n\n  <div class=\"spin\" id=\"spinBox\">\n    <svg class=\"arc\" viewBox=\"0 0 22 12\" fill=\"none\" aria-hidden=\"true\">\n      <path id=\"spinArc\" d=\"M2 6 Q11 6 20 6\" stroke=\"currentColor\" stroke-width=\"1.4\" style=\"color:var(--accent)\"/>\n    </svg>\n    <b id=\"spinTxt\">NO SPIN</b>\n  </div>\n\n  <button class=\"gear\" id=\"btnGear\" aria-label=\"Settings\">\n    <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"\n         stroke-width=\"1.5\" stroke-linecap=\"square\" aria-hidden=\"true\">\n      <circle cx=\"12\" cy=\"12\" r=\"3.2\"/>\n      <path d=\"M12 2.6v3M12 18.4v3M2.6 12h3M18.4 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1\"/>\n    </svg>\n  </button>\n\n  <div class=\"toast\" id=\"toast\"></div>\n  <div class=\"hint\" id=\"hint\">Drag to move &middot; cut across the ball to curve it</div>\n</div>\n\n<div class=\"overlay\" id=\"intro\">\n  <div class=\"card\">\n    <h2>Curveball</h2>\n    <p class=\"lede\">A ball down a stone throat. Slice across it as you return and\n      it bends in the air — the wall it ends up behind is not the one it was\n      heading for.</p>\n    <div class=\"keys\">\n      <div><b>&#10070;</b><span>Drag<br>to move</span></div>\n      <div><b>&#10022;</b><span>Cut across<br>to curve</span></div>\n      <div><b>&#8225;</b><span>Three<br>lives</span></div>\n    </div>\n    <button class=\"go\" id=\"btnPlay\">Play</button>\n    <button class=\"go ghost\" id=\"btnSettingsIntro\">Settings</button>\n  </div>\n</div>\n\n<div class=\"overlay hide\" id=\"over\">\n  <div class=\"card\">\n    <div id=\"overHead\"></div>\n    <button class=\"go\" id=\"btnAgain\">Again</button>\n    <button class=\"go ghost\" id=\"btnMenu\">Main screen</button>\n  </div>\n</div>\n\n<div class=\"overlay hide\" id=\"settings\">\n  <div class=\"card\">\n    <h2 style=\"font-size:26px\">Settings</h2>\n    <div class=\"row\">\n      <div><span class=\"lab\">Fullscreen</span>\n        <span class=\"sub\">Hide the arcade bar and take the whole screen.</span></div>\n      <button class=\"sw\" id=\"swFs\" role=\"switch\" aria-checked=\"false\" aria-label=\"Fullscreen\"></button>\n    </div>\n    <div class=\"row\">\n      <div><span class=\"lab\">Sound</span>\n        <span class=\"sub\">The paddle, the walls, and the shaft between them.</span></div>\n      <button class=\"sw\" id=\"swSound\" role=\"switch\" aria-checked=\"true\" aria-label=\"Sound\"></button>\n    </div>\n    <div class=\"row\">\n      <div><span class=\"lab\">Haptics</span>\n        <span class=\"sub\">A tap on the paddle and on a point.</span></div>\n      <button class=\"sw\" id=\"swHaptic\" role=\"switch\" aria-checked=\"true\" aria-label=\"Haptics\"></button>\n    </div>\n    <div class=\"row\">\n      <div><span class=\"lab\">Trail</span>\n        <span class=\"sub\">Draw the path the ball has taken. Makes curve obvious.</span></div>\n      <button class=\"sw\" id=\"swTrail\" role=\"switch\" aria-checked=\"true\" aria-label=\"Trail\"></button>\n    </div>\n    <div class=\"row\">\n      <div><span class=\"lab\">Difficulty</span>\n        <span class=\"sub\">How fast it starts and how well the far side reads you.</span></div>\n      <div class=\"seg\" id=\"segDiff\">\n        <button data-d=\"calm\">Calm</button><button data-d=\"keen\">Keen</button><button data-d=\"cruel\">Cruel</button>\n      </div>\n    </div>\n    <button class=\"go ghost\" id=\"btnSetBack\" style=\"margin-top:16px\">Back</button>\n    <button class=\"go ghost\" id=\"btnLeave\">Leave to Arcade</button>\n  </div>\n</div>\n</div>\n\n<script>\n(function () {\n  'use strict';\n\n  var stageEl = document.getElementById('stage');\n  var cv = document.getElementById('cv');\n  var ctx = cv.getContext('2d');\n  var probe = document.getElementById('probe');\n  var hudEl = document.getElementById('hud');\n\n  var BKEY = 'curveball.best', SKEY = 'curveball.settings';\n\n  /* ---------------- settings ---------------- */\n\n  var settings = { fullscreen: false, haptics: true, sound: true, trail: true, diff: 'keen' };\n  try {\n    var raw = JSON.parse(localStorage.getItem(SKEY) || 'null');\n    if (raw && typeof raw === 'object') {\n      if (typeof raw.fullscreen === 'boolean') settings.fullscreen = raw.fullscreen;\n      if (typeof raw.haptics === 'boolean') settings.haptics = raw.haptics;\n      if (typeof raw.sound === 'boolean') settings.sound = raw.sound;\n      if (typeof raw.trail === 'boolean') settings.trail = raw.trail;\n      if (/^(calm|keen|cruel)$/.test(raw.diff)) settings.diff = raw.diff;\n    }\n  } catch (e) {}\n  function saveSettings() {\n    try { localStorage.setItem(SKEY, JSON.stringify(settings)); } catch (e) {}\n  }\n  function buzz(p) { if (settings.haptics && navigator.vibrate) navigator.vibrate(p); }\n\n  var DIFF = {\n    calm:  { speed: 5.4, gain: 0.16, aiLag: 0.30, aiErr: 0.34, aiSpin: 0.35 },\n    keen:  { speed: 6.6, gain: 0.22, aiLag: 0.20, aiErr: 0.22, aiSpin: 0.60 },\n    cruel: { speed: 7.8, gain: 0.30, aiLag: 0.12, aiErr: 0.13, aiSpin: 0.85 }\n  };\n  function tune() { return DIFF[settings.diff] || DIFF.keen; }\n\n  /* ---------------- stage ---------------- */\n\n  var cssW = 0, cssH = 0, dpr = 1;\n\n  function insets() {\n    var cs = getComputedStyle(probe);\n    function v(n) { return parseFloat(cs[n]) || 0; }\n    // env(safe-area-inset-bottom) silently changes meaning when Safari's\n    // toolbar retracts, so it is capped (DESIGN.md).\n    return { t: v('paddingTop'), r: v('paddingRight'),\n             b: Math.min(v('paddingBottom'), 34), l: v('paddingLeft') };\n  }\n\n  function framed() { try { return window.parent !== window; } catch (e) { return true; } }\n  function standalone() {\n    if (window.navigator.standalone === true) return true;\n    return !!(window.matchMedia && (matchMedia('(display-mode: standalone)').matches ||\n                                    matchMedia('(display-mode: fullscreen)').matches));\n  }\n\n  function measure() {\n    var vv = window.visualViewport, doc = document.documentElement;\n    var w = Math.max(doc.clientWidth || 0, window.innerWidth || 0,\n                     vv ? Math.round(vv.width + (vv.offsetLeft || 0)) : 0);\n    var h = Math.max(doc.clientHeight || 0, window.innerHeight || 0,\n                     vv ? Math.round(vv.height + (vv.offsetTop || 0)) : 0);\n    // Installed with nothing above us, a viewport short of the screen is Safari\n    // being wrong rather than something owning those pixels (PLATFORM.md).\n    var clear = !framed() || settings.fullscreen;\n    if (standalone() && clear && screen.width && screen.height) {\n      var lng = Math.max(screen.width, screen.height), sht = Math.min(screen.width, screen.height);\n      if (h >= w) { h = Math.max(h, lng); w = Math.max(w, sht); }\n      else        { h = Math.max(h, sht); w = Math.max(w, lng); }\n    }\n    return { w: w, h: h };\n  }\n\n  function resize() {\n    var m = measure();\n    cssW = m.w; cssH = m.h;\n    stageEl.style.width = cssW + 'px';\n    stageEl.style.height = cssH + 'px';\n    dpr = Math.min(window.devicePixelRatio || 1, 2);   // dpr 3 is not worth it\n    cv.width = Math.round(cssW*dpr); cv.height = Math.round(cssH*dpr);\n\n    var ins = insets();\n    var root = document.documentElement.style;\n    // Framed and not fullscreen the launcher bar already paid the top inset —\n    // charging it twice leaves a dead strip (PLATFORM.md).\n    root.setProperty('--safe-t', ((framed() && !settings.fullscreen) ? 0 : ins.t) + 'px');\n    root.setProperty('--safe-r', ins.r + 'px');\n    root.setProperty('--safe-b', ins.b + 'px');\n    root.setProperty('--safe-l', ins.l + 'px');\n    layout();\n  }\n  window.addEventListener('resize', resize);\n  window.addEventListener('orientationchange', function () {\n    // Safari reports the pre-rotation size during the rotation itself.\n    setTimeout(resize, 60); setTimeout(resize, 260); setTimeout(resize, 600);\n  });\n  if (window.visualViewport) {\n    window.visualViewport.addEventListener('resize', resize);\n    window.visualViewport.addEventListener('scroll', resize);\n  }\n\n  /* ---------------- the throat ----------------\n\n     A rectangular shaft running away from the eye. Its cross-section matches\n     the screen so one uniform scale projects it without distorting the ball. */\n\n  var TUNNEL = 13.0;          // length, in half-height units\n  var CAM = 3.15;             // eye distance in front of the near mouth\n  var HW = 1, HH = 1;         // half width / half height of the cross-section\n  var S = 100;                // pixels per unit at the near mouth\n  var CX = 0, CY = 0;\n\n  function layout() {\n    var ins = insets();\n    var top = (framed() && !settings.fullscreen) ? 0 : ins.t;\n    var availW = Math.max(120, cssW - ins.l - ins.r);\n    var availH = Math.max(120, cssH - top - ins.b);\n    CX = ins.l + availW/2;\n    CY = top + availH/2;\n    HH = 1;\n    HW = Math.max(0.55, Math.min(2.4, availW/availH));\n    S = (availH/2) * 0.96;\n  }\n\n  // Perspective. p is 1 at the near mouth and shrinks down the shaft.\n  function pf(z) { return CAM / (CAM + z); }\n  function px(x, z) { return CX + x * pf(z) * S; }\n  function py(y, z) { return CY - y * pf(z) * S; }\n\n  /* ---------------- state ---------------- */\n\n  var ball = { x: 0, y: 0, z: TUNNEL*0.5, vx: 0, vy: 0, vz: 0, sx: 0, sy: 0, r: 0.062 };\n  var me   = { x: 0, y: 0, px: 0, py: 0, vx: 0, vy: 0, w: 0.30, h: 0.30 };\n  var them = { x: 0, y: 0, w: 0.34, h: 0.34, tx: 0, ty: 0 };\n  var trail = [];\n\n  var state = {\n    running: false, over: false, paused: false,\n    score: 0, rally: 0, lives: 3, speed: 6.6,\n    serveT: 0, servingToMe: false, flash: 0, shake: 0, t: 0, hitFlash: 0\n  };\n  var best = parseInt(localStorage.getItem(BKEY) || '0', 10) || 0;\n\n  var elScore = document.getElementById('vScore'), elRally = document.getElementById('vRally'),\n      elBest = document.getElementById('vBest'), elLives = document.getElementById('vLives'),\n      spinBox = document.getElementById('spinBox'), spinTxt = document.getElementById('spinTxt'),\n      spinArc = document.getElementById('spinArc'),\n      toastEl = document.getElementById('toast'), hintEl = document.getElementById('hint');\n\n  function paintHud() {\n    elScore.textContent = state.score;\n    elRally.textContent = state.rally;\n    elBest.textContent = best;\n    var h = '';\n    for (var i = 0; i < 3; i++) h += '<i class=\"pip' + (i < state.lives ? '' : ' gone') + '\"></i>';\n    elLives.innerHTML = h;\n  }\n\n  var toastT = 0;\n  function toast(msg) {\n    toastEl.textContent = msg; toastEl.classList.add('on'); toastT = 1.5;\n  }\n\n  function paintSpin() {\n    var s = Math.hypot(ball.sx, ball.sy);\n    if (s < 0.35) {\n      spinBox.classList.remove('on');\n      return;\n    }\n    spinBox.classList.add('on');\n    // The arc bends the way the ball will. Reading it should be instant.\n    var bend = Math.max(-5, Math.min(5, ball.sx*1.5));\n    var lift = Math.max(-5, Math.min(5, -ball.sy*1.5));\n    spinArc.setAttribute('d', 'M2 ' + (6 - lift/2) + ' Q11 ' + (6 + bend + lift) + ' 20 ' + (6 - lift/2));\n    var dir = Math.abs(ball.sx) > Math.abs(ball.sy)\n      ? (ball.sx > 0 ? 'CURVING RIGHT' : 'CURVING LEFT')\n      : (ball.sy > 0 ? 'LIFTING' : 'DROPPING');\n    spinTxt.textContent = dir;\n  }\n\n  /* ---------------- run ---------------- */\n\n  function serve(toMe) {\n    var t = tune();\n    ball.x = 0; ball.y = 0;\n    ball.z = toMe ? TUNNEL*0.42 : TUNNEL*0.58;\n    ball.sx = 0; ball.sy = 0;\n    var sp = state.speed;\n    var ang = (Math.random()-0.5)*0.5;\n    ball.vx = Math.sin(ang)*sp*0.24;\n    ball.vy = (Math.random()-0.5)*sp*0.16;\n    ball.vz = toMe ? -sp : sp;\n    trail.length = 0;\n    state.serveT = 0.65;\n    state.servingToMe = !!toMe;\n    them.tx = 0; them.ty = 0;\n    paintSpin();\n  }\n\n  function reset() {\n    var t = tune();\n    state.score = 0; state.rally = 0; state.lives = 3;\n    // Death stops the bed; a new run has to bring it back.\n    Snd.bed(BED);\n    state.speed = t.speed; state.over = false; state.running = true;\n    state.flash = 0; state.shake = 0;\n    me.x = 0; me.y = 0; me.px = 0; me.py = 0; me.vx = 0; me.vy = 0;\n    them.x = 0; them.y = 0;\n    serve(true);\n    paintHud();\n    hintEl.style.display = '';\n  }\n\n  function point(mine) {\n    if (mine) {\n      state.score++;\n      if (state.score > best) {\n        best = state.score;\n        try { localStorage.setItem(BKEY, String(best)); } catch (e) {}\n      }\n      state.speed += tune().gain;\n      toast('Point. The shaft narrows.');\n      buzz([10, 30, 10]);\n      Snd.bell(659.25, 0.42, 0.14);\n    } else {\n      state.lives--;\n      state.flash = 1;\n      state.shake = 1;\n      toast(state.lives > 0 ? 'Missed.' : 'Gone.');\n      buzz([40, 60, 40]);\n      Snd.tone(130, 0.40, { type: 'sine', to: 62, gain: 0.13 });\n    }\n    state.rally = 0;\n    paintHud();\n    if (state.lives <= 0) return end();\n    serve(!mine);\n  }\n\n  var overEl = document.getElementById('over'), overHead = document.getElementById('overHead');\n\n  function end() {\n    state.over = true; state.running = false;\n    spinBox.classList.remove('on');\n    overHead.innerHTML =\n      '<h2>Down the throat</h2>' +\n      '<div class=\"big\">' + state.score + '<small>points taken</small></div>' +\n      '<p class=\"lede\" style=\"margin-top:18px\">Best is ' + best +\n      '. The ball goes where you put it, not where you aimed.</p>';\n    overEl.classList.remove('hide');\n    buzz([40, 80, 40]);\n    Snd.stopBed();\n    Snd.tone(104, 1.20, { type: 'sine', to: 48, gain: 0.14 });\n  }\n\n  /* ---------------- input ---------------- */\n\n  // Absolute mapping: the near mouth fills the screen, so the paddle simply\n  // goes where the finger is. Anything relative fights you when the ball is\n  // already on its way back.\n  var dragId = null;\n\n  function toPaddle(clientX, clientY) {\n    var r = stageEl.getBoundingClientRect();\n    var x = ((clientX - r.left) - CX) / S;\n    var y = -(((clientY - r.top) - CY) / S);\n    me.x = Math.max(-(HW - me.w/2), Math.min(HW - me.w/2, x));\n    me.y = Math.max(-(HH - me.h/2), Math.min(HH - me.h/2, y));\n  }\n\n  stageEl.addEventListener('touchstart', function (e) {\n    if (!state.running || state.paused) return;\n    if (dragId !== null) return;\n    var t = e.changedTouches[0];\n    // Leave the settings gear alone; everything else is the paddle.\n    if (e.target.closest && e.target.closest('.gear')) return;\n    e.preventDefault();\n    dragId = t.identifier;\n    toPaddle(t.clientX, t.clientY);\n  }, { passive: false });\n\n  window.addEventListener('touchmove', function (e) {\n    if (dragId === null) return;\n    for (var i = 0; i < e.changedTouches.length; i++) {\n      if (e.changedTouches[i].identifier === dragId) {\n        e.preventDefault();\n        toPaddle(e.changedTouches[i].clientX, e.changedTouches[i].clientY);\n      }\n    }\n  }, { passive: false });\n\n  function endTouch(e) {\n    if (dragId === null) return;\n    for (var i = 0; i < e.changedTouches.length; i++)\n      if (e.changedTouches[i].identifier === dragId) dragId = null;\n  }\n  window.addEventListener('touchend', endTouch);\n  window.addEventListener('touchcancel', endTouch);\n\n  var mouseDown = false;\n  stageEl.addEventListener('mousedown', function (e) {\n    if (!state.running || state.paused) return;\n    if (e.target.closest && e.target.closest('.gear')) return;\n    e.preventDefault(); mouseDown = true; toPaddle(e.clientX, e.clientY);\n  });\n  window.addEventListener('mousemove', function (e) {\n    if (mouseDown) toPaddle(e.clientX, e.clientY);\n  });\n  window.addEventListener('mouseup', function () { mouseDown = false; });\n\n  var keys = {};\n  window.addEventListener('keydown', function (e) {\n    keys[e.key.toLowerCase()] = true;\n    if (e.key === ' ') e.preventDefault();\n  });\n  window.addEventListener('keyup', function (e) { keys[e.key.toLowerCase()] = false; });\n\n  /* ---------------- simulation ---------------- */\n\n  function paddleHit(p, halfW, halfH) {\n    return Math.abs(ball.x - p.x) <= halfW + ball.r &&\n           Math.abs(ball.y - p.y) <= halfH + ball.r;\n  }\n\n  function update(dt) {\n    state.t += dt;\n    state.flash = Math.max(0, state.flash - dt*2.2);\n    state.shake = Math.max(0, state.shake - dt*2.6);\n    state.hitFlash = Math.max(0, state.hitFlash - dt*3.5);\n    if (toastT > 0) { toastT -= dt; if (toastT <= 0) toastEl.classList.remove('on'); }\n    if (!state.running || state.paused) return;\n\n    // Keys nudge the paddle; touch sets it outright.\n    var kx = (keys.arrowright || keys.d ? 1 : 0) - (keys.arrowleft || keys.a ? 1 : 0);\n    var ky = (keys.arrowup || keys.w ? 1 : 0) - (keys.arrowdown || keys.s ? 1 : 0);\n    if (kx || ky) {\n      me.x = Math.max(-(HW - me.w/2), Math.min(HW - me.w/2, me.x + kx*2.6*dt));\n      me.y = Math.max(-(HH - me.h/2), Math.min(HH - me.h/2, me.y + ky*2.6*dt));\n    }\n\n    // Paddle velocity is measured, not read from the input — it is the same\n    // number whether the paddle was moved by a thumb or by a key, and it is\n    // the only thing that puts spin on the ball.\n    me.vx = (me.x - me.px)/Math.max(dt, 0.0001);\n    me.vy = (me.y - me.py)/Math.max(dt, 0.0001);\n    me.px = me.x; me.py = me.y;\n\n    if (state.serveT > 0) { state.serveT -= dt; return; }\n\n    var t = tune();\n\n    // Curve. Spin bends the flight sideways and decays as it spends itself.\n    ball.vx += ball.sx*dt;\n    ball.vy += ball.sy*dt;\n    ball.sx *= Math.max(0, 1 - dt*0.30);\n    ball.sy *= Math.max(0, 1 - dt*0.30);\n\n    ball.x += ball.vx*dt;\n    ball.y += ball.vy*dt;\n    ball.z += ball.vz*dt;\n\n    // Walls. A bounce kills a little of the spin, so a curve is not forever.\n    var lx = HW - ball.r, ly = HH - ball.r;\n    // The shaft answers when it is struck; without it the ball is silent\n    // between paddles and the rally has no rhythm at all.\n    function wallSay() { Snd.hit(0.05, { freq: 420, to: 200, q: 0.9, gain: 0.07 }); }\n    if (ball.x < -lx) { ball.x = -lx; ball.vx = Math.abs(ball.vx); ball.sx *= -0.55; state.hitFlash = 0.4; wallSay(); }\n    if (ball.x >  lx) { ball.x =  lx; ball.vx = -Math.abs(ball.vx); ball.sx *= -0.55; state.hitFlash = 0.4; wallSay(); }\n    if (ball.y < -ly) { ball.y = -ly; ball.vy = Math.abs(ball.vy); ball.sy *= -0.55; state.hitFlash = 0.4; wallSay(); }\n    if (ball.y >  ly) { ball.y =  ly; ball.vy = -Math.abs(ball.vy); ball.sy *= -0.55; state.hitFlash = 0.4; wallSay(); }\n\n    if (settings.trail) {\n      trail.push(ball.x, ball.y, ball.z);\n      if (trail.length > 3*90) trail.splice(0, trail.length - 3*90);\n    } else if (trail.length) trail.length = 0;\n\n    // The far side reads the ball, badly on purpose, and worse when it curves.\n    var eta = ball.vz > 0 ? (TUNNEL - ball.z)/ball.vz : 99;\n    if (ball.vz > 0 && eta < 2.4) {\n      // It predicts a straight line and only partly accounts for the spin, so a\n      // well-cut ball beats it. Reading it perfectly would make curve pointless.\n      var predX = ball.x + ball.vx*eta + 0.5*ball.sx*eta*eta*t.aiSpin;\n      var predY = ball.y + ball.vy*eta + 0.5*ball.sy*eta*eta*t.aiSpin;\n      var wob = Math.sin(state.t*1.7)*t.aiErr;\n      them.tx = Math.max(-(HW - them.w/2), Math.min(HW - them.w/2, predX + wob));\n      them.ty = Math.max(-(HH - them.h/2), Math.min(HH - them.h/2, predY + wob*0.6));\n    }\n    var lag = Math.min(1, dt/Math.max(0.016, t.aiLag));\n    them.x += (them.tx - them.x)*lag;\n    them.y += (them.ty - them.y)*lag;\n\n    // Near end — yours.\n    if (ball.z <= 0) {\n      if (paddleHit(me, me.w/2, me.h/2)) {\n        ball.z = 0.001;\n        ball.vz = Math.abs(ball.vz);\n        // Where on the paddle it struck angles the return...\n        ball.vx += (ball.x - me.x)*3.2;\n        ball.vy += (ball.y - me.y)*3.2;\n
