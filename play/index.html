%22%3E%0A%20%20%20%20%20%20%3Cpath%20d%3D%22M90%2014.6v3.8%22%20transform%3D%22rotate%2830%2090%2090%29%22%2F%3E%0A%20%20%20%20%20%20%3Cpath%20d%3D%22M90%2014.6v3.8%22%20transform%3D%22rotate%2860%2090%2090%29%22%2F%3E%0A%20%20%20%20%20%20%3Cpath%20d%3D%22M90%2014.6v3.8%22%20transform%3D%22rotate%28120%2090%2090%29%22%2F%3E%0A%20%20%20%20%20%20%3Cpath%20d%3D%22M90%2014.6v3.8%22%20transform%3D%22rotate%28150%2090%2090%29%22%2F%3E%0A%20%20%20%20%20%20%3Cpath%20d%3D%22M90%2014.6v3.8%22%20transform%3D%22rotate%28210%2090%2090%29%22%2F%3E%0A%20%20%20%20%20%20%3Cpath%20d%3D%22M90%2014.6v3.8%22%20transform%3D%22rotate%28240%2090%2090%29%22%2F%3E%0A%20%20%20%20%20%20%3Cpath%20d%3D%22M90%2014.6v3.8%22%20transform%3D%22rotate%28300%2090%2090%29%22%2F%3E%0A%20%20%20%20%20%20%3Cpath%20d%3D%22M90%2014.6v3.8%22%20transform%3D%22rotate%28330%2090%2090%29%22%2F%3E%0A%20%20%20%20%3C%2Fg%3E%0A%20%20%3C%2Fg%3E%0A%0A%20%20%3C%21--%20arterial%20drop%3A%20apex%20y58.5%2C%20bulb%20centre%20y101.7%20r20.3%20--%3E%0A%20%20%3Cpath%20d%3D%22M90%2058.5c7.6%2012.7%2020.3%2024.6%2020.3%2033.2a20.3%2020.3%200%200%201-40.6%200c0-8.6%2012.7-20.5%2020.3-33.2z%22%0A%20%20%20%20%20%20%20%20fill%3D%22%23b81d3a%22%2F%3E%0A%3C%2Fsvg%3E%0A" type="image/svg+xml">
<style>
  /* Sanguine — see DESIGN.md. Pallor and blood: bone is the accent, crimson
     is decorative, and the ground stays near-black oxblood throughout. */
  :root {
    --s-0: #0b0609;  --s-1: #12080c;  --s-2: #1a0d12;  --s-3: #241119;
    --t-0: #f2e6e6;  --t-1: #c3a9ad;  --t-2: #8f6f76;  --t-3: #5c434a;
    --accent: #e9d8c5;
    --accent-2: #b81d3a;
    --brand: #d9557a;
    --line-0: #150a0e;  --line-1: #2a141c;  --line-2: #3d1f28;
    --error: #ff5470;  --success: #5fa777;  --pending: #a884c9;
    --cat-1: #6fb3ab; --cat-2: #8a8fc9; --cat-3: #a884c9; --cat-4: #c96a8e;

    --bloom:    0 0 12px rgba(216,58,88,.45), 0 0 26px rgba(216,58,88,.16);
    --bloom-lg: 0 0 22px rgba(216,58,88,.45), 0 0 52px rgba(216,58,88,.16);
    --lit-within: inset 0 0 60px rgba(184,29,58,.05);
    --scrim: #050203;

    --ov-hover: rgba(233,216,197,.06);
    --ov-active: rgba(233,216,197,.12);

    --font-display: Georgia, "Times New Roman", serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;

    --radius: 2px;
    --dur: 160ms;
    --ease: cubic-bezier(.2,.6,.2,1);

    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--s-0); color: var(--t-0);
    font: 400 16px/1.45 var(--font-ui);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    touch-action: manipulation;
  }
  body { overflow-x: hidden; }

  /* micro-label: the console voice — uppercase, wide, small */
  .micro {
    font: 500 10px/1 var(--font-ui);
    letter-spacing: .16em; text-transform: uppercase; color: var(--t-2);
  }

  .wrap {
    padding: calc(var(--safe-t) + 18px) calc(var(--safe-r) + 16px)
             calc(var(--safe-b) + 48px) calc(var(--safe-l) + 16px);
    max-width: 760px; margin: 0 auto;
  }

  /* ---------- masthead ---------- */
  header { display: flex; align-items: flex-start; gap: 14px; }
  .mark { flex: none; width: 34px; height: 34px; margin-top: 2px; color: var(--accent); }
  .mark .rotor { transform-origin: 50% 50%; animation: rotor 60s linear infinite; }
  @keyframes rotor { to { transform: rotate(360deg); } }

  h1 {
    font: 400 30px/1 var(--font-display);
    letter-spacing: .04em; margin: 0; color: var(--t-0);
  }
  .status { display: flex; align-items: center; gap: 7px; margin-top: 9px; }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--t-3); flex: none;
    transition: background var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  }
  .dot.ok      { background: var(--success); box-shadow: 0 0 8px rgba(95,167,119,.7); }
  .dot.cached  { background: var(--pending); box-shadow: 0 0 8px rgba(168,132,201,.7); }
  .dot.fail    { background: var(--error);   box-shadow: 0 0 8px rgba(255,84,112,.7); }

  .spacer { flex: 1; }

  button.instr {
    appearance: none; flex: none;
    width: 38px; height: 38px; border-radius: var(--radius);
    border: 1px solid var(--line-2); background: var(--s-1);
    color: var(--accent); display: grid; place-items: center;
    transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);
  }
  button.instr:active { background: var(--ov-active); border-color: var(--accent-2); }
  button.instr:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.instr.busy svg { animation: sweep 900ms linear infinite; }
  @keyframes sweep { to { transform: rotate(360deg); } }

  .rule {
    height: 1px; background: var(--line-1); margin: 16px 0 14px;
    position: relative;
  }
  .rule::after {
    content: ""; position: absolute; left: 0; top: 0; width: 46px; height: 1px;
    background: var(--accent-2);
  }

  /* ---------- grid ---------- */
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(3, 1fr); } }

  .card {
    position: relative; display: flex; flex-direction: column; text-align: left;
    appearance: none; border: 1px solid var(--line-1); border-radius: var(--radius);
    background: var(--s-1); color: inherit; padding: 15px 13px 11px;
    min-height: 152px; overflow: hidden;
    transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease),
                box-shadow var(--dur) var(--ease);
  }
  .card::before {                      /* channel strip: the game's categorical ink */
    content: ""; position: absolute; inset: 0 0 auto 0; height: 2px;
    background: var(--ink, var(--cat-1)); opacity: .85;
  }
  .card .bracket {                     /* machined corner bracket */
    position: absolute; right: 9px; bottom: 9px; width: 9px; height: 9px;
    border-right: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2);
  }
  .card:active {
    background: var(--ov-hover); border-color: var(--accent-2);
    box-shadow: var(--bloom), var(--lit-within);
  }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card .glyph { color: var(--accent); margin-bottom: 12px; }
  .card .name {
    font: 400 18px/1.15 var(--font-display); letter-spacing: .02em; color: var(--t-0);
  }
  .card .desc {
    color: var(--t-2); font-size: 12px; line-height: 1.4; margin-top: 5px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card .readout {
    margin-top: auto; padding-top: 10px; display: flex; align-items: baseline;
    justify-content: space-between; gap: 8px; border-top: 1px solid var(--line-0);
  }
  .card .readout .val {
    font: 500 13px/1 var(--font-mono); font-variant-numeric: tabular-nums; color: var(--t-1);
  }
  .card .readout .val.empty { color: var(--t-3); }

  /* ---------- states ---------- */
  .state { grid-column: 1 / -1; text-align: center; color: var(--t-2);
           padding: 54px 18px; font-size: 13.5px; line-height: 1.7; }
  .state code {
    font: 400 12px/1 var(--font-mono); color: var(--t-1);
    background: var(--s-2); border: 1px solid var(--line-1); border-radius: var(--radius);
    padding: 3px 5px;
  }
  .skel {
    min-height: 152px; border: 1px solid var(--line-1); border-radius: var(--radius);
    background: var(--s-1); position: relative; overflow: hidden;
  }
  .skel::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, var(--ov-hover), transparent);
    transform: translateX(-100%); animation: scan 1.4s var(--ease) infinite;
  }
  @keyframes scan { to { transform: translateX(100%); } }

  .foot { margin-top: 22px; text-align: center; color: var(--t-3); font-size: 11px; line-height: 1.8; }
  .foot code { font-family: var(--font-mono); color: var(--t-2); }

  .version {
    position: fixed; z-index: 60;
    right: calc(var(--safe-r) + 10px); bottom: calc(var(--safe-b) + 9px);
    font: 500 9.5px/1 var(--font-mono); letter-spacing: .1em;
    color: var(--brand); border: 1px solid var(--line-2); border-radius: var(--radius);
    padding: 3px 5px; background: var(--s-1); pointer-events: none;
    font-variant-numeric: tabular-nums;
  }
  .version[hidden] { display: none; }
  /* The build stamp belongs to the launcher — keep it off a running game. */
  .player.open ~ .version { display: none; }

  /* ---------- player ---------- */
  .player {
    position: fixed; inset: 0; background: var(--s-0); z-index: 50;
    display: flex; flex-direction: column;
    transform: translateY(100%); visibility: hidden;
    transition: transform 200ms var(--ease), visibility 200ms var(--ease);
  }
  .player.open { transform: translateY(0); visibility: visible; }
  .player .bar {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: calc(var(--safe-t) + 9px) calc(var(--safe-r) + 12px) 9px calc(var(--safe-l) + 6px);
    background: var(--s-1); border-bottom: 1px solid var(--line-2);
  }
  .back {
    appearance: none; border: 0; background: transparent; color: var(--accent);
    display: flex; align-items: center; gap: 5px; padding: 7px 9px;
    border-radius: var(--radius); font: 500 10px/1 var(--font-ui);
    letter-spacing: .16em; text-transform: uppercase;
  }
  .back:active { background: var(--ov-active); }
  .back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .player .title {
    font: 400 15px/1 var(--font-display); letter-spacing: .03em;
    flex: 1; text-align: center; margin-right: 74px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .player iframe { flex: 1; width: 100%; border: 0; background: var(--s-0); display: block; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: 1ms !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <svg class="mark" viewBox="0 0 34 34" fill="none" aria-hidden="true">
      <g class="rotor" stroke="currentColor" stroke-width="1.1">
        <circle cx="17" cy="17" r="12.4"/>
        <path d="M17 1.6v3.2M17 29.2v3.2M1.6 17h3.2M29.2 17h3.2" stroke-linecap="butt"/>
      </g>
      <path d="M17 9.4c1.5 2.5 4 4.9 4 6.6a4 4 0 0 1-8 0c0-1.7 2.5-4.1 4-6.6z" fill="#b81d3a"/>
    </svg>

    <div>
      <h1>Arcade</h1>
      <div class="status">
        <span class="dot" id="dot"></span>
        <span class="micro" id="sub">Loading</span>
      </div>
    </div>

    <div class="spacer"></div>

    <button class="instr" id="refresh" aria-label="Refresh">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="square" aria-hidden="true">
        <path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>
      </svg>
    </button>
  </header>

  <div class="rule"></div>

  <div class="grid" id="grid">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </div>

  <div class="foot">
    Drop a folder into <code>arcade/games/</code> with an <code>index.html</code>, push, then refresh.
  </div>
</div>

<div class="player" id="player">
  <div class="bar">
    <button class="back" id="back">
      <svg width="9" height="15" viewBox="0 0 12 20" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M10 2 2 10l8 8"/></svg>
      Arcade
    </button>
    <div class="title" id="ptitle"></div>
  </div>
  <iframe id="frame" allow="autoplay; fullscreen; gamepad; accelerometer; gyroscope"
          referrerpolicy="no-referrer" title="Game"></iframe>
</div>

<div class="version" id="version" hidden></div>

<script>

(env(safe-area-inset-bottom,0px) + 14px) calc(env(safe-area-inset-left,0px) + 14px);\n  }\n\n  /* instrument rail */\n  .hud { flex: none; display: flex; border: 1px solid var(--line-1); border-radius: var(--radius);\n         background: var(--s-1); margin-bottom: 12px; }\n  .stat { flex: 1; padding: 9px 6px 8px; text-align: center; border-right: 1px solid var(--line-0); }\n  .stat:last-child { border-right: 0; }\n  .k { font: 500 9px/1 var(--font-ui); letter-spacing: .16em; text-transform: uppercase; color: var(--t-2); }\n  .v { margin-top: 6px; font: 500 19px/1 var(--font-mono); font-variant-numeric: tabular-nums; color: var(--t-0); }\n  .v small { font-size: 11px; color: var(--t-3); }\n  .v.brandish { color: var(--brand); }\n\n  /* progress: a segmented gauge, one segment per round */\n  .gauge { flex: none; display: flex; gap: 2px; margin-bottom: 12px; }\n  .seg { flex: 1; height: 3px; background: var(--line-1); transition: background var(--dur) var(--ease); }\n  .seg.on { background: var(--accent-2); }\n\n  .board { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr);\n           grid-template-rows: repeat(4, 1fr); gap: 8px; min-height: 0; }\n  .cell {\n    border-radius: var(--radius); background: var(--s-1); border: 1px solid var(--line-1);\n    position: relative;\n    transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease),\n                box-shadow var(--dur) var(--ease), transform 90ms var(--ease);\n  }\n  .cell::after {                       /* corner bracket, machined bezel */\n    content: \"\"; position: absolute; right: 5px; bottom: 5px; width: 6px; height: 6px;\n    border-right: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2);\n  }\n  .cell.lit {\n    background: var(--accent); border-color: var(--accent);\n    box-shadow: var(--bloom-lg);\n  }\n  .cell.lit::after { border-color: rgba(11,6,9,.28); }\n  .cell.hit { transform: scale(.94); }\n  .cell.bad { border-color: var(--error); background:   var ptitle = document.getElementById('ptitle');

  // A bundled build (see tools/build-pwa.py) inlines every game into one
  // file so the launcher works with no server and no network at all.
  var BUNDLE = window.__ARCADE_BUNDLE__ || null;

  /* ---------------- discovery ---------------- */

  function discover() {
    if (BUNDLE) return Promise.resolve(BUNDLE.games.map(normalize));
    return fetch('games.json', { cache: 'no-cache' })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)); })
      .then(function (data) {
        var list = (data && data.games) || [];
        if (!list.length) throw new Error('empty index');
        return list.map(normalize);
      })
      .catch(function () {
        return listFolders().then(function (slugs) { return Promise.all(slugs.sort().map(describe)); });
      });
  }

  // Must be idempotent: the cache stores already-normalized records, so this
  // runs a second time over its own output and has to accept either key.
  function normalize(g) {
    var slug = g.slug;
    return {
      slug:  slug,
      name:  g.name || titleize(slug),
      desc:  g.description || g.desc || '',
      glyph: g.glyph || 'default',
      ink:   g.ink || INKS[hash(slug) % INKS.length],
      stat:  g.stat || null,
      entry: g.entry || 'index.html'
    };
  }

  function listFolders() {
    var i = 0;
    function attempt() {
      if (i >= REFS.length) return Promise.reject(new Error('no ref matched'));
      var ref = REFS[i++];
      var url = 'https://api.github.com/repos/' + REPO + '/contents/' + DIR + '?ref=' + encodeURIComponent(ref);
      return fetch(url, { headers: { Accept: 'application/vnd.github+json' } })
        .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)); })
        .then(function (items) {
          var dirs = (items || []).filter(function (it) { return it.type === 'dir'; })
                                  .map(function (it) { return it.name; });
          return dirs.length ? dirs : attempt();
        })
        .catch(attempt);
    }
    return attempt();
  }

  // Metadata comes from the site itself (same origin, no rate limit). A game.json
  // is optional — without one we derive a decent title from the folder name.
  function describe(slug) {
    return fetch('games/' + slug + '/game.json', { cache: 'no-cache' })
      .then(function (r) { return r.ok ? r.json() : {}; })
      .catch(function () { return {}; })
      .then(function (meta) { meta.slug = slug; return normalize(meta); });
  }

  function titleize(s) {
    return s.replace(/[-_]+/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); });
  }
  function hash(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return h;
  }

  // Each game names the localStorage key holding its personal best, so the
  // launcher can show it as a readout without knowing anything else about it.
  function readStat(stat) {
    if (!stat || !stat.key) return null;
    var raw;
    try { raw = localStorage.getItem(stat.key); } catch (e) { return null; }
    if (raw === null || raw === '') return null;
    var n = parseFloat(raw);
    if (!isFinite(n) || n <= 0) return null;
    return stat.format === 'ms' ? Math.round(n) + 'ms' : String(Math.round(n));
  }

  /* ---------------- render ---------------- */

  function setStatus(cls, text) {
    dot.className = 'dot' + (cls ? ' ' + cls : '');
    sub.textContent = text;
  }

  function render(games) {
    grid.innerHTML = '';
    if (!games.length) {
      setStatus('fail', 'Empty');
      var s = document.createElement('div');
      s.className = 'state';
      s.innerHTML = 'No titles installed.<br>Drop a folder with an <code>index.html</code> into <code>arcade/games/</code>.';
      grid.appendChild(s);
      return;
    }

    games.forEach(function (g) {
      var b = document.createElement('button');
      b.className = 'card';
      b.style.setProperty('--ink', g.ink);

      var gl = document.createElement('div');
      gl.className = 'glyph';
      gl.innerHTML = glyphSvg(g.glyph, 26);

      var nm = document.createElement('div');
      nm.className = 'name';
      nm.textContent = g.name;

      b.appendChild(gl);
      b.appendChild(nm);

      if (g.desc) {
        var d = document.createElement('div');
        d.className = 'desc';
        d.textContent = g.desc;
        b.appendChild(d);
      }

      var ro = document.createElement('div');
      ro.className = 'readout';
      var lab = document.createElement('span');
      lab.className = 'micro';
      lab.textContent = (g.stat && g.stat.label) || 'Best';
      var val = document.createElement('span');
      var v = readStat(g.stat);
      val.className = 'val' + (v ? '' : ' empty');
      val.textContent = v || '—';
      ro.appendChild(lab);
      ro.appendChild(val);
      b.appendChild(ro);

      var br = document.createElement('div');
      br.className = 'bracket';
      b.appendChild(br);

      b.addEventListener('click', function () { open(g); });
      grid.appendChild(b);
    });
  }

  function showError(msg) {
    setStatus('fail', 'Offline');
    grid.innerHTML = '';
    var s = document.createElement('div');
    s.className = 'state';
    s.textContent = msg;
    grid.appendChild(s);
  }

  /* ---------------- player ---------------- */

  var current = null;

  function open(g) {
    current = g;
    ptitle.textContent = g.name;
    if (BUNDLE) {
      frame.removeAttribute('src');
      frame.srcdoc = BUNDLE.html[g.slug] || '<p>Missing.</p>';
    } else {
      frame.src = 'games/' + g.slug + '/' + g.entry;
    }
    player.classList.add('open');
    document.body.style.overflow = 'hidden';
    if (history.pushState) history.pushState({ game: g.slug }, '', '#' + g.slug);
  }

  function close() {
    player.classList.remove('open');
    document.body.style.overflow = '';
    setTimeout(function () {
      if (player.classList.contains('open')) return;
      frame.removeAttribute('srcdoc');
      frame.src = 'about:blank';
      // A game may have just set a new personal best; refresh the readouts.
      if (current && lastGames) render(lastGames);
      current = null;
    }, 220);
  }

  document.getElementById('back').addEventListener('click', function () {
    if (location.hash) history.back(); else close();
  });
  window.addEventListener('popstate', close);

  /* ---------------- load ---------------- */

  var lastGames = null;

  function paint(games, cls, note) {
    lastGames = games;
    render(games);
    if (games.length) {
      setStatus(cls, games.length + (games.length === 1 ? ' title' : ' titles') + (note ? ' · ' + note : ''));
    }
  }

  function load(force) {
    var cached = null;
    try { cached = JSON.parse(localStorage.getItem(CKEY) || 'null'); } catch (e) {}

    if (cached && cached.games && !force && Date.now() - cached.at < TTL) {
      paint(cached.games.map(normalize), 'ok', null);
      return Promise.resolve();
    }
    if (cached && cached.games && cached.games.length) paint(cached.games.map(normalize), 'cached', 'cached');

    return discover()
      .then(function (games) {
        try { localStorage.setItem(CKEY, JSON.stringify({ at: Date.now(), games: games })); } catch (e) {}
        paint(games, 'ok', null);
      })
      .catch(function () {
        if (cached && cached.games && cached.games.length) {
          paint(cached.games.map(normalize), 'cached', 'cached');
        } else {
          showError('Could not load the game list. Check your connection and refresh.');
        }
      });
  }

  /* ---------------- refresh ---------------- */

  var btn = document.getElementById('refresh');

  // In a bundled build the list is baked in, so there is nothing to re-fetch —
  // the button checks for a newer service worker instead.
  function checkForUpdate() {
    if (!('serviceWorker' in navigator)) return Promise.resolve();
    return navigator.serviceWorker.getRegistration()
      .then(function (reg) {
        if (!reg) return;
        return reg.update().then(function () {
          if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
        });
      })
      .catch(function () {});
  }

  btn.addEventListener('click', function () {
    btn.classList.add('busy');
    var job = BUNDLE
      ? checkForUpdate().then(function () { location.reload(); })
      : load(true);
    job.then(function () { btn.classList.remove('busy'); });
  });

  if (!BUNDLE) {
    // Pull-to-refresh, for when the list is already at the top.
    var startY = 0, pulling = false;
    window.addEventListener('touchstart', function (e) {
      if (window.scrollY <= 0 && !player.classList.contains('open')) {
        startY = e.touches[0].clientY; pulling = true;
      }
    }, { passive: true });
    window.addEventListener('touchend', function (e) {
      if (pulling && e.changedTouches[0].clientY - startY > 90) btn.click();
      pulling = false;
    }, { passive: true });
  }

  /* ---------------- build stamp + service worker ---------------- */

  if (window.__ARCADE_VERSION__) {
    var vEl = document.getElementById('version');
    vEl.textContent = 'v' + window.__ARCADE_VERSION__;
    vEl.hidden = false;
  }

  // Relative on purpose: this has to work from a GitHub Pages project subpath.
  if (window.__ARCADE_SW__ && 'serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
    var reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (reloading) return;
      reloading = true;
      location.reload();
    });
  }

  load(false);
})();
</script>
</body>
</html>
