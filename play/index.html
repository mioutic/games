<style>
  :root {
    --bg: #0b0b12;
    --card: #16161f;
    --card-hi: #1e1e2b;
    --line: #272733;
    --text: #f2f2f7;
    --dim: #8e8e99;
    --accent: #7c5cff;
    --accent-2: #ff5c9d;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font: 400 17px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;        /* no rubber-band pull-to-refresh */
    touch-action: manipulation;       /* no double-tap zoom */
  }
  body { overflow-x: hidden; }

  .version {
    position: fixed; z-index: 60;
    right: calc(var(--safe-r) + 10px); bottom: calc(var(--safe-b) + 8px);
    font: 500 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .06em; color: #45454f; pointer-events: none;
    font-variant-numeric: tabular-nums;
  }
  .version[hidden] { display: none; }

  /* ---------- shell ---------- */
  .wrap {
    padding: calc(var(--safe-t) + 14px) calc(var(--safe-r) + 16px)
             calc(var(--safe-b) + 40px) calc(var(--safe-l) + 16px);
    max-width: 760px; margin: 0 auto;
  }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  h1 {
    font: 700 34px/1.1 -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
    letter-spacing: -0.02em; margin: 0;
    background: linear-gradient(100deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { color: var(--dim); font-size: 13px; margin-top: 4px; letter-spacing: .01em; }
  .refresh {
    appearance: none; border: 1px solid var(--line); background: var(--card);
    color: var(--text); width: 40px; height: 40px; border-radius: 20px;
    font-size: 17px; display: grid; place-items: center; flex: none;
    transition: transform .15s ease, background .15s ease;
  }
  .refresh:active { transform: scale(.92); background: var(--card-hi); }
  .refresh.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- grid ---------- */
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(3, 1fr); } }

  .card {
    position: relative; display: block; text-align: left;
    appearance: none; border: 1px solid var(--line); border-radius: 20px;
    background: linear-gradient(160deg, var(--card-hi), var(--card));
    color: inherit; padding: 16px 14px 14px; overflow: hidden;
    transition: transform .18s cubic-bezier(.2,.9,.3,1.2), border-color .18s ease;
    min-height: 138px;
  }
  .card:active { transform: scale(.955); border-color: var(--accent); }
  .card .glow {
    position: absolute; inset: -40% -30% auto auto; width: 130px; height: 130px;
    border-radius: 50%; filter: blur(28px); opacity: .5; pointer-events: none;
  }
  .card .emoji { font-size: 34px; line-height: 1; display: block; margin-bottom: 10px; }
  .card .name { font-weight: 600; font-size: 16px; letter-spacing: -.01em; }
  .card .desc { color: var(--dim); font-size: 12.5px; margin-top: 3px; line-height: 1.35;
                display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* ---------- states ---------- */
  .state { text-align: center; color: var(--dim); padding: 56px 20px; font-size: 14.5px; line-height: 1.6; }
  .state code { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; font-size: 12.5px; }
  .skel { min-height: 138px; border-radius: 20px; border: 1px solid var(--line);
          background: linear-gradient(100deg, var(--card) 30%, var(--card-hi) 50%, var(--card) 70%);
          background-size: 300% 100%; animation: shimmer 1.3s ease-in-out infinite; }
  @keyframes shimmer { to { background-position: -150% 0; } }

  .foot { margin-top: 26px; color: #55555f; font-size: 11.5px; text-align: center; line-height: 1.7; }
  .foot b { color: var(--dim); font-weight: 500; }

  /* ---------- player ---------- */
  .player {
    position: fixed; inset: 0; background: #000; z-index: 50;
    display: flex; flex-direction: column;
    transform: translateY(100%); transition: transform .32s cubic-bezier(.32,.72,0,1);
    visibility: hidden;
  }
  .player.open { transform: translateY(0); visibility: visible; }
  .player .bar {
    flex: none; display: flex; align-items: center; gap: 10px;
    padding: calc(var(--safe-t) + 8px) calc(var(--safe-r) + 12px) 8px calc(var(--safe-l) + 8px);
    background: rgba(11,11,18,.82); backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid var(--line);
  }
  .back {
    appearance: none; border: 0; background: transparent; color: var(--accent);
    font-size: 16px; font-weight: 500; display: flex; align-items: center; gap: 3px;
    padding: 8px 10px 8px 6px; border-radius: 10px;
  }
  .back:active { opacity: .5; }
  .player .title { font-size: 15px; font-weight: 600; flex: 1; text-align: center;
                   margin-right: 66px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .player iframe { flex: 1; width: 100%; border: 0; background: #000; display: block; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>Arcade</h1>
      <div class="sub" id="sub">Loading…</div>
    </div>
    <button class="refresh" id="refresh" aria-label="Refresh game list">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>
      </svg>
    </button>
  </header>

  <div class="grid" id="grid">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </div>

  <div class="foot">
    <b>Add a game:</b> drop a folder into <code>arcade/games/</code> with an
    <code>index.html</code>, push, then pull-to-refresh here.
  </div>
</div>

<div class="player" id="player">
  <div class="bar">
    <button class="back" id="back">
      <svg width="11" height="18" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg>
      Arcade
    </button>
    <div class="title" id="ptitle"></div>
  </div>
  <iframe id="frame" allow="autoplay; fullscreen; gamepad; accelerometer; gyroscope"
          referrerpolicy="no-referrer" title="Game"></iframe>
</div>

<div class="version" id="version" hidden></div>

<script>
window.__ARCADE_BUNDLE__ = {"games": [{"slug": "reflex", "name": "Reflex", "emoji": "⚡️", "description": "Tap the lit tile. Fifteen rounds, one average.", "color": "#ffb020", "entry": "index.html"}, {"slug": "snake", "name": "Snake", "emoji": "🐍", "description": "Swipe to steer. Don't bite yourself.", "color": "#3ecf8e", "entry": "index.html"}], "html": {"reflex": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Reflex</title>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no\">\n<style>\n  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }\n  html, body { margin: 0; height: 100%; background: #0b0b12; color: #f2f2f7; overflow: hidden;\n    font: 400 17px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }\n  #app { height: 100%; display: flex; flex-direction: column;\n         padding: 14px calc(env(safe-area-inset-right,0px) + 14px)\n                  calc(env(safe-area-inset-bottom,0px) + 14px) calc(env(safe-area-inset-left,0px) + 14px); }\n\n  .hud { flex: none; display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }\n  .hud .stat { text-align: center; flex: 1; }\n  .hud .k { font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: #8e8e99; }\n  .hud .v { font-size: 21px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }\n  .hud .v.warm { color: #ffb020; }\n\n  .board { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr);\n           gap: 10px; min-height: 0; }\n  .tile { border-radius: 18px; background: #16161f; border: 1px solid #272733;\n          transition: background .09s ease, transform .09s ease, border-color .09s ease; }\n  .tile.lit { background: linear-gradient(150deg, #ffc94d, #ffb020); border-color: #ffd882;\n              box-shadow: 0 0 34px -6px rgba(255,176,32,.75); }\n  .tile.hit { transform: scale(.9); }\n  .tile.bad { background: #33161c; border-color: #a3324a; }\n\n  .overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px;\n             background: rgba(11,11,18,.9); backdrop-filter: blur(14px); text-align: center; }\n  .overlay.hide { display: none; }\n  .overlay h2 { font-size: 30px; font-weight: 700; letter-spacing: -.02em; margin: 0 0 8px; }\n  .overlay p { color: #8e8e99; font-size: 14.5px; margin: 0 0 22px; max-width: 280px; line-height: 1.55; }\n  .big { font-size: 56px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums;\n         background: linear-gradient(100deg,#ffc94d,#ff5c9d); -webkit-background-clip: text; background-clip: text; color: transparent; }\n  .big small { font-size: 20px; font-weight: 600; -webkit-text-fill-color: #8e8e99; }\n  button.go { appearance: none; border: 0; border-radius: 999px; padding: 15px 40px; font-size: 17px; font-weight: 600;\n              color: #14141c; background: linear-gradient(100deg,#ffc94d,#ffb020); }\n  button.go:active { transform: scale(.95); }\n</style>\n</head>\n<body>\n<div id=\"app\">\n  <div class=\"hud\">\n    <div class=\"stat\"><div class=\"k\">Round</div><div class=\"v\" id=\"round\">0<small style=\"font-size:13px;color:#55555f\">/15</small></div></div>\n    <div class=\"stat\"><div class=\"k\">Last</div><div class=\"v\" id=\"last\">—</div></div>\n    <div class=\"stat\"><div class=\"k\">Best avg</div><div class=\"v warm\" id=\"best\">—</div></div>\n  </div>\n  <div class=\"board\" id=\"board\"></div>\n</div>\n\n<div class=\"overlay\" id=\"overlay\">\n  <div>\n    <div id=\"head\">\n      <h2>Reflex</h2>\n      <p>One tile lights up. Tap it. Fifteen rounds, and we average your reaction time.</p>\n    </div>\n    <button class=\"go\" id=\"go\">Start</button>\n  </div>\n</div>\n\n<script>\n(function () {\n  'use strict';\n\n  var ROUNDS = 15, TILES = 12, BKEY = 'reflex.best';\n\n  var board   = document.getElementById('board');\n  var overlay = document.getElementById('overlay');\n  var head    = document.getElementById('head');\n  var elRound = document.getElementById('round');\n  var elLast  = document.getElementById('last');\n  var elBest  = document.getElementById('best');\n\n  var tiles = [], times = [], round = 0, active = -1, litAt = 0, waiting = null;\n\n  for (var i = 0; i < TILES; i++) {\n    var t = document.createElement('div');\n    t.className = 'tile';\n    t.dataset.i = i;\n    board.appendChild(t);\n    tiles.push(t);\n  }\n\n  var best = parseFloat(localStorage.getItem(BKEY) || '0') || 0;\n  if (best) elBest.textContent = Math.round(best) + 'ms';\n\n  board.addEventListener('pointerdown', function (e) {\n    var t = e.target.closest('.tile');\n    if (!t || active < 0) return;\n    e.preventDefault();\n\n    if (+t.dataset.i === active) {\n      var ms = performance.now() - litAt;\n      times.push(ms);\n      elLast.textContent = Math.round(ms) + 'ms';\n      t.classList.remove('lit');\n      t.classList.add('hit');\n      setTimeout(function () { t.classList.remove('hit'); }, 110);\n      active = -1;\n      if (round >= ROUNDS) finish(); else next();\n    } else {\n      // Missing costs you: a 150ms penalty folded into this round.\n      t.classList.add('bad');\n      setTimeout(function () { t.classList.remove('bad'); }, 140);\n      litAt -= 150;\n      if (navigator.vibrate) navigator.vibrate(12);\n    }\n  });\n\n  function next() {\n    round++;\n    elRound.innerHTML = round + '<small style=\"font-size:13px;color:#55555f\">/' + ROUNDS + '</small>';\n    var delay = 450 + Math.random() * 1250;\n    waiting = setTimeout(function () {\n      var i;\n      do { i = Math.floor(Math.random() * TILES); } while (i === active);\n      active = i;\n      tiles[i].classList.add('lit');\n      litAt = performance.now();\n    }, delay);\n  }\n\n  function finish() {\n    var avg = times.reduce(function (a, b) { return a + b; }, 0) / times.length;\n    var isBest = !best || avg < best;\n    if (isBest) { best = avg; localStorage.setItem(BKEY, String(avg)); elBest.textContent = Math.round(avg) + 'ms'; }\n\n    head.innerHTML =\n      '<div class=\"big\">' + Math.round(avg) + '<small>ms avg</small></div>' +\n      '<p>' + (isBest ? 'New personal best.' : 'Best is ' + Math.round(best) + 'ms.') +\n      ' Fastest single tap: ' + Math.round(Math.min.apply(null, times)) + 'ms.</p>';\n    document.getElementById('go').textContent = 'Again';\n    overlay.classList.remove('hide');\n  }\n\n  document.getElementById('go').addEventListener('click', function () {\n    clearTimeout(waiting);\n    tiles.forEach(function (t) { t.className = 'tile'; });\n    times = []; round = 0; active = -1;\n    elLast.textContent = '—';\n    overlay.classList.add('hide');\n    next();\n  });\n})();\n<\/script>\n</body>\n</html>\n", "snake": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Snake</title>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no\">\n<style>\n  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }\n  html, body { margin: 0; height: 100%; background: #0b0b12; color: #f2f2f7; overflow: hidden; touch-action: none;\n    font: 400 17px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }\n  #app { height: 100%; display: flex; flex-direction: column; align-items: center;\n         padding: 14px calc(env(safe-area-inset-right,0px) + 14px)\n                  calc(env(safe-area-inset-bottom,0px) + 14px) calc(env(safe-area-inset-left,0px) + 14px); }\n  .hud { flex: none; width: 100%; max-width: 520px; display: flex; justify-content: space-between; margin-bottom: 12px; }\n  .stat { text-align: center; flex: 1; }\n  .k { font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: #8e8e99; }\n  .v { font-size: 21px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }\n  .v.green { color: #3ecf8e; }\n  .stage { flex: 1; width: 100%; display: grid; place-items: center; min-height: 0; }\n  canvas { background: #12121a; border: 1px solid #272733; border-radius: 20px; display: block;\n           max-width: 100%; max-height: 100%; touch-action: none; }\n  .hint { flex: none; color: #55555f; font-size: 12px; margin-top: 12px; }\n\n  .overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px;\n             background: rgba(11,11,18,.9); backdrop-filter: blur(14px); text-align: center; }\n  .overlay.hide { display: none; }\n  .overlay h2 { font-size: 30px; font-weight: 700; letter-spacing: -.02em; margin: 0 0 8px; }\n  .overlay p { color: #8e8e99; font-size: 14.5px; margin: 0 0 22px; max-width: 280px; line-height: 1.55; }\n  .big { font-size: 56px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums;\n         background: linear-gradient(100deg,#3ecf8e,#4aa8ff); -webkit-background-clip: text; background-clip: text; color: transparent; }\n  button.go { appearance: none; border: 0; border-radius: 999px; padding: 15px 40px; font-size: 17px; font-weight: 600;\n              color: #08160f; background: linear-gradient(100deg,#5fe0a5,#3ecf8e); }\n  button.go:active { transform: scale(.95); }\n</style>\n</head>\n<body>\n<div id=\"app\">\n  <div class=\"hud\">\n    <div class=\"stat\"><div class=\"k\">Score</div><div class=\"v\" id=\"score\">0</div></div>\n    <div class=\"stat\"><div class=\"k\">Best</div><div class=\"v green\" id=\"best\">0</div></div>\n  </div>\n  <div class=\"stage\"><canvas id=\"cv\"></canvas></div>\n  <div class=\"hint\">Swipe anywhere to steer</div>\n</div>\n\n<div class=\"overlay\" id=\"overlay\">\n  <div>\n    <div id=\"head\">\n      <h2>Snake</h2>\n      <p>Swipe to steer. Eat the dots, grow, and stay off yourself. Walls wrap.</p>\n    </div>\n    <button class=\"go\" id=\"go\">Start</button>\n  </div>\n</div>\n\n<script>\n(function () {\n  'use strict';\n\n  var N = 17, BKEY = 'snake.best';\n  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');\n  var overlay = document.getElementById('overlay'), head = document.getElementById('head');\n  var elScore = document.getElementById('score'), elBest = document.getElementById('best');\n\n  var cell = 0, dpr = Math.min(window.devicePixelRatio || 1, 3);\n  var snake, dir, queued, food, score, tick, timer, dead = true;\n\n  var best = parseInt(localStorage.getItem(BKEY) || '0', 10) || 0;\n  elBest.textContent = best;\n\n  function size() {\n    var stage = document.querySelector('.stage');\n    var side = Math.floor(Math.min(stage.clientWidth, stage.clientHeight));\n    side = Math.max(160, side - (side % N));\n    cell = side / N;\n    cv.style.width = side + 'px';\n    cv.style.height = side + 'px';\n    cv.width = side * dpr;\n    cv.height = side * dpr;\n    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n    draw();\n  }\n  window.addEventListener('resize', size);\n\n  function spawnFood() {\n    var open = [];\n    for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) {\n      if (!snake.some(function (s) { return s.x === x && s.y === y; })) open.push({ x: x, y: y });\n    }\n    food = open[Math.floor(Math.random() * open.length)];\n  }\n\n  function reset() {\n    snake = [{ x: 8, y: 8 }, { x: 7, y: 8 }, { x: 6, y: 8 }];\n    dir = { x: 1, y: 0 };\n    queued = null;\n    score = 0; tick = 145; dead = false;\n    elScore.textContent = '0';\n    spawnFood();\n    clearInterval(timer);\n    timer = setInterval(step, tick);\n    draw();\n  }\n\n  function step() {\n    if (queued) { dir = queued; queued = null; }\n    var h = { x: (snake[0].x + dir.x + N) % N, y: (snake[0].y + dir.y + N) % N };\n\n    if (snake.some(function (s, i) { return i < snake.length - 1 && s.x === h.x && s.y === h.y; })) return die();\n\n    snake.unshift(h);\n    if (h.x === food.x && h.y === food.y) {\n      score++;\n      elScore.textContent = score;\n      spawnFood();\n      if (score % 4 === 0 && tick > 70) {           // ramp the pace every few bites\n        tick -= 8;\n        clearInterval(timer);\n        timer = setInterval(step, tick);\n      }\n      if (navigator.vibrate) navigator.vibrate(8);\n    } else {\n      snake.pop();\n    }\n    draw();\n  }\n\n  function die() {\n    dead = true;\n    clearInterval(timer);\n    if (navigator.vibrate) navigator.vibrate([18, 40, 18]);\n    if (score > best) { best = score; localStorage.setItem(BKEY, String(best)); elBest.textContent = best; }\n    head.innerHTML = '<div class=\"big\">' + score + '</div>' +\n      '<p>' + (score >= best && score > 0 ? 'New best.' : 'Best so far: ' + best + '.') + '</p>';\n    document.getElementById('go').textContent = 'Again';\n    overlay.classList.remove('hide');\n  }\n\n  function rr(x, y, w, h, r) {\n    ctx.beginPath();\n    ctx.moveTo(x + r, y);\n    ctx.arcTo(x + w, y, x + w, y + h, r);\n    ctx.arcTo(x + w, y + h, x, y + h, r);\n    ctx.arcTo(x, y + h, x, y, r);\n    ctx.arcTo(x, y, x + w, y, r);\n    ctx.closePath();\n    ctx.fill();\n  }\n\n  function draw() {\n    if (!cell) return;\n    var side = N * cell;\n    ctx.clearRect(0, 0, side, side);\n\n    if (food) {\n      ctx.fillStyle = '#ff5c9d';\n      var p = cell * 0.26;\n      rr(food.x * cell + p, food.y * cell + p, cell - p * 2, cell - p * 2, (cell - p * 2) / 2);\n    }\n    if (snake) {\n      for (var i = snake.length - 1; i >= 0; i--) {\n        var t = 1 - (i / Math.max(snake.length, 1)) * 0.55;\n        ctx.fillStyle = i === 0 ? '#7fe9b6' : 'rgba(62,207,142,' + t.toFixed(3) + ')';\n        var m = cell * 0.09;\n        rr(snake[i].x * cell + m, snake[i].y * cell + m, cell - m * 2, cell - m * 2, cell * 0.28);\n      }\n    }\n  }\n\n  function turn(x, y) {\n    var cur = queued || dir;\n    if (cur.x === -x && cur.y === -y) return;   // no instant reversals\n    if (cur.x === x && cur.y === y) return;\n    queued = { x: x, y: y };\n  }\n\n  var sx = 0, sy = 0, swiping = false;\n  window.addEventListener('touchstart', function (e) {\n    sx = e.touches[0].clientX; sy = e.touches[0].clientY; swiping = true;\n  }, { passive: true });\n  window.addEventListener('touchmove', function (e) {\n    if (!swiping || dead) return;\n    var dx = e.touches[0].clientX - sx, dy = e.touches[0].clientY - sy;\n    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;\n    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0); else turn(0, dy > 0 ? 1 : -1);\n    swiping = false;\n  }, { passive: true });\n\n  window.addEventListener('keydown', function (e) {\n    var m = { ArrowUp: [0,-1], ArrowDown: [0,1], ArrowLeft: [-1,0], ArrowRight: [1,0],\n              w: [0,-1], s: [0,1], a: [-1,0], d: [1,0] }[e.key];\n    if (m) { e.preventDefault(); turn(m[0], m[1]); }\n  });\n\n  document.getElementById('go').addEventListener('click', function () {\n    overlay.classList.add('hide');\n    reset();\n  });\n\n  size();\n})();\n<\/script>\n</body>\n</html>\n"}};
window.__ARCADE_VERSION__ = "1.0.0";

<script>
(function () {
  'use strict';

  // Discovery order: games.json served from this same origin (CI regenerates it
  // on every push, so it needs no token and works on a private repo), then the
  // GitHub API as a fallback for a public repo whose index hasn't been built.
  var REPO   = 'mioutic/games';
  var DIR    = 'arcade/games';
  var REFS   = ['main', 'claude/iphone-game-browser-5qg6ng'];   // tried in order
  var TTL    = 5 * 60 * 1000;
  var CKEY   = 'arcade.cache.v1';

  var PALETTE = ['#7c5cff', '#ff5c9d', '#3ecf8e', '#ffb020', '#4aa8ff', '#ff6b5c', '#c05cff', '#2fd8c6'];

  var grid   = document.getElementById('grid');
  var sub    = document.getElementById('sub');
  var player = document.getElementById('player');
  var frame  = document.getElementById('frame');
  var ptitle = document.getElementById('ptitle');

  /* ---------------- discovery ---------------- */

  // A bundled build (see tools/build-bundle.py) inlines every game into one
  // file so the launcher works with no server and no network at all.
  var BUNDLE = window.__ARCADE_BUNDLE__ || null;

  function discover() {
    if (BUNDLE) return Promise.resolve(BUNDLE.games.map(normalize));
    return fetch('games.json', { cache: 'no-cache' })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)); })
      .then(function (data) {
        var list = (data && data.games) || [];
        if (!list.length) throw new Error('empty index');
        return list.map(normalize);
      })
      .catch(function () {
        return listFolders().then(function (slugs) { return Promise.all(slugs.sort().map(describe)); });
      });
  }

  function normalize(g) {
    var slug = g.slug;
    return {
      slug:  slug,
      name:  g.name || titleize(slug),
      desc:  g.description || '',
      emoji: g.emoji || '🎮',
      color: g.color || PALETTE[hash(slug) % PALETTE.length],
      entry: g.entry || 'index.html'
    };
  }

  function listFolders() {
    var i = 0;
    function attempt() {
      if (i >= REFS.length) return Promise.reject(new Error('no ref matched'));
      var ref = REFS[i++];
      var url = 'https://api.github.com/repos/' + REPO + '/contents/' + DIR + '?ref=' + encodeURIComponent(ref);
      return fetch(url, { headers: { Accept: 'application/vnd.github+json' } })
        .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)); })
        .then(function (items) {
          var dirs = (items || []).filter(function (it) { return it.type === 'dir'; })
                                  .map(function (it) { return it.name; });
          return dirs.length ? dirs : attempt();
        })
        .catch(attempt);
    }
    return attempt();
  }

  // Metadata comes from the site itself (same origin, no rate limit). A game.json
  // is optional — without one we derive a decent title from the folder name.
  function describe(slug) {
    return fetch('games/' + slug + '/game.json', { cache: 'no-cache' })
      .then(function (r) { return r.ok ? r.json() : {}; })
      .catch(function () { return {}; })
      .then(function (meta) {
        return {
          slug:  slug,
          name:  meta.name || titleize(slug),
          desc:  meta.description || '',
          emoji: meta.emoji || '🎮',
          color: meta.color || PALETTE[hash(slug) % PALETTE.length],
          entry: meta.entry || 'index.html'
        };
      });
  }

  function titleize(s) {
    return s.replace(/[-_]+/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); });
  }
  function hash(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return h;
  }

  /* ---------------- render ---------------- */

  function render(games) {
    grid.innerHTML = '';
    if (!games.length) {
      sub.textContent = 'No games yet';
      var s = document.createElement('div');
      s.className = 'state';
      s.style.gridColumn = '1 / -1';
      s.innerHTML = 'Nothing here yet.<br>Drop a folder with an <code>index.html</code> into <code>arcade/games/</code>.';
      grid.appendChild(s);
      return;
    }
    sub.textContent = games.length + (games.length === 1 ? ' game' : ' games') + ' · tap to play';

    games.forEach(function (g) {
      var b = document.createElement('button');
      b.className = 'card';

      var glow = document.createElement('div');
      glow.className = 'glow';
      glow.style.background = g.color;

      var em = document.createElement('span');
      em.className = 'emoji';
      em.textContent = g.emoji;

      var nm = document.createElement('div');
      nm.className = 'name';
      nm.textContent = g.name;

      b.appendChild(glow);
      b.appendChild(em);
      b.appendChild(nm);

      if (g.desc) {
        var d = document.createElement('div');
        d.className = 'desc';
        d.textContent = g.desc;
        b.appendChild(d);
      }

      b.addEventListener('click', function () { open(g); });
      grid.appendChild(b);
    });
  }

  function showError(msg) {
    sub.textContent = 'Offline';
    grid.innerHTML = '';
    var s = document.createElement('div');
    s.className = 'state';
    s.style.gridColumn = '1 / -1';
    s.textContent = msg;
    grid.appendChild(s);
  }

  /* ---------------- player ---------------- */

  function open(g) {
    ptitle.textContent = g.name;
    if (BUNDLE) {
      frame.removeAttribute('src');
      frame.srcdoc = BUNDLE.html[g.slug] || '<p style="color:#fff;font:16px sans-serif">Missing.</p>';
    } else {
      frame.src = 'games/' + g.slug + '/' + g.entry;
    }
    player.classList.add('open');
    document.body.style.overflow = 'hidden';
    if (history.pushState) history.pushState({ game: g.slug }, '', '#' + g.slug);
  }

  function close() {
    player.classList.remove('open');
    document.body.style.overflow = '';
    setTimeout(function () {
      if (player.classList.contains('open')) return;
      frame.removeAttribute('srcdoc');
      frame.src = 'about:blank';
    }, 340);
  }

  document.getElementById('back').addEventListener('click', function () {
    if (location.hash) history.back(); else close();
  });
  window.addEventListener('popstate', close);

  /* ---------------- load ---------------- */

  function load(force) {
    var cached = null;
    try { cached = JSON.parse(localStorage.getItem(CKEY) || 'null'); } catch (e) {}

    if (cached && cached.games && !force && Date.now() - cached.at < TTL) {
      render(cached.games);
      return Promise.resolve();
    }
    if (cached && cached.games && cached.games.length) render(cached.games);  // instant paint, refresh behind

    return discover()
      .then(function (games) {
        try { localStorage.setItem(CKEY, JSON.stringify({ at: Date.now(), games: games })); } catch (e) {}
        render(games);
      })
      .catch(function (err) {
        if (cached && cached.games && cached.games.length) {
          sub.textContent = cached.games.length + ' games · cached';
        } else {
          showError('Could not load the game list. Check your connection and pull down to refresh.');
        }
      });
  }

  /* ---------------- refresh ---------------- */

  var btn = document.getElementById('refresh');

  // In a bundled build the list is baked in, so there is nothing to re-fetch —
  // the button checks for a newer service worker instead.
  function checkForUpdate() {
    if (!('serviceWorker' in navigator)) return Promise.resolve();
    return navigator.serviceWorker.getRegistration()
      .then(function (reg) {
        if (!reg) return;
        return reg.update().then(function () {
          if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
        });
      })
      .catch(function () {});
  }

  btn.addEventListener('click', function () {
    btn.classList.add('spin');
    var job = BUNDLE
      ? checkForUpdate().then(function () { location.reload(); })
      : load(true);
    job.then(function () { btn.classList.remove('spin'); });
  });

  if (!BUNDLE) {
    // Pull-to-refresh, for when the list is already at the top.
    var startY = 0, pulling = false;
    window.addEventListener('touchstart', function (e) {
      if (window.scrollY <= 0 && !player.classList.contains('open')) {
        startY = e.touches[0].clientY; pulling = true;
      }
    }, { passive: true });
    window.addEventListener('touchend', function (e) {
      if (pulling && e.changedTouches[0].clientY - startY > 90) btn.click();
      pulling = false;
    }, { passive: true });
  }

  /* ---------------- build stamp + service worker ---------------- */

  if (window.__ARCADE_VERSION__) {
    var v = document.getElementById('version');
    v.textContent = 'v' + window.__ARCADE_VERSION__;
    v.hidden = false;
  }

  // Relative on purpose: this has to work from a GitHub Pages project subpath.
  if (window.__ARCADE_SW__ && 'serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
    var reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (reloading) return;
      reloading = true;
      location.reload();
    });
  }

  load(false);
})();
</script>
